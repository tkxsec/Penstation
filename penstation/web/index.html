   map, and the map is what the active tools are pointed at.

   Driven by the coverage kinds the baseline already declares, not by tool name
   — add a third subdomain-enum tool and it joins the parallel start; swap dig
   for another `resolve` tool and the last step follows it.
*/
let recon = null;   // {step, pending:Set, runs:{tool->runId}, resolver, msg, note}

// What each tool has turned up so far, read from its own stream. Live, because
// a passive source gives you no other progress signal: a subdomain appearing is
// the only sign the thing is working.
const reconSeen = new Map();   // tool id -> Set of values, in arrival order

// Deliberately narrow. bbot's log carries pip output, tracebacks and its own
// filenames, and a greedy match offers all of them as findings — anchoring to
// the engagement's own domains keeps this column to things that could actually
// be results. It is a progress view, not a decision: what lands on the map is
// still the server reading the tool's result file when the run ends.
function reconScan(id, chunk){
  const roots = ((proj && proj.scope_all) || []).filter(r=>!r.includes("/"));
  // Names are the signal for a discovery tool; for everything downstream of it
  // the targets are addresses, and matching only scope-shaped names left nmap's
  // column reading 0 for the whole scan — the one moment you want a sign of
  // life. -vv prints "Discovered open port 443/tcp on 198.51.100.11" as it goes.
  const wantIps = ((tools.get(id)||{}).check !== "subdomain-enum");
  const set = reconSeen.get(id) || new Set();
  const add = v => { if(set.size < 400) set.add(v); };
  (chunk.match(/[a-z0-9_*.-]+/gi) || []).forEach(tok=>{
    const v = tok.toLowerCase().replace(/^[_*]wildcard\./, "").replace(/^\*\./, "")
                 .replace(/\.$/, "");
    if(roots.some(r=>v === r || v.endsWith("." + r))) add(v);
  });
  if(wantIps) (chunk.match(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g) || []).forEach(add);
  reconSeen.set(id, set);
}

const reconDiscovery = () => [...tools.values()]
  .filter(t=>t.baseline && t.check === "subdomain-enum" && t.status === "ready")
  .sort((a,b)=>(a.baseline_order||0)-(b.baseline_order||0));
const reconResolver = () => [...tools.values()]
  .find(t=>t.baseline && t.check === "resolve" && t.status === "ready");

// Run a phase. Reconnaissance is the two-stage one — enumerate with everything
// that discovers, map it, then resolve what came back — because resolution has
// to see the names first. Every other phase is one stage: its tools all read
// the map, so they can go at once and their output is mapped when they finish.
// A tool that only declares `targets` is a microscope: you aim it at one node,
// and it has no way to read the map. Sweeping it as part of a phase ran it
// against the project's apex domain every time, whatever the phase had actually
// found — so a Web Analysis run fetched the front page again while the tool that
// reads the map did the work. Tools that declare neither (bbot, subfinder) start
// from the scope itself and do belong in the sweep.
const sweeps = t => (t.consumes||[]).length > 0 || !(t.targets||[]).length;

async function startPhase(key){
  const ready = phaseTools(key).filter(t=>t.status === "ready" && sweeps(t));
  if(!proj || !ready.length || (recon && recon.step !== "done")) return;
  const twoStage = key === reconPhase();
  const first = twoStage ? reconDiscovery() : ready;
  if(!first.length) return;
  recon = {phase:key, twoStage, step:"discovery",
           pending:new Set(first.map(t=>t.id)), runs:{}, mapped:{},
           // The tools this run is actually about. Without it the panel drew
           // the subdomain pair for every phase — so starting Active Scanning
           // showed bbot's and subfinder's finished output while nmap ran with
           // nowhere on screen to appear, the phase's own cards having been
           // hidden to avoid showing the streams twice.
           tools:first.map(t=>t.id),
           msg:"", note:""};
  reconSeen.clear();
  openTools.delete(key);      // the sequence has its own panes; the cards would
  render();                   // put the same streams on screen twice
  // Together, not in turn: they read the map rather than each other, so running
  // them in sequence only costs you the slower one.
  await Promise.all(first.map(t=>reconRun(t, mapInput(t.id).vals.join("\n"))));
}
const startRecon = () => startPhase(recon ? recon.phase : reconPhase());

function cancelRecon(){ recon = null; render(); }

async function reconRun(t, inputText){
  const command = plannedCommand(t);
  if(!command){
    recon.pending.delete(t.id);
    recon.msg = `${t.id}: no command to run — check its Run box`;
    render();
    return;
  }
  // No open.add here: the sequence shows this run in its own panel, and
  // expanding the card as well would put the same stream on screen twice.
  runs.set(t.id, {busy:true}); runout.set(t.id, ""); promote.delete(t.id);
  render();
  try{
    const d = await (await fetch(`/tools/${t.id}/run`,{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({command, project: proj.id, section: sectionOf(t.id),
                           input: inputText || ""})})).json();
    if(d.error){
      runs.set(t.id, {error:d.error});
      recon.pending.delete(t.id);
      recon.msg = `${t.id}: ${d.error}`;
      render();
    }
  }catch(e){
    runs.set(t.id, {error:"request failed"});
    recon.pending.delete(t.id);
    recon.msg = `${t.id}: request failed`;
    render();
  }
}

// Every tool in the current step has finished.
function reconAdvance(){
  if(recon.step === "discovery") reconMap();
  else if(recon.step === "resolve") reconResolved();
}

// Everything both tools found goes on the map, unreviewed. Nothing is thrown
// away at this point and nothing is judged: what a public source says exists is
// a fact worth recording either way, and the map flags each name against the
// engagement's scope so the ones that are yours to scan are already separated
// from the ones that merely came back with them.
async function reconMap(){
  recon.step = "mapping"; recon.msg = "reading output…"; render();

  // Read every tool before deciding anything. Folding has to see the whole
  // round: bbot reports the wildcard and subfinder reports the names sitting
  // under it, so classifying-and-posting one tool at a time meant the fold
  // depended on which container happened to finish first — the same scan
  // mapping two junk nodes or none, run to run.
  const results = [];
  for(const [tool, runId] of Object.entries(recon.runs)){
    try{
      const d = await (await fetch(`/projects/${proj.id}/map/classify`,{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({run:runId})})).json();
      results.push({tool, runId, d});
    }catch(e){ recon.msg = `${tool}: could not read its output`; }
  }
  const wilds = new Set([
    ...Object.values(mapData.nodes||{})
      .filter(n=>(n.tags||[]).includes("wildcard")).map(n=>n.value),
    ...results.flatMap(({d})=>(d.rows||[]).filter(r=>r.wildcard).map(r=>r.value)),
  ]);
  const underWildcard = v => [...wilds].find(w=>v !== w && v.endsWith("." + w)) || "";

  const seen = new Set();
  let added = 0, linked = 0, oos = 0, under = 0;
  // Per run, not as one batch: a node records the run and tool that found it,
  // and merging two tools' rows into one post would credit both to whichever
  // run id was sent.
  for(const {tool, runId, d} of results){
    // The same name from both tools is one node; the first to report it keeps
    // the attribution rather than the map recording whichever finished last.
    const fresh = (d.rows||[]).filter(r=>!r.known && !r.enrich_only
                                          && !seen.has(r.id));
    // Evidence about nodes the map already holds — a host's port counts, a port
    // that came back filtered this time. Applied without being offered, because
    // it is not a decision. This is the path a phase run takes, so without it a
    // re-scan landed nothing at all: every row was `known`, and every scan.*
    // attribute was dropped for being familiar.
    const updates = (d.rows||[]).filter(r=>r.known && r.attrs
                                           && Object.keys(r.attrs).length);
    // Marked here as well as on the server, because the server only knows the
    // wildcards it had already been told about — the one bbot found this round
    // may not have been posted yet when subfinder's rows were classified.
    const rows = fresh.map(r=>{
      const w = r.under_wildcard
        || (r.kind === "domain" && !r.wildcard ? underWildcard(r.value) : "");
      if(w) under++;
      return w ? {...r, under_wildcard: w} : r;
    });
    rows.forEach(r=>seen.add(r.id));
    oos += rows.filter(r=>!r.in_scope).length;
    // What this tool actually contributed, for its column in the panel: the
    // live list was everything its log mentioned, which is always more.
    // What this run put on the map, read the way the tool wrote it.
    //
    // The display form, not the bare value: nmap's rows are a host and its
    // ports, and every port on one host carries that host's address as its
    // value — so the column read as the same address three times over. As lines
    // it reads as the scan report does:
    //
    //   198.51.100.12 — 2 open · 998 filtered · 1000 tcp ports (syn)
    //   198.51.100.12:80/tcp open  tcpwrapped
    //   198.51.100.12:443/tcp open  tcpwrapped
    //
    // Updates are included, not just new nodes. A second scan of the same hosts
    // discovers nothing by definition, and a column that empties on the re-run
    // reads as a broken scan rather than a stable one. Tools whose rows carry
    // no attributes have no updates, so this is nmap-shaped without being
    // nmap-specific.
    recon.mapped[tool] = rows.concat(updates).map(r=>r.line || r.value);
    const ids = new Set([...rows.map(r=>r.id),
                         ...Object.keys(mapData.nodes||{})]);
    const edges = (d.edges||[]).filter(e=>ids.has(e.frm) && ids.has(e.to));
    if(!rows.length && !updates.length && !edges.length) continue;
    try{
      const res = await (await fetch(`/projects/${proj.id}/map`,{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({run:runId, rows:rows.concat(updates), edges})})).json();
      added += res.added||0; linked += res.linked||0;
    }catch(e){ recon.msg = `${tool}: adding failed`; }
  }
  recon.note = `${added} on the map`
    + (oos ? ` · ${oos} out of scope` : "")
    + (under ? ` · ${under} under a wildcard, scanned as one host` : "");
  recon.msg = "";
  await loadMap();
  // Only reconnaissance has a second stage. Anywhere else, mapping the output
  // is the end of the run.
  if(recon.twoStage) return reconResolve();
  recon.step = "done";
  recon.msg = added ? "done" : "nothing new";
  render();
}

// Resolve what is on the map now — including anything that was already there,
// because the resolver eats the map rather than this run's output.
async function reconResolve(){
  const dig = reconResolver();
  if(!dig){
    recon.step = "done";
    recon.msg = "nothing installed that resolves names";
    render();
    return;
  }
  const mi = mapInput(dig.id);
  if(!mi.vals.length){
    recon.step = "done";
    recon.msg = "nothing on the map to resolve";
    render();
    return;
  }
  recon.step = "resolve";
  recon.pending = new Set([dig.id]);
  recon.runs = {};
  recon.resolver = dig.id;
  recon.asked = mi.vals;      // to say which of them came back with nothing
  render();
  await reconRun(dig, mi.vals.join("\n"));
}

// Addresses go on the map without a second review. They are not a discovery you
// have to judge — they are where the names you already accepted point, and the
// resolution edge is the only thing that ties a host to the domain it serves.
// Anything the resolver reports that is *not* a resolution still goes through
// the normal box on the tool's own card.
async function reconResolved(){
  const runId = recon.runs[recon.resolver];
  if(!runId){ recon.step = "done"; recon.msg = "the resolver produced no run"; render(); return; }
  recon.msg = "reading resolutions…"; render();
  try{
    const d = await (await fetch(`/projects/${proj.id}/map/classify`,{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({run:runId})})).json();
    const fresh = (d.rows||[]).filter(r=>!r.known && !r.enrich_only);
    // Same rule as the manual box: a row the map already has, carrying new
    // evidence, is applied rather than dropped for being familiar.
    const updates = (d.rows||[]).filter(r=>r.known && r.attrs
                                           && Object.keys(r.attrs).length);
    // Ends that are on the map count as much as ends in this output: the domain
    // half of `domain resolves_to host` is on the map by definition here — you
    // just promoted it — so requiring both ends in the output would drop every
    // resolution, which is the whole point of this step.
    const ids = new Set([...(d.rows||[]).map(r=>r.id),
                         ...Object.keys(mapData.nodes||{})]);
    const edges = (d.edges||[]).filter(e=>ids.has(e.frm) && ids.has(e.to));
    let added = 0, linked = 0;
    if(fresh.length || updates.length || edges.length){
      const res = await (await fetch(`/projects/${proj.id}/map`,{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({run:runId, rows:fresh.concat(updates), edges})})).json();
      added = res.added||0; linked = res.linked||0;
    }
    recon.mapped[recon.resolver] = fresh.map(r=>r.value);
    // `+noall +answer` prints nothing at all for a name with no answer, so 13
    // names in and 5 lines out looks like the resolver dropped eight of them.
    // It didn't — they have no public record. That is worth knowing: an
    // internal-only service or a stale certificate entry is a finding, not a
    // gap in the tooling, and silence is the one thing that reads as a bug.
    const answered = new Set((d.edges||[])
      .map(e=>((d.rows||[]).find(r=>r.id === e.frm)||{}).value)
      .filter(Boolean));
    recon.unresolved = (recon.asked||[]).filter(v=>!answered.has(v));
    recon.step = "done";
    recon.msg = `${added} address${added===1?"":"es"} · ${linked} resolution${linked===1?"":"s"}`
      + (recon.unresolved.length ? ` · ${recon.unresolved.length} with no DNS answer` : "");
    await loadMap();
  }catch(e){
    recon.step = "done"; recon.msg = "could not read the resolver's output"; render();
  }
}

// Input lists per tool. For a tool that declares what it consumes these are
// filled from the map automatically — you confirm what is about to be scanned
// rather than copying it in by hand.
const inbox = new Map();
const inEdit = new Set();      // tools whose list you opened to change
const cmdEdit = new Set();     // tools whose command you opened to change

function editCommand(id){ cmdEdit.add(id); render();
  const el = document.getElementById("cmd-"+id); if(el){ el.focus(); el.select(); } }
function cancelCommand(id){ cmdEdit.delete(id); render(); }

// Empty saves as "no override", which is how you get the generated command back.
async function saveCommand(id){
  const el = document.getElementById("cmd-"+id);
  const cmd = (el ? el.value : "").trim();
  const d = await (await fetch(`/tools/${id}/command`,{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({command: cmd})})).json();
  if(d.error){ const e = document.getElementById("err"); if(e) e.textContent = d.error;
               return; }
  const t = tools.get(id);
  if(t) t.command_override = d.command_override;
  cmdEdit.delete(id);
  render();
}

function resetCommand(id){
  const el = document.getElementById("cmd-"+id);
  if(el) el.value = "";
  cmdEdit.delete(id);
  fetch(`/tools/${id}/command`,{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({command:""})}).then(async r=>{
      const d = await r.json();
      const t = tools.get(id);
      if(t) t.command_override = "";
      render();
    });
}

function toggleInEdit(id){
  inEdit.has(id) ? inEdit.delete(id) : inEdit.add(id);
  render();
}

// The box only appears when the command actually references {{input}} —
// otherwise it is a text area that does nothing, which invites confusion.
function syncInputBox(id){
  const cmd = (document.getElementById("cmd-"+id)||{}).value || "";
  const wrap = document.getElementById("inwrap-"+id);
  if(wrap) wrap.hidden = !/\{\{input\}\}/.test(cmd);
}
// Fill a tool's input from the map, using the kinds it declares it consumes.
// The map holds the scope roots *and* everything discovered since, so this is
// how one step's output becomes the next step's input: bbot finds subdomains,
// dig eats every domain on the map, nmap eats the hosts dig resolved.
//
// Past reconnaissance, only in-scope nodes. Everything a scan finds is recorded
// — a client's mail provider, a CDN, a partner domain in an SPF record — and
// recording is not permission to touch it. Scope used to be settled by you
// ticking rows on the way in, so filtering here would have second-guessed a
// decision you had already made; nothing is confirmed now, so the scope flag is
// the only thing standing between "bbot mentioned it" and "nmap scanned it".
//
// Reconnaissance keeps the whole map: asking a public resolver about a third
// party's name sends them nothing and is how you learn whose it is.
// How a node is written when you address it — on screen, and in the list a tool
// is handed.
//
// A port node is keyed on the host it belongs to, so its `value` is that host's
// address and nothing else: two ports on one host both read as `198.51.100.10`,
// and the port scanner's whole result — which port — was only in the node id.
// The same `value` is what builds a tool's input, so httpx, which consumes
// ports, was being handed three addresses twice over instead of the six
// host:port pairs nmap found, and would have probed the default ports rather
// than the ones actually open.
//
// A function declaration, not a const: the page renders once as it loads, and a
// later `const` would still be in its temporal dead zone by then.
// Which wildcard a name folds into, decided by the names alone.
//
// One rule, used by the list to nest rows and by the detail pane to say what a
// wildcard stands for — two derivations of the same thing would eventually
// disagree, and the disagreement would look like a bug in the map rather than
// in the drawing of it. Nearest wildcard wins, so a name under two nested ones
// folds into the closer.
//
// Not read from `contains` edges: those are only written when the wildcard is
// already on the map as the child is promoted, which depends on the order rows
// happened to arrive in. See renderMap.
function wildcardFor(node, wildcards){
  if(!node || node.kind !== "domain") return null;
  let best = null;
  for(const w of wildcards){
    if(!w || w.id === node.id || w.kind !== "domain") continue;
    if(!(w.tags||[]).includes("wildcard")) continue;
    if(!node.value.endsWith("." + w.value)) continue;
    if(!best || w.value.length > best.value.length) best = w;
  }
  return best;
}

// The names that fold into this wildcard, and nothing when it is not one.
function wildcardChildren(n){
  if(!n || !(n.tags||[]).includes("wildcard")) return [];
  const all = Object.values(mapData.nodes||{});
  const wilds = all.filter(x=>x.kind === "domain" && (x.tags||[]).includes("wildcard"));
  return all.filter(x=>{
    const w = wildcardFor(x, wilds);
    return w && w.id === n.id;
  }).sort((a, b)=>a.value.localeCompare(b.value));
}

function portNumber(n){
  const num = String((n || {}).id || "").split(":").pop();
  return /^\d+$/.test(num) ? num : "";
}

function nodeLabel(n){
  if(!n) return "";
  if(n.kind !== "port") return n.value || "";
  const num = portNumber(n);
  return num ? `${n.value}:${num}` : (n.value || "");
}

// Every way of reaching these ports that a hostname-routed protocol would see
// differently: the address itself, and each name that resolves to the host the
// port is on.
//
// This is the first thing that needs the map to be a *graph*. A list of names
// and a list of ports cannot be recombined afterwards; the `resolves_to` and
// `has_port` edges are what say which names reach which port. Probing addresses
// alone reaches whatever a server answers with when nothing asks for a
// particular site — a hosting platform's own page, or a reverse proxy's 404 —
// because a web server picks the application from the Host header.
//
// Names dedupe across addresses on purpose: one name behind two edge addresses
// is one application, and `name:443` is the same probe whichever answers.
//
// Names under a wildcard are deliberately *not* folded away here. The fold is
// right for a port scanner, where thirteen names on one address are one machine;
// at the HTTP layer they are routinely thirteen applications.
function vhostTargets(ports){
  const byId = mapData.nodes || {};
  const names = new Map();                  // host node id -> Set of names
  for(const e of Object.values(mapData.edges || {})){
    if(e.rel !== "resolves_to") continue;
    const from = byId[e.frm], to = byId[e.to];
    if(!from || !to || from.kind !== "domain" || to.kind !== "host") continue;
    if(from.in_scope === false) continue;   // not ours to ask for
    if(!names.has(e.to)) names.set(e.to, new Set());
    names.get(e.to).add(from.value);
  }
  const out = [];
  const add = v => { if(v && !out.includes(v)) out.push(v); };
  for(const p of ports){
    const num = portNumber(p);
    if(!num) continue;
    add(`${p.value}:${num}`);               // the address, for an app with no vhost
    (names.get(`host:${p.value}`) || []).forEach(n => add(`${n}:${num}`));
  }
  return out;
}

function mapInput(id){
  const t = tools.get(id);
  const kinds = (t && t.consumes) || [];
  const passive = !!t && t.section === reconPhase();
  const all = Object.values(mapData.nodes||{});
  const nodes = passive ? all : all.filter(n=>n.in_scope !== false);
  for(const kind of kinds){                 // first kind that has anything
    // Names under a wildcard all answer with the same address, so handing a
    // port scanner every one of them scans a single host once per name. The
    // wildcard itself stays in the list, so the host is still reached — and
    // this only applies to the name list: once dig has resolved them the tool
    // takes hosts, which the map already holds one of per address.
    const expand = kind === "port" && t && t.vhosts;
    const ports = expand ? nodes.filter(n=>n.kind === "port") : [];
    const vals = expand
      ? vhostTargets(ports)
      : nodes.filter(n=>n.kind===kind)
          .filter(n=>passive || kind !== "domain"
                     || !(n.tags||[]).includes("under-wildcard"))
          .map(n=>nodeLabel(n));
    if(vals.length){
      // What was left out, so a short list is explained rather than puzzling.
      const held = all.filter(n=>n.kind===kind && n.in_scope === false).length;
      // And where a long list came from. Crossing names with ports multiplies,
      // and a run that quietly became four thousand requests should be visible
      // before it fires rather than afterwards in someone's access log.
      return {kind, vals, held: passive ? 0 : held,
              fromPorts: expand ? ports.length : 0};
    }
  }
  return {kind: kinds[0]||"", vals: [], held: 0, fromPorts: 0};
}

// Re-sync a tool's list with the map, discarding edits. Used when a later run
// has added nodes and you want the current set rather than the one captured
// when the card first rendered.
function fillFromMap(id){
  inbox.set(id, mapInput(id).vals.join("\n"));
  render();
}

function countInput(id){
  const box = document.getElementById("in-"+id);
  if(!box) return;
  inbox.set(id, box.value);
  const n = box.value.split("\n").filter(l=>l.trim()).length;
  const el = document.getElementById("incount-"+id);
  if(el) el.textContent = n ? `${n} line${n===1?"":"s"}` : "";
}

// What each tool's last run offered, keyed by tool id. See offerPromote.
const promote = new Map();

// `all` takes every new row regardless of the checkboxes — including the
// out-of-scope ones, which are deliberately left unchecked. That is the point of
// having both buttons: "Add selected" respects the in-scope default, "Add all"
// is how you take affiliate infrastructure (a client's mail provider, say) onto
// the map on purpose. Out-of-scope nodes are recorded, tagged and never scanned.
async function commitPromote(toolId, all, linksOnly){
  const st = promote.get(toolId);
  if(!st) return;
  const msg = document.getElementById(`promsg-${toolId}`);
  const say = text => { st.msg = text; if(msg) msg.textContent = text; };
  const {rows, offered, enrich} = promoteView(st);
  const picked = linksOnly ? []
    : all ? offered.slice() : offered.filter(r=>promoteChecked(st, r));
  const updates = linksOnly ? [] : enrich;
  if(!picked.length && !updates.length && !linksOnly){ say("nothing selected"); return; }
  say("adding…");
  // An edge may land when both its ends will be on the map — the ones being
  // added now, plus the ones already there. Requiring both ends to be *new* is
  // why dig's resolutions never linked: it reports `domain resolves_to host`,
  // and the domain is on the map already by the time you resolve it, so every
  // edge was discarded and the hosts arrived orphaned. Rows you unticked are
  // still excluded — those nodes will not exist, and the server drops any edge
  // whose ends it cannot find.
  const ids = new Set([...picked.map(r=>r.id),
                       ...rows.filter(r=>r.known).map(r=>r.id)]);
  const keptEdges = (st.edges||[]).filter(e=>ids.has(e.frm) && ids.has(e.to));
  const d = await (await fetch(`/projects/${proj.id}/map`,{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({run: st.run, rows: picked.concat(updates),
                         edges: keptEdges, parent: st.parent || ""})})).json();
  // Rows the rules flagged are still worth reporting — you should know you just
  // widened the engagement — but they are in scope now, not "outside" it.
  const oos = picked.filter(r=>!r.in_scope).length;
  const said = [];
  if(picked.length) said.push(`added ${d.added} to the map`);
  if(d.updated)     said.push(`${d.updated} updated`);
  if(d.linked)      said.push(`${d.linked} link${d.linked===1?"":"s"}`);
  if(oos)           said.push(`${oos} brought into scope`);
  say(said.join(" · ") || "nothing to add");
  // No "done" state to freeze: the box re-reads the map, so what it shows after
  // this is simply what is true — the rows are known now, and if you delete one
  // it is offered again without re-running anything.
  loadMap();
}

/* ---- the map ---- */
const KIND_ORDER = ["domain","host","port","webapp"];
const KIND_LABEL = {domain:"Domains", host:"Hosts", port:"Ports",
                    webapp:"Web apps"};

async function loadMap(){
  try{
    mapData = await (await fetch(`/projects/${proj.id}/map`)).json();
  }catch(e){ mapData = {nodes:{}, edges:{}}; }
  mapCount = Object.values(mapData.nodes||{}).length;
  render();
}

function renderMap(card){
  const el = document.getElementById("v-map");
  const nodes = Object.values(mapData.nodes||{});
  // Everything on the map is shown. There is no hidden state: a node you removed
  // is gone, not filtered out of the view while still counting as known.
  const shown = nodes;
  const edges = Object.values(mapData.edges||{});

  // In scope is the server's answer, not a guess from the scope text: the rules
  // plus everything you promoted. Counting the "scope" tag instead reported "1
  // in scope" next to eight subdomains you had just accepted.
  const inScopeN = shown.filter(n=>n.kind==="domain" && n.in_scope !== false).length;
  const oosN     = shown.filter(n=>n.in_scope === false).length;
  const foundN = shown.filter(n=>n.kind==="domain" &&
                                !(n.tags||[]).includes("scope")).length;
  const counts = [`<span class="gcount"><b>${inScopeN}</b> in scope</span>`,
                  oosN ? `<span class="gcount exitN"><b>${oosN}</b> out of scope</span>` : "",
                  `<span class="gcount"><b>${foundN}</b> subdomains found</span>`]
    .concat(KIND_ORDER.filter(k=>k!=="domain").map(k=>{
      const n = shown.filter(x=>x.kind===k).length;
      return `<span class="gcount"><b>${n}</b> ${KIND_LABEL[k].toLowerCase()}</span>`;
    })).join("");

  const outs = new Map(), ins = new Map();
  edges.forEach(e=>{
    if(!outs.has(e.frm)) outs.set(e.frm,[]);
    outs.get(e.frm).push(e);
    if(!ins.has(e.to)) ins.set(e.to,[]);
    ins.get(e.to).push(e);
  });

  const isScope = n => (n.tags||[]).includes("scope");
  const nodeAt = v => shown.find(n=>n.kind==="domain" && n.value === v);

  // Which wildcard each name sits under. Drawing them nested is the whole point
  // of keeping those names: thirteen rows that are one host read as thirteen
  // findings in a flat list, and as one host with thirteen names in a tree.
  //
  // Read from the `contains` edges a promote wrote, *and* worked out from the
  // names themselves. The edge alone was not enough: it is only written when the
  // wildcard is already on the map at the moment the child is promoted, so a run
  // that reported both in one go wrote it or not depending on which order the
  // rows happened to be in — and once the child is on the map it is never
  // offered again, so the edge is never retried. The result was every name
  // correctly tagged `under-wildcard` and not one of them drawn under anything.
  //
  // The relationship is in the names, so it does not need to have been recorded:
  // `a.b.example.com` sits under a wildcard on `b.example.com` because of what
  // it is called. Deriving it also makes this retroactive, and right for names
  // found later without re-promoting anything.
  const wildParent = new Map(), wildKids = new Map();
  const wildLink = (parent, child) => {
    if(parent === child || wildParent.has(child)) return;
    wildParent.set(child, parent);
    if(!wildKids.has(parent)) wildKids.set(parent, []);
    wildKids.get(parent).push(child);
  };
  edges.forEach(e=>{
    if(e.rel !== "contains") return;
    const p = (mapData.nodes||{})[e.frm];
    if(!p || !(p.tags||[]).includes("wildcard")) return;
    wildLink(e.frm, e.to);
  });
  // Nearest wildcard ancestor wins, so a name under two nested wildcards folds
  // into the closer one rather than the apex.
  const wildNodes = shown.filter(n=>n.kind === "domain"
                                    && (n.tags||[]).includes("wildcard"));
  if(wildNodes.length) shown.forEach(n=>{
    if(n.kind !== "domain" || wildParent.has(n.id)) return;
    const best = wildcardFor(n, wildNodes);
    if(best) wildLink(best.id, n.id);
  });

  // What a scan found out about this node, in one line: who reported it, what it
  // resolved to, what has been checked against it. A list of bare names says
  // nothing about progress — this is the difference between "8 subdomains" and
  // "8 subdomains, none of them resolved yet".
  const discovered = n => {
    const bits = [];
    const rel = r => (outs.get(n.id)||[]).filter(e=>e.rel===r)
      .map(e=>(mapData.nodes[e.to]||{}).value).filter(Boolean);
    const ips = rel("resolves_to"), serves = rel("serves");
    // The port numbers, not a count of them, and not their values — a port node
    // is keyed on its host, so its `value` is that host's address and a list of
    // them read as the same address several times over. With no Ports section
    // to click through to, the numbers belong on the row that owns them.
    const ports = (outs.get(n.id)||[]).filter(e=>e.rel === "has_port")
      .map(e=>Number(portNumber(mapData.nodes[e.to]))).filter(Boolean)
      .sort((a, b)=>a - b);
    // The other direction, which is the useful one on an address: an IP on its
    // own tells you nothing, and the names pointing at it are what you are
    // about to scan — nine of them on one address is one machine, and that is
    // the fact worth seeing without opening anything.
    const from = (ins.get(n.id)||[]).filter(e=>e.rel === "resolves_to")
      .map(e=>((mapData.nodes||{})[e.frm]||{}).value).filter(Boolean);
    // Which tool reported it is not on the row. It was on every single one,
    // pushing a second line under each name to say something you can read in
    // the detail pane when it matters — and what a name resolved to is the
    // thing you are actually scanning down this list for.
    if(ips.length)    bits.push("→ " + ips.map(esc).join(", "));
    // A wildcard usually does not resolve itself — the names under it do, all to
    // the same address, which is the whole reason they fold into one host for
    // scanning. Without this the wildcard row is the one row with nothing on it,
    // while the thing it stands for is exactly what you are about to scan.
    if(!ips.length && (n.tags||[]).includes("wildcard")){
      const under = [...new Set((wildKids.get(n.id) || []).flatMap(id =>
        (outs.get(id) || []).filter(e=>e.rel === "resolves_to")
          .map(e=>(mapData.nodes[e.to] || {}).value).filter(Boolean)))];
      if(under.length) bits.push("names here → " + under.map(esc).join(", "));
    }
    if(from.length)   bits.push("← " + [...new Set(from)].map(esc).join(", "));
    if(ports.length)  bits.push("open: " + ports.join(", "));
    if(serves.length) bits.push(serves.length + " web app" + (serves.length===1?"":"s"));
    const checks = Object.keys(n.checks||{});
    if(checks.length) bits.push("checked: " + checks.map(esc).join(", "));
    if(n.note)        bits.push("note: " + esc(n.note));
    scanBits(n).forEach(b=>bits.push(esc(b)));
    return bits.length ? `<div class="sub" style="margin:2px 0 0 2px">${
      bits.join(" · ")}</div>` : "";
  };

  // A row opens the node, unless the panel it is in is picking — then the whole
  // row toggles instead. One behaviour at a time: a permanent tick on every row
  // is clutter you scroll past on every visit for something you do rarely.
  // `hideScope` for rows that live inside an In scope / Out of scope panel: the
  // heading above them already says it, on every single row.
  const row = (n, pill, picking, hideScope) => {
    const conflict = Object.values(n.attrs||{}).some(v=>
      new Set(v.map(x=>x.value)).size>1);
    const on = picked.has(n.id);
    // One box per node, and the whole box is the target — the resolution line
    // underneath is part of what you are clicking on, not a caption beside it.
    // The open one stays lit, so with the detail panel filled you can still see
    // which of thirteen names it is describing.
    return `<div class="mapitem${picking && on ? " picked" : ""}${
         !picking && openNode === n.id ? " open" : ""}"
         onclick="${picking ? `pickNode('${esc(n.id)}')` : `showNode('${esc(n.id)}')`}">
      <div class="mapnode">
      ${picking ? `<input type="checkbox" ${on?"checked":""} tabindex="-1"
             onclick="event.stopPropagation();pickNode('${esc(n.id)}')">` : ""}
      <code${closedSince(n) ? ' style="opacity:.55"' : ""}>${esc(nodeLabel(n))}</code>
      ${pill||""}
      ${closedSince(n) ? `<span class="sub" title="It was open when it was found.
             Kept rather than deleted: a port closing between two scans is a
             finding, and deleting it destroys the evidence it was ever open"
             >${esc(closedSince(n))} since the last scan</span>` : ""}
      ${(n.tags||[]).includes("wildcard")
        ? '<span class="pill" title="Answers for any name under it">wildcard</span>':''}
      ${(n.tags||[]).includes("under-wildcard")
        ? `<span class="sub" title="DNS answers for any name here, so it cannot
             confirm this one — kept because a source published it, and scanned
             as one host">not scanned · under a wildcard</span>`:''}
      ${n.third_party
        ? `<span class="exitN sub" title="A scan identified this as someone
             else's infrastructure, so scope is not inherited into it">${
             esc(thirdPartyWho(n) || "third-party")}</span>`:''}
      ${!hideScope && n.in_scope === false
        ? '<span class="exitN sub">out of scope</span>':''}
      ${conflict?'<span class="exitN sub">conflict</span>':''}
      </div>${discovered(n)}
    </div>`;
  };

  // No scope line here. The rules are on the panel to the right, the roots
  // themselves are under In scope → Domains, and the counts above already say
  // how the split came out — printing the scope text over the top of all three
  // was the same fact a fourth time.
  const rules = (proj && proj.scope_all) || [];

  // Scope first, kind second. Which side of the line something is on decides
  // whether you may touch it at all, so it is the question the map should answer
  // before "is it a name or an address" — and it is the split you act on, with
  // one move control per side rather than one per kind.
  const inScope  = shown.filter(n=>n.in_scope !== false);
  const outScope = shown.filter(n=>n.in_scope === false);
  const isRoot = n => isScope(n) || rules.includes(n.value);
  // A port is not a thing you find, it is a fact about a host — so it reads off
  // the host it belongs to rather than as a list of its own. Listed flat it was
  // six rows of `address:port` restating three hosts you were already looking
  // at, and the port number, the only new information in the row, was the part
  // the eye had to dig for.
  //
  // Nothing is hidden by this: a host row names its open ports, and each one is
  // still a node you can open, scope and aim a tool at, from the host's pane.
  //
  // Web apps stay listed. They are the web phase's worklist, and at a few
  // hundred names "which of these actually serve something" is a question a
  // flat list answers and a tree does not.
  const KINDS = [
    ["Hosts",      n=>n.kind === "host"],
    ["Domains",    n=>n.kind === "domain" && isRoot(n)],
    ["Subdomains", n=>n.kind === "domain" && !isRoot(n)],
    ["Web apps",   n=>n.kind === "webapp"],
  ];
  // All of them, whether or not anything is in them — which is every kind there
  // is, now that ports read off their host and findings are gone.
  //
  // For the first three because they are the attack surface: an empty Hosts box
  // says "nothing has resolved yet", which you want to read rather than infer
  // from a missing box. Web apps for the same reason — it is the web phase's
  // worklist, and a section that only exists once the phase has succeeded
  // cannot tell you the phase has not run.
  const ALWAYS = ["Hosts", "Domains", "Subdomains", "Web apps"];
  // Decided once, for both sides together: the panels share grid rows so that
  // Hosts sits opposite Hosts however lopsided the two lists are, and that only
  // works if both draw the same boxes in the same order.
  const kindsShown = KINDS.filter(([kl, pred]) =>
    ALWAYS.includes(kl) || shown.some(pred));
  // Side by side, and both always present. An empty half is information — "no
  // affiliate infrastructure came back" and "nothing is in scope yet" are
  // things you want to read, and a panel that disappears when it is empty
  // leaves you wondering whether it was ever computed.
  // A wildcard's names drawn under it, one level deep. Children that ended up on
  // the other side of the scope split are not duplicated here — the parent gets
  // a stub saying how many, because showing the same name in both panels would
  // make the counts lie.
  const nested = (list, picking) => {
    const here = new Set(list.map(n=>n.id));
    const kids = new Map(), top = [];
    list.forEach(n=>{
      const p = wildParent.get(n.id);
      if(p && here.has(p)){
        if(!kids.has(p)) kids.set(p, []);
        kids.get(p).push(n);
      } else top.push(n);
    });
    return top.map(n=>{
      const mine = kids.get(n.id) || [];
      const away = (wildKids.get(n.id) || []).filter(id=>!here.has(id)).length;
      const ids = mine.map(k=>k.id);
      const all = ids.length && ids.every(i=>picked.has(i));
      return row(n, "", picking, true)
        + (picking && ids.length ? `<div class="kidstub">
             <span class="act" onclick="pickMany(${esc(JSON.stringify(ids))},${!all})"
               >${all ? "clear" : "select"} the ${ids.length} under this</span></div>` : "")
        + (mine.length ? `<div class="mapkids">${
             mine.map(k=>row(k, "", picking, true)).join("")}</div>` : "")
        + (away ? `<div class="kidstub">${away} more under this, on the other
             side of the split</div>` : "");
    }).join("");
  };

  // `side` says which panel this is — "subdomains:out", "hosts:in" — because
  // both sections have an in and an out, and keying on the direction alone put
  // the Hosts panels into picking mode alongside the Subdomains ones.
  //
  // Where they are now is also what the move must be: picking in the
  // out-of-scope panel means bringing them in, and vice versa.
  const panel = (label, mine, cls, side) => {
    const ids = mine.map(n=>n.id);
    const picking = moveFrom === side;
    const all = ids.length && ids.every(i=>picked.has(i));
    const to = side.endsWith("out") ? "in" : "out";
    // Right-aligned, opposite the label, and no total — the kind boxes below
    // each carry their own count, and this one only restated their sum.
    //
    // The same link opens and closes it: pressing "move" again is the obvious
    // way out, and a Cancel button beside the confirm is in the wrong half of
    // the panel to be found.
    // In scope is what you are authorised to touch; scannable is what actually
    // gets handed to a scanner. They differ — names under a wildcard are one
    // host — and one label for both is how you end up sure a host was tested.
    const held = side.endsWith("in")
      ? mine.filter(n=>(n.tags||[]).includes("under-wildcard")).length : 0;
    const head = `<span class="sub">
      ${held ? `<span title="They all answer with the same address, so the
           scanners get the wildcard once instead of each name"
           >${held} not scanned</span> · ` : ""}
      ${mine.length ? `<span class="act" onclick="toggleMove('${side}')">${
          picking ? "done" : "move"}</span>` : ""}
      ${picking ? ` · <b>${picked.size}</b> selected ·
        <span class="act" onclick="pickMany(${esc(JSON.stringify(ids))},${!all})"
          >${all ? "none" : "all"}</span>` : ""}</span>`;
    // Every child is a grid row, and the action bar is one of them whether or
    // not this side is picking — a row that exists on one side only would shunt
    // that side's boxes down by the height of a button.
    return `
    <div class="mappanel${picking ? " picking" : ""}">
      <div class="mapband ${cls||""}">${label}${head}</div>
      <div class="movebar">${picking ? `<div class="fields">
          <button ${picked.size?"":"disabled"} onclick="confirmMove()">Move to ${
            to === "in" ? "in scope" : "out of scope"}</button>
          <button class="ghost" onclick="cancelMove()">Cancel</button>
        </div>` : ""}</div>
      ${kindsShown.map(([kl, pred])=>{
          const list = mine.filter(pred);
          // An empty box is an answer — "nothing of ours is in scope yet", "no
          // third-party addresses came back" — and it keeps the two sides
          // readable against each other.
          return `<div class="kindbox">
            <div class="mapkindsub">${kl}<span class="sub">${list.length}</span></div>
            ${list.length ? nested(list, picking)
                          : `<div class="sub" style="padding:2px">n/a</div>`}
          </div>`;
        }).join("")}
    </div>`;
  };

  // A rule written without a star covers that host and nothing else, so what a
  // scan finds underneath is out of scope — correct by the letter of it, and
  // also the single likeliest thing to be an oversight rather than a decision.
  // Say which rule is doing it, and make widening one click instead of a trip
  // to the Project page to guess at syntax.
  const rawRules = ((proj && proj.scope) || "").split(/[,\s;]+/)
    .map(s=>s.trim().toLowerCase().replace(/\.$/, "")).filter(Boolean);
  const apexOnly = rawRules.filter(r=>!r.startsWith("*.") && !r.includes("/"));
  const widen = [...new Set(outScope
    .map(n=>apexOnly.find(r=>n.value.endsWith("." + r)))
    .filter(Boolean))];
  // A rule that cannot match anything fails silently — the map just shows less
  // than you expected, which reads as "the scan found little" rather than "the
  // scope has a typo in it".
  const badRules = ((proj && proj.scope_problems) || []);
  const scopeProblems = !badRules.length ? "" : `
    <div class="sub" style="padding:4px 2px">
      <span class="exitN">scope</span> ${badRules.map(p=>
        `<code>${esc(p.rule)}</code> — ${esc(p.why)}`).join(" · ")}
      · <a class="act" onclick="setView('project')">fix it</a>
    </div>`;

  const widenHint = !widen.length ? "" : `
    <div class="sub" style="padding:4px 2px">
      ${widen.map(r=>`<code>${esc(r)}</code>`).join(", ")}
      ${widen.length===1?"is":"are"} scoped as the apex only — subdomains are not
      included unless you write the star.
      ${widen.map(r=>`<span style="cursor:pointer;color:var(--accent)"
         onclick="widenScope('${esc(r)}')">scope *.${esc(r)}</span>`).join(" · ")}
    </div>`;

  // Heading + action bar + one row per kind. Naming the rows on the container
  // lets both panels sit on the same lines, so Hosts is opposite Hosts however
  // lopsided the two sides are.
  const groups = `<div class="scopegrid"
         style="grid-template-rows:repeat(${kindsShown.length + 2}, auto)">
         ${panel("In scope", inScope, "", "scope:in")}
         ${panel("Out of scope", outScope, "oos", "scope:out")}
       </div>${scopeProblems}${scopeNote ? `<div class="sub" style="padding:4px 2px">${
           esc(scopeNote)}</div>` : ""}${widenHint}`
    + (shown.length ? "" : `<div class="sub" style="padding:6px 2px 0">
         nothing found yet — start reconnaissance below</div>`);

  // Built below, then dropped into the right-hand column: the baseline is what
  // you work with while reading the map, so it sits beside it rather than under
  // it. Clicking a node borrows the column; closing gives it back.
  let toolset = "", installBar = "";
  // No scope line above the map: the scope is a section *of* the map now, with
  // its own rows, and printing the raw scope text over the top said the same
  // thing twice. The sections carry their own empty states, so they render
  // whether or not anything has been found — the old "nothing found yet"
  // placeholder replaced the whole map, scope included.

  // The toolset, grouped by phase. This is where you work; the map above is
  // what it fills in.
  const baseline = [...tools.values()].filter(t=>t.baseline)
    .sort((a,b)=>(a.baseline_order||0)-(b.baseline_order||0));
  installBar = baseline.length ? "" : `
    <div class="card" style="padding:12px;margin-bottom:12px">
      <div class="sub" style="margin-bottom:8px">
        The baseline toolset for an external engagement isn't installed yet —
        bbot and subfinder for discovery, then dig, nmap, curl and openssl.
        Their output is what fills in the map.</div>
      <button onclick="installBaseline()">Install baseline</button>
      <span class="sub" id="basemsg"></span>
    </div>`;

  // The baseline, grouped by the phase each tool belongs to, in engagement
  // order — reconnaissance, then active scanning, then web analysis. The order
  // was always the methodology; a flat list of six just made you remember it.
  //
  // These are headings inside the Baseline block, not sidebar entries. The
  // sidebar navigates phases you put your own tools in; this names the stage of
  // the same list you are already looking at.
  // The checklist is always on screen and the working area shows one phase, so
  // you can see the whole engagement and still only deal with a step at a time.
  // A tool whose section the engagement type no longer lists still has to
  // appear, rather than dropping off the page because its phase was renamed.
  const phased = new Set(SECTIONS.map(([k])=>k));
  const orphans = baseline.filter(t=>!phased.has(t.section));
  const steps = SECTIONS.filter(([k])=>phaseTools(k).length)
    .concat(orphans.length ? [["other", "Other"]] : [])
    .map(([key, label])=>[key, label, phaseState(key)]);

  // Where the working area points: your last click if it is still a step,
  // otherwise whatever is running, otherwise the first thing left to do.
  const current = (stepAt && steps.some(([k])=>k === stepAt)) ? stepAt
    : (steps.find(([,,s])=>s.state === "running")
       || steps.find(([,,s])=>["ready","stale"].includes(s.state))
       || steps[steps.length-1] || [""])[0];

  toolset = !baseline.length ? "" :
    `<div class="secthead" style="margin-top:0">Baseline
       <span class="sub">${baseline.length} tools</span></div>
     <div class="steplist">
       ${steps.map(([key, label, s])=>`
         <div class="steprow ${s.state}${key === current ? " on" : ""}"
              onclick="goStep('${key}')">
           <span class="stepmark">${STEP_MARK[s.state] || "☐"}</span>
           <span class="stepname">${esc(label)}</span>
           <span class="sub">${esc(s.note)}</span>
         </div>`).join("")}
     </div>
     ${current ? phaseWork(current) : ""}`;

  el.innerHTML = `
    <h2 style="display:flex;justify-content:space-between;align-items:baseline">
      <span>Map</span>
      <span class="sub">${shown.length} nodes · ${edges.length} links</span></h2>
    <div class="mapwrap withdetail${openNode && detailWide ? " wide" : ""}">
      <div class="card" style="padding:12px">
        <div>${counts}</div>
        ${groups}
      </div>
      <div class="mapdetail">${openNode && mapData.nodes[openNode]
        ? nodeDetail(openNode)
        : `<div class="card" style="padding:14px">${installBar}${toolset}</div>`}</div>
    </div>`;
}

// The phase the sequence belongs to — wherever the discovery tools are filed,
// so this follows the engagement type rather than assuming "reconnaissance".
const reconPhase = () => (reconDiscovery()[0] || {}).section || "";

// Whether the baseline's tool cards are on screen. A run opens the list on its
// own — output arriving behind a collapsed button is output you cannot read.
// Which phases have their tool cards on screen. Per phase, not one switch for
// the lot: opening Web Analysis to read a curl run should not unroll every
// card in the baseline.
const openTools = new Set();
// Which phases have their run output folded away, keyed by phase so the Map's
// panel and the phase page agree — it is the same output in two places, and
// folding it in one and not the other would be two answers to one question.
//
// A set of *folded* keys, so the default is open: collapsing by default would
// hide what you had just run, and this is for getting three finished tools out
// of the way once you have read them.
// Explicit choices only — a key is absent until you click, so each place can
// have its own default. A finished run's output is folded away, because it is a
// record you go and read; a run happening now is open, because watching it is
// the point. One set of keys could not say both.
const runFoldState = new Map();
const runOpen = (key, dflt) =>
  runFoldState.has(key) ? runFoldState.get(key) : dflt;
function toggleRunFold(key, dflt){
  runFoldState.set(key, !runOpen(key, dflt));
  render();
}
const runFold = (key, dflt) => `<span class="fold" style="cursor:pointer"
  onclick="toggleRunFold('${esc(key)}',${!!dflt})"
  title="${runOpen(key, dflt) ? "Fold the output away" : "Show the output"}"
  >${runOpen(key, dflt) ? "▾" : "▸"}</span>`;

function toggleTools(key){
  openTools.has(key) ? openTools.delete(key) : openTools.add(key);
  render();
}

const phaseTools = key => [...tools.values()]
  .filter(t=>t.baseline && t.section === key)
  .sort((a,b)=>(a.baseline_order||0)-(b.baseline_order||0));

// Which phase the working area is showing. Null means "the first one that is
// not finished", so the panel follows the engagement without being told.
let stepAt = null;

// What a phase can be told about itself, worked out from the map and from the
// runs recorded for this engagement — never from anything the browser is
// holding, so a refresh puts you back where you actually were.
//
//   blocked  its tools are not installed or not built
//   running  a run of this phase is in flight now
//   ready    it has input and has never been run
//   stale    it ran, but the map has grown since
//   done     it ran and nothing has changed under it
//   empty    installed and runnable, but there is nothing to point it at
function phaseState(key){
  const mine = phaseTools(key);
  if(!mine.length) return {state:"blocked", note:"nothing installed for this phase"};
  const broken = mine.filter(t=>t.status !== "ready");
  if(broken.length === mine.length)
    return {state:"blocked",
            note:`${broken.map(t=>t.id).join(", ")} ${broken.length===1?"is":"are"} not built`};
  if(recon && recon.phase === key && recon.step !== "done")
    return {state:"running", note:recon.msg || "running"};

  const ready = mine.filter(t=>t.status === "ready");
  // Everything past reconnaissance eats the map, so "nothing to point it at"
  // is a real answer there and not a failure. Discovery is the exception: bbot
  // and subfinder start from the engagement's scope, so a phase holding one of
  // them is runnable on an empty map — which is the state every engagement
  // starts in, and the one where you most need the button to work.
  const feed = ready.filter(t=>(t.consumes||[]).length);
  const selfStarting = ready.length > feed.length;
  const targets = (!selfStarting && feed.length)
    ? Math.max(...feed.map(t=>mapInput(t.id).vals.length)) : null;
  const runsHere = ready.map(t=>lastRunAt(t.id)).filter(Boolean);
  const last = runsHere.length ? Math.max(...runsHere) : 0;

  if(!last){
    if(targets === 0) return {state:"empty", note:"nothing in scope to run against"};
    return {state:"ready",
            note:targets == null ? `${ready.map(t=>t.id).join(", ")} ready`
                                 : `${targets} target${targets===1?"":"s"} in scope`};
  }
  // Grown since it ran, with something this phase would actually act on?
  //
  // Two things have to be excluded or the completed state is unreachable.
  //
  // Its own output. A phase's results land *after* its runs finish — the output
  // is read and promoted once the tools exit — so counting them made every
  // phase stale the instant it succeeded.
  //
  // And anything it does not consume. Port scanning adds ports and web probing
  // adds web apps; neither says a thing about whether subdomain enumeration is
  // current, but both were flipping reconnaissance back to "21 new since it
  // ran" — so finishing the engagement's later phases undid the earlier ones on
  // the checklist. What makes a phase stale is a node of a kind it takes as
  // input: a name nothing has resolved, a host nothing has scanned.
  //
  // A phase whose tools consume nothing starts from the scope rather than the
  // map, so nothing appearing on the map can date it.
  const ours = new Set(ready.map(t=>t.id));
  const eats = new Set(ready.flatMap(t=>t.consumes || []));
  const waiting = !eats.size ? [] : Object.values(mapData.nodes||{})
    .filter(n=>eats.has(n.kind))
    .filter(n=>(n.first_seen||0) > last)
    .filter(n=>!(n.sources||[]).some(s=>ours.has(s.tool)));
  if(waiting.length){
    // Named by kind, because "3 new" does not tell you whether you are looking
    // at names nothing has resolved or hosts nothing has scanned.
    const byKind = {};
    waiting.forEach(n=>{ byKind[n.kind] = (byKind[n.kind] || 0) + 1; });
    const parts = Object.entries(byKind)
      .map(([k, c])=>`${c} ${k}${c === 1 ? "" : "s"}`);
    return {state:"stale", note:`${parts.join(", ")} new since it ran`};
  }
  return {state:"done", note:phaseProduced(key)};
}

// When this phase's tools last finished, as a timestamp. Read from the runs the
// server recorded, which is why the checklist survives a reload.
const lastRunAt = id => (runHistory.get(id) || 0);
const runHistory = new Map();     // tool id -> finished_at of its newest run

// A one-line account of what a finished phase put on the map, for the row.
function phaseProduced(key){
  const checks = new Set(phaseTools(key).map(t=>t.check).filter(Boolean));
  const nodes = Object.values(mapData.nodes||{});
  const covered = nodes.filter(n=>Object.keys(n.checks||{})
    .some(c=>checks.has(c))).length;
  return covered ? `${covered} node${covered===1?"":"s"} covered` : "finished";
}

const STEP_MARK = {done:"✓", running:"▸", ready:"☐", stale:"↻",
                   blocked:"✗", empty:"⊘"};

function goStep(key){ stepAt = key; render(); }

// The working area: one phase, with the one action it offers and its tools a
// click away. Everything else about the engagement is in the checklist above.
function phaseWork(key){
  const label = (SECTIONS.find(([k])=>k === key) || [, "Other"])[1];
  const mine = phaseTools(key);
  const {state, note} = phaseState(key);
  const open = openTools.has(key);
  const runnable = !["blocked", "empty", "running"].includes(state);
  return `
    <div class="subhead">
      <span>${esc(label)}</span>
      ${state === "running"
        ? `<span class="sub"><span class="running">running</span></span>`
        : `<button class="mini" ${runnable ? "" : "disabled"}
             onclick="startPhase('${key}')">${
             state === "done" || state === "stale" ? "Run again" : "Run"}</button>`}
      <button class="mini ghost toolsbtn" onclick="toggleTools('${key}')">
        <span class="fold">${open ? "▾" : "▸"}</span> Tools
        <span class="sub">${mine.length}</span></button>
    </div>
    <div class="sub">${esc(note)}${state === "blocked"
      ? ` — <a class="act" onclick="setView('add')">Add Tool</a>` : ""}</div>
    ${reconPanel(key)}
    ${open ? mine.map(t=>card(t,"run","",true)).join("") : ""}`;
}

// The tools this run has involved so far: whatever the phase started with, and
// the resolver once it has started. Listing the resolver before it runs would
// show an empty pane for a step that has not begun.
//
// Read from the run rather than recomputed from the baseline: recon's tools are
// the subdomain pair, and every other phase's are its own.
function reconTools(){
  if(!recon) return [];
  const list = (recon.tools||[]).map(id=>tools.get(id)).filter(Boolean);
  const r = recon.resolver && tools.get(recon.resolver);
  return r && !list.some(t=>t.id === r.id) ? list.concat([r]) : list;
}

// One tool: its stream, and what it has found. While it runs the right column
// is read from the stream itself; once the sequence has mapped it, the column
// switches to what actually landed on the map, which is the authoritative
// answer and is usually shorter — a tool mentions far more than it finds.
// `pfx` namespaces the element ids. The Map's phase panel and a phase page can
// both be in the document at once — only one is visible, but the hidden one keeps
// whatever it last rendered — so a single set of ids would have the live painter
// updating whichever copy happened to come first in the DOM.
function reconStream(t, pfx = "r"){
  const r = runs.get(t.id) || {};
  // What this run turned up, from the most authoritative source available.
  //
  // Every node records the run that found it, so after a run has been promoted
  // the map itself is the answer — and unlike the live list it survives a
  // reload, which is what left this column blank on a phase page. While a run
  // is still going nothing is on the map yet, so the live list read out of the
  // stream is all there is; and the sequence's own tally wins while it is on
  // screen, being the most immediate of the three.
  const mapped = recon && recon.mapped && recon.mapped[t.id];
  const runId = r.run || "";
  const onMap = runId ? Object.values(mapData.nodes || {})
    .filter(n=>(n.sources || []).some(s=>s.run === runId))
    .map(n=>nodeLabel(n)).sort((a, b)=>a.localeCompare(b)) : [];
  const seen = reconSeen.has(t.id) ? [...reconSeen.get(t.id)] : null;
  // An empty tally is not an answer. `mapped` is recorded for every tool the
  // sequence handled, including ones whose rows were all filtered out, and an
  // empty array is truthy — so taking it on truthiness alone discarded both the
  // map and the live stream and left the column blank under a scan that had
  // just listed a dozen names. Length, not existence, decides which source wins.
  const live = (mapped && mapped.length) ? mapped
             : (onMap.length ? onMap : seen);
  const fromMap = !!(mapped && mapped.length) || onMap.length > 0;
  const found = live || [];
  const resolver = t.check === "resolve";
  const state = r.busy ? `<span class="running">running</span>`
    : r.error ? `<span class="err">${esc(r.error)}</span>`
    : r.code !== undefined
      ? `<span class="${r.code===0?'exit0':'exitN'}">exit ${r.code}</span>` : "";
  return `
    <div class="lbl" style="margin-top:12px"><span>${esc(t.id)}</span>${state}</div>
    <div class="split" style="margin-top:4px">
      <pre class="term" id="${pfx}run-${t.id}"
           style="max-height:220px;overflow:auto">${ansiToHtml(clip(runout.get(t.id)))}</pre>
      <div>
        <div class="lbl"><span>${resolver ? "resolved" : "discovered"}</span>
          <span class="sub" id="${pfx}count-${t.id}">${
            live ? `${found.length}${fromMap ? " on the map" : ""}`
            : runId ? "nothing from this run is on the map"
            : "not recorded — see the map"}</span></div>
        <pre class="term" id="${pfx}found-${t.id}"
             style="max-height:196px;overflow:auto">${found.map(esc).join("\n")}</pre>
      </div>
    </div>
    ${runFiles(t, r)}`;
}

// Repaint one tool's stream in place: run_log fires per line, and a full render
// on every line of a bbot scan would rebuild the page under the scrollbar.
function paintRecon(id){
  // Every copy on the page: the Map's phase panel and a phase page's baseline
  // record are both real, and a run in flight should move in whichever one you
  // happen to be looking at.
  for(const pfx of ["r", "p"]){
    const out = document.getElementById(pfx + "run-" + id);
    if(out) stickToBottom(out, ansiToHtml(clip(runout.get(id))));
  }
  // Once the sequence has mapped a tool, its column is the authoritative list
  // and the live one must not overwrite it. An empty tally is not that list —
  // it means nothing was added, and the stream is still the best answer there
  // is, so it must not stop the repaint.
  if(recon && recon.mapped && (recon.mapped[id] || []).length) return;
  const found = [...(reconSeen.get(id) || [])];
  for(const pfx of ["r", "p"]){
    const col = document.getElementById(pfx + "found-" + id);
    if(col) col.textContent = found.join("\n");
    const n = document.getElementById(pfx + "count-" + id);
    if(n) n.textContent = String(found.length);
  }
}

// One panel, four states: ready, discovering, reviewing, resolving/done. It
// stays on screen after it finishes so you can read what it did.
// The tools of a phase that have a run to show, for the panel you see when this
// phase is not the one currently running.
const phaseRunTools = key => phaseTools(key)
  .filter(t=>sweeps(t))
  .filter(t=>runs.has(t.id) || runout.has(t.id));

function reconPanel(key){
  const box = inner => `<div class="card" style="padding:12px;margin-bottom:10px">
    ${inner}</div>`;

  // Live for the phase that is running; a record of the last run for the others.
  //
  // The panel used to exist only while `recon` held this phase, so moving to
  // another phase — or reloading — hid output that was still there. Every run
  // writes its stream to disk under the engagement and restoreRuns() reads it
  // back, so the evidence outlives the sequence that produced it; only the view
  // was tied to the live object.
  const live = !!(recon && recon.phase === key);
  if(!live){
    const past = phaseRunTools(key);
    if(!past.length) return "";
    // Open by default, unlike the phase page's copy of the same streams: this
    // is the Map, where reading what a phase produced is the reason you are
    // here. The phase page folds because the baseline sits below your own tools
    // there, as a record to go back to.
    return box(`<div class="lbl"><span>${runFold(key, true)}last run</span>
        <span class="sub">${past.length} tool${past.length===1?"":"s"}</span></div>
      ${!runOpen(key, true)
        ? `<div class="sub" style="cursor:pointer"
             onclick="toggleRunFold('${esc(key)}',true)">${
             esc(past.map(t=>t.id).join(", "))} — output folded away, click to read</div>`
        : `<div id="reconstreams">${past.map(t=>reconStream(t)).join("")}</div>`}`);
  }

  const step = (n, label, state) =>
    `<span class="sub" style="margin-right:14px${state==="now"?";color:var(--accent);font-weight:600":""}">
       ${state==="done" ? "✓" : n+"."} ${label}</span>`;
  const at = recon.step;
  // Only reconnaissance resolves afterwards. Every other phase reads the map,
  // runs, and has its output mapped — two steps, and showing a third that never
  // lights up reads as a sequence that stopped halfway.
  const bar = `<div style="margin-bottom:8px">
      ${step(1, recon.twoStage ? "discover" : "run",
             at==="discovery" ? "now" : "done")}
      ${step(2, "map",      at==="mapping" ? "now" : (at==="discovery" ? "" : "done"))}
      ${recon.twoStage
        ? step(3, "resolve", at==="resolve" ? "now" : (at==="done" ? "done" : ""))
        : ""}
    </div>`;

  // Every tool the sequence has touched, each with its own stream on the left
  // and what it has turned up on the right. The output tells you it is alive;
  // the column beside it tells you whether it is finding anything, which is a
  // different question and the one you actually care about.
  const list = reconTools();
  const streams = list.map(t=>reconStream(t)).join("");
  const status =
    at === "discovery" ? `<span class="running">running</span> ${
        esc([...recon.pending].join(", ") || "finishing")}`
    : at === "mapping" ? esc(recon.msg || "putting what they found on the map…")
    : at === "resolve" ? `<span class="running">resolving</span> with ${
        esc(recon.resolver||"")} — addresses land under the domains they belong to`
    : esc(recon.msg || "done");

  return box(bar + `
    ${recon.note ? `<div class="sub">${esc(recon.note)}</div>` : ""}
    <div class="sub">${status}</div>
    ${(recon.unresolved||[]).length ? `<div class="sub" style="margin-top:4px">
        <span class="exitN">no DNS answer</span> for
        <code>${recon.unresolved.slice(0,6).map(esc).join(", ")}</code>${
          recon.unresolved.length>6 ? ` +${recon.unresolved.length-6} more` : ""}
        — they exist in a certificate or a public source but do not resolve
        publicly, so nothing can be scanned at them</div>` : ""}
    ${recon.msg && at === "discovery" ? `<div class="sub err">${esc(recon.msg)}</div>` : ""}
    <div class="lbl" style="margin-top:8px"><span>${runFold(key, true)}output</span>
      <span class="sub">${list.length} tool${list.length===1?"":"s"}</span></div>
    ${!runOpen(key, true)
      ? `<div class="sub" style="cursor:pointer"
           onclick="toggleRunFold('${esc(key)}',true)">${
           esc(list.map(t=>t.id).join(", "))} — output folded away, click to read</div>`
      : `<div id="reconstreams">${streams}</div>`}
    <div class="fields" style="margin-top:8px">
      ${at === "done" ? `<button onclick="startRecon()">Run again</button>` : ""}
      <button class="ghost" onclick="cancelRecon()">${at==="done"?"Clear":"Cancel"}</button>
    </div>`);
}

// What a relation is called when you are standing at either end of it. A node
// id is not an answer: "→ resolves_to host:198.51.100.13" is the map's internal
// spelling of "resolves to 198.51.100.13", and only one of those reads.
const REL_OUT = {resolves_to:"resolves to", has_port:"open port",
                 serves:"serves", contains:"contains"};
const REL_IN  = {resolves_to:"resolved from", has_port:"port on",
                 serves:"served by", contains:"part of"};

// Both directions matter. Opening a subdomain should say which addresses it
// lands on; opening an address should say which subdomains land on it, which is
// how you notice that nine names are one machine — and one machine is one
// nmap run, not nine.
function relRows(edges, dict, other, from){
  const by = new Map();
  edges.forEach(e=>{
    const label = dict[e.rel] || e.rel;
    if(!by.has(label)) by.set(label, []);
    by.get(label).push(other(e));
  });
  const chip = nid => {
    const target = (mapData.nodes||{})[nid];
    // Named relative to what you are looking at. A port hanging off the host
    // you have open reads as `80`, not `198.51.100.10:80` — its address is the
    // heading of the pane, and repeating it on every chip is the one thing on
    // the row you already know. Anywhere else the port still carries its host,
    // because there it is what tells them apart.
    const own = from && target && target.kind === "port"
                && target.value === (from.value || "") && portNumber(target);
    return `<code style="cursor:pointer;color:var(--accent)"
       onclick="showNode('${esc(nid)}')">${esc(own || (target ? nodeLabel(target) : nid))}</code>`;
  };
  return [...by].map(([label, ids])=>`<div class="sub" style="margin-top:4px">
      <b>${esc(label)}</b> ${[...new Set(ids)].map(chip).join(" · ")}</div>`).join("");
}

// Which node the detail column is showing. Held in state rather than written
// straight into the DOM, because the layout depends on it: with nothing open
// the map uses the full width, and opening a node splits it in two.
let openNode = null;

// Whether that column is at reading width. Kept while you click from node to
// node — having widened it once to read some output, you did not mean "just
// this one" — and reset on reload rather than stored, since it is a posture you
// are in for a few minutes, not a preference.
let detailWide = false;
function toggleDetailWidth(){ detailWide = !detailWide; render(); }
// Clicking the row you already have open closes the panel — the same click
// that opened it should put it away, without hunting for the close link.
function showNode(id){ openNode = (openNode === id) ? null : id; render(); }
// For the times something else decides what you should be looking at, where a
// toggle would be wrong: changing a node's scope must not close the pane you
// changed it from.
function focusNode(id){ openNode = id; render(); }
function closeNode(){ openNode = null; render(); }

// Notes survive a re-render. The pane used to be painted only when you clicked
// it, so typing was safe; it repaints on every event now, and a scan finishing
// mid-sentence would take the sentence with it.
const noteDrafts = new Map();

// Tools you can point at one thing, filtered to the kinds they accept. This is
// the single-target counterpart of `consumes`: curl and openssl declare
// targets:["domain","host"], so they appear on a host and not on a finding.
// Whose infrastructure a scan said this is, when it named a provider.
const PROVIDERS = ["amazon","aws","azure","google","cloudflare","akamai",
                   "fastly","vercel","netlify","heroku","digitalocean"];
const thirdPartyWho = n => (n.tags||[]).find(t=>PROVIDERS.includes(t)) || "";

const nodeToolsFor = kind => [...tools.values()]
  .filter(t=>t.status === "ready" && (t.targets||[]).includes(kind))
  .sort((a,b)=>(a.baseline_order||0)-(b.baseline_order||0));

// The command that tool would run against that node. A webapp's value is a
// whole URL, so a template that already writes the scheme — curl's
// `https://{{target}}` — gets the value without one rather than https://https://.
function nodeCommand(t, n){
  const tmpl = (t.command_override||"").trim() || t.run_template || "";
  if(!tmpl) return "";
  const label = nodeLabel(n);       // a port carries its number, not just its host
  const bare = /:\/\/\s*\{\{target\}\}/.test(tmpl)
    ? label.replace(/^[a-z]+:\/\//i, "") : label;
  return tmpl.replaceAll("{{target}}", bare)
             .replaceAll("{{targets}}", bare)
             .replaceAll("{{scope}}", bare);
}

// Which node a tool's current run was launched from, so what it finds can be
// hung off that node instead of floating loose on the map.
const nodeRunOf = new Map();      // tool id -> node id

// The output of a node action, inside the node's own panel — the point is to
// read it against the thing you ran it on, not in a card somewhere else.
function nodeRunPane(t){
  const r = runs.get(t.id) || {};
  const state = r.busy ? `<span class="running">running</span>`
    : r.error ? `<span class="err">${esc(r.error)}</span>`
    : r.code !== undefined
      ? `<span class="${r.code===0?'exit0':'exitN'}">exit ${r.code}</span>` : "";
  return `<div class="lbl" style="margin-top:10px"><span>${esc(t.id)}</span>${state}</div>
    <pre class="term" id="run-${esc(t.id)}"
         style="max-height:220px;overflow:auto">${ansiToHtml(clip(runout.get(t.id)))}</pre>
    ${runFiles(t, r)}
    <div id="promote-${esc(t.id)}" class="promote"></div>`;
}

async function runOnNode(toolId, nodeId){
  const t = tools.get(toolId), n = (mapData.nodes||{})[nodeId];
  if(!t || !n || !proj) return;
  const command = nodeCommand(t, n);
  if(!command) return;
  nodeRunOf.set(toolId, nodeId);
  runs.set(toolId, {busy:true}); runout.set(toolId, ""); promote.delete(toolId);
  render();
  try{
    const d = await (await fetch(`/tools/${toolId}/run`,{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({command, project: proj.id,
                           section: sectionOf(toolId), input: ""})})).json();
    if(d.error){ runs.set(toolId, {error:d.error}); render(); }
  }catch(e){ runs.set(toolId, {error:"request failed"}); render(); }
}

// The most recent value of an attribute. Attributes keep every value with the
// tool that reported it, so a re-scan appends rather than overwrites — reading
// the last one is "what it looks like now", and the history stays for the detail
// pane to show.
const attrOf = (n, name) => {
  const vals = ((n||{}).attrs||{})[name];
  return vals && vals.length ? vals[vals.length-1].value : "";
};

// A port that was open when it was found and is not open now. The node stays and
// is greyed rather than removed, deliberately unlike a stale resolution: a
// resolution changing is a correction to a fact about now, and a port closing
// between two scans is a result.
const closedSince = n => {
  if(!n || n.kind !== "port") return "";
  const state = attrOf(n, "state");
  return state && state !== "open" ? state : "";
};

// What a port scan learned about a host, in the scan's own terms. The three
// things a bare port count cannot tell apart, which is why this exists at all:
//
//   never scanned      no portscan coverage — nothing has looked
//   did not respond    the host was scanned and is not there
//   nothing listening  the host answered and had nothing open, which is a
//                      result, and only means anything beside how much was
//                      probed: "no open ports" and "no open ports among the top
//                      1000 of 65535" are different claims in a report
function scanBits(n){
  if(!n || n.kind !== "host") return [];
  if(!(n.checks||{}).portscan) return ["not scanned"];
  const state = attrOf(n, "scan.state"), open = attrOf(n, "scan.open");
  if(state && !/^up\b/.test(state)) return ["did not respond"];
  const bits = [];
  // Which ports are open is already on the row, listed from the nodes that
  // exist; a count of them here would say the same thing twice. What only the
  // scan knows is the negative space — how much was probed and what came back
  // shut — and "it answered and had nothing open" is a result, not an absence.
  if(open === "none") bits.push("nothing listening");
  Object.keys(n.attrs||{})
    .filter(k=>k.startsWith("scan.")
               && !["scan.state","scan.open","scan.probed"].includes(k))
    .sort()
    .forEach(k=>bits.push(`${attrOf(n,k)} ${k.slice(5)}`));
  const probed = attrOf(n, "scan.probed");
  if(probed) bits.push(probed + " probed");
  return bits;
}

// Every port the scan reported, in every state — the detail deliberately kept
// off the map, one row per port, straight into a spreadsheet. Built from the
// run's retained XML on request, so it points at the scan the coverage mark
// names rather than at a file we would have to keep in step with it.
function portTableLink(n){
  const run = ((n||{}).checks||{}).portscan;
  if(!n || n.kind !== "host" || !run || !proj) return "";
  return ` · <a target="_blank" rel="noopener"
    href="/projects/${encodeURIComponent(proj.id)}/runs/${
      encodeURIComponent(run)}/ports.csv">port table ↗</a>`;
}

// What a wildcard stands for, for its own pane.
//
// A wildcard has no relations of its own — nothing resolves it, nothing is
// scanned at it — so its pane read "nothing resolved against this yet, run the
// resolver". That is wrong twice over: the resolver has run, and the names
// under it all answer with the same address, which is the thing a scan aimed
// here would actually reach. The names and that address are the whole content
// of a wildcard node.
function wildcardRows(n, edges){
  const kids = wildcardChildren(n);
  if(!kids.length) return "";
  const kidIds = new Set(kids.map(k=>k.id));
  const ips = [...new Set(edges
    .filter(e=>e.rel === "resolves_to" && kidIds.has(e.frm))
    .map(e=>e.to))];
  const chip = nid => {
    const t = (mapData.nodes||{})[nid];
    return `<code style="cursor:pointer;color:var(--accent)"
       onclick="showNode('${esc(nid)}')">${esc(t ? nodeLabel(t) : nid)}</code>`;
  };
  return `<div class="sub" style="margin-top:4px">
      <b>names here</b> ${kids.map(k=>chip(k.id)).join(" · ")}</div>`
    + (ips.length ? `<div class="sub" style="margin-top:4px">
      <b>they resolve to</b> ${ips.map(chip).join(" · ")}</div>` : "");
}

function nodeDetail(id){
  const n = (mapData.nodes||{})[id];
  if(!n) return "";
  const edges = Object.values(mapData.edges||{});
  const outward = edges.filter(e=>e.frm===id);
  const inward  = edges.filter(e=>e.to===id);
  const attrRows = Object.entries(n.attrs||{}).map(([k,vals])=>{
    const conflict = new Set(vals.map(v=>v.value)).size > 1;
    return `<div><b>${esc(k)}</b> ${vals.map(v=>
      `<code>${esc(v.value)}</code> <span class="sub">${esc(v.source)}</span>`).join(" · ")}
      ${conflict?'<span class="exitN sub"> sources disagree</span>':''}</div>`;
  }).join("") || `<div class="sub">no attributes</div>`;

  return `
    <div class="card" style="padding:14px">
      <div class="lbl"><span>${esc(n.kind)}</span>
        <span class="widthtoggle" onclick="toggleDetailWidth()"
              title="${detailWide ? "Back to the narrow pane, for clicking down a list"
                                  : "Widen this pane — output lays out side by side"}"
              >${detailWide ? "⤡ narrower" : "⤢ wider"}</span>
        <span class="sub" style="cursor:pointer;color:var(--accent)"
              onclick="closeNode()">close</span></div>
