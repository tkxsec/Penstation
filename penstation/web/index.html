      <div style="font-size:15px;margin-bottom:8px"><code>${esc(nodeLabel(n))}</code></div>
      ${scanBits(n).length ? `<div class="sub" style="margin-bottom:8px">${
        scanBits(n).map(esc).join(" · ")}${portTableLink(n)}</div>` : ""}
      ${attrRows}
      <div class="sub" style="margin-top:8px">
        ${n.in_scope === false ? `<span class="exitN">out of scope</span>`
          : `<span class="exit0">in scope</span>`}
        ${n.scope_why ? ` — ${esc(n.scope_why)}` : ""}
        ${(n.tags||[]).includes("scope") ? " · scope root"
          : (n.tags||[]).includes("accepted") ? " · you promoted it" : ""}
        ${(n.tags||[]).includes("under-wildcard")
          ? ` · <span title="Every name here answers with the same address, so
                the scanners are given the wildcard once instead of each name"
              >under a wildcard, not scanned separately</span>` : ""}
        ${n.third_party ? ` · <span class="exitN">third-party infrastructure${
            thirdPartyWho(n) ? " (" + esc(thirdPartyWho(n)) + ")" : ""}</span>` : ""}
        </div>
      <div class="sub" style="margin-top:4px">
        found by ${(n.sources||[]).map(s=>esc(s.tool)).join(", ")||"you"}
        ${Object.keys(n.checks||{}).length
          ? ` · checked: ${Object.keys(n.checks).join(", ")}` : ""}</div>
      ${relRows(outward, REL_OUT, e=>e.to, n)}
      ${relRows(inward, REL_IN, e=>e.frm, n)}
      ${wildcardRows(n, edges)}
      ${!outward.length && !inward.length && !wildcardRows(n, edges)
        ? `<div class="sub" style="margin-top:6px">
             nothing resolved against this yet — run the resolver</div>` : ""}
      ${(()=>{
        // Run something at this one thing. The phases sweep; this is the
        // microscope, and what it finds is attached to the node you aimed it at.
        const acts = nodeToolsFor(n.kind);
        if(!acts.length) return "";
        const r = runs.get(openNode && nodeRunOf.get(openNode)) || {};
        return `<div class="fields" style="margin-top:10px">
          ${acts.map(t=>{
            const busy = (runs.get(t.id)||{}).busy;
            const cmd = nodeCommand(t, n);
            return `<button class="mini ghost" ${busy?"disabled":""}
              title="${esc(cmd)}"
              onclick="runOnNode('${esc(t.id)}','${esc(id)}')">${
                busy ? "running…" : esc(t.id)}</button>`;
          }).join("")}
        </div>
        ${acts.filter(t=>nodeRunOf.get(t.id) === id && runs.has(t.id))
              .map(t=>nodeRunPane(t)).join("")}`;
      })()}
      <div class="fields" style="margin-top:10px">
        ${n.in_scope === false
          ? `<button onclick="setNodeScope('${esc(id)}','in')"
               title="Treat this as in scope regardless of the scope text">
               Move to in scope</button>`
          : `<button class="ghost" onclick="setNodeScope('${esc(id)}','out')"
               title="Keep it on the map but never scan it">
               Move to out of scope</button>`}
      </div>
      <div class="addrow" style="margin-top:10px">
        <input id="nnote" placeholder="note" style="flex:1"
               oninput="noteDrafts.set('${esc(id)}', this.value)"
               value="${esc(noteDrafts.has(id) ? noteDrafts.get(id) : (n.note||""))}">
        <button onclick="saveNode('${esc(id)}')">Save</button>
        <button class="ghost" style="color:var(--red)"
          title="Remove it from the map entirely"
          onclick="deleteNode('${esc(id)}','${esc(nodeLabel(n))}')">Delete</button>
      </div>
    </div>`;
}

// Which panel is picking, and what it has picked. Both by id and in state, so
// they survive the re-renders that arrive while you are still choosing.
let moveFrom = null;                 // "in" | "out" — the panel they are in now
const picked = new Set();
function pickNode(id){
  picked.has(id) ? picked.delete(id) : picked.add(id);
  render();
}
function pickMany(ids, on){ ids.forEach(i=>on ? picked.add(i) : picked.delete(i)); render(); }
// Toggle: clicking "move" on the panel you are already picking in closes it,
// and clicking it on the other panel switches sides rather than leaving two
// open at once.
function toggleMove(side){
  moveFrom = (moveFrom === side) ? null : side;
  picked.clear();
  scopeNote = "";              // last move's receipt, not this one's
  render();
}
function cancelMove(){ moveFrom = null; picked.clear(); render(); }

// Always to the other side: you picked them where they are, so the only move
// that makes sense is out of it.
async function confirmMove(){
  const to = (moveFrom||"").endsWith("out") ? "in" : "out";
  const ids = [...picked];
  moveFrom = null;
  await setScope(ids, to);
}

// Your call on scope, kept as a tag so it survives re-scans and scope edits.
// The rules cover the engagement; this covers what they cannot express — the
// client's own address behind a domain-only scope, or a host inside their range
// they have asked you to leave alone. "auto" drops it back to the rules.
let scopeNote = "";
async function setScope(ids, mode){
  if(!ids.length || !proj) return;
  try{
    const d = await (await fetch(`/projects/${proj.id}/map/scope`,{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ids, mode})})).json();
    // Say when the move took more than you picked. A name and its address are
    // one target, so moving one moves the other — silently would be worse.
    scopeNote = d.also
      ? `moved ${d.changed} — ${d.also} related node${d.also===1?"":"s"} followed`
      : "";
    picked.clear();
    await loadMap();
  }catch(e){}
}
async function setNodeScope(id, mode){
  await setScope([id], mode);
  focusNode(id);           // stay on the node you just changed
}

async function saveNode(id){
  const note = document.getElementById("nnote").value;
  await fetch(`/projects/${proj.id}/map/${encodeURIComponent(id)}`,{method:"PATCH",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify({note})});
  noteDrafts.delete(id);      // saved, so the record is the truth again
  loadMap();
}
// Rewrite one bare rule as a wildcard, leaving the rest of the scope text as
// you typed it. Editing scope re-seeds the map, so the roots follow.
async function widenScope(rule){
  if(!proj) return;
  const next = (proj.scope||"").split(/([,\s;]+)/).map(tok =>
    tok.trim().toLowerCase().replace(/\.$/, "") === rule ? "*." + tok.trim() : tok
  ).join("");
  try{
    const d = await (await fetch(`/projects/${proj.id}`,{method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({scope: next})})).json();
    if(!d.error){ await loadProjects(proj.id); loadMap(); }
  }catch(e){}
}

// Delete means delete: the node goes, with its links and its note. There is no
// soft-delete to fall back on, so a later run that finds the value again offers
// it as a fresh discovery — which is the trade for not keeping a record you said
// to remove.
async function deleteNode(id, value){
  if(!confirm(`Delete ${value} from the map?\n\nIts links and note go with it. `
              + `A later scan that finds it again will offer it as new.\n\n`
              + `This cannot be undone.`)) return;
  await fetch(`/projects/${proj.id}/map/${encodeURIComponent(id)}`,{method:"DELETE",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify({hard:true})});
  openNode = null;             // it is gone; nothing to keep open
  loadMap();
}

/* ---- projects ---- */
function renderProject(){
  const el = document.getElementById("v-project");
  if(!proj){ el.innerHTML = "<h2>Project</h2><div class='empty'>No project.</div>"; return; }
  const row = (label, value, field, placeholder) => `
    <div class="setrow">
      <div class="sub"><b>${label}</b> · ${value ? esc(value)
        : `<span class="sub">not set</span>`}</div>
      <span class="setedit" onclick="editField('${field}','${esc(placeholder)}')">edit</span>
    </div>`;
  el.innerHTML = `<h2>Project</h2>
    ${row("Client", proj.client, "client", "ACME Corp")}
    ${row("Scope", proj.scope, "scope", "*.acme.com, 203.0.113.0/24")}
    <div class="setrow"><div class="sub"><b>Type</b> · ${esc(proj.kind)}</div></div>
    ${paceRow()}
    ${row("Notes", proj.notes, "notes", "anything worth remembering")}
    <div id="pedit"></div>
    <div class="setrow" style="margin-top:20px">
      <div class="sub">Clearing empties the map and deletes every run and its
        retained files, then re-seeds the scope. The engagement, its phases and
        your installed tools stay — this is for starting the work over.
        <span id="clearmsg"></span></div>
      <span class="setedit" style="color:var(--red)"
            onclick="clearProjectData()">clear data</span>
    </div>
    <div class="setrow">
      <div class="sub">Deleting removes this engagement and its run history.
        Installed tools are shared and stay in the library.</div>
      <span class="setedit" style="color:var(--red)" onclick="deleteProject()">delete</span>
    </div>`;
}

// How hard this client may be tested, as one decision for every tool.
//
// It sits beside the scope because it is the same kind of fact: what you were
// authorised to do. Scanning is normally authorised; degrading a service
// normally is not, and the tools' own defaults are tuned for speed — httpx ships
// at 50 threads and 150 requests a second. Because it is stored on the
// engagement, a run's recorded command states the pace it ran at, which is the
// only way to answer "was it you?" afterwards.
// Two dials, because the same word costs the two tools wildly different
// amounts. Across a few hundred names, "careful" is minutes for the web probe
// and hours for the port scan — so one setting either makes the scan unusable
// or makes the probe louder than it needs to be.
function paceRow(){
  return [
    paceDial("Scan pace", "pace_scan", proj.scan_pace_options,
             proj.pace_scan_values,
             v => `nmap <code>${esc([v.probes, v.timing]
                                     .filter(Boolean).join(" "))}</code>`),
    paceDial("Web pace", "pace_web", proj.web_pace_options,
             proj.pace_web_values,
             v => `<code>${esc(String(v.threads||""))}</code> at a time,
                   <code>${esc(String(v.rate||""))}</code>/s`),
  ].join("");
}

function paceDial(title, field, options, values, detail){
  const opts = options || [];
  if(!opts.length) return "";
  const chosen = proj[field];
  return `<div class="setrow">
    <div class="sub" style="flex:1"><b>${esc(title)}</b> ·
      ${opts.map(o=>`<span style="cursor:pointer;${
        o.key === chosen ? "color:var(--accent);font-weight:600" : "opacity:.7"}"
        onclick="setPace('${esc(field)}','${esc(o.key)}')" title="${esc(o.label)}"
        >${esc(o.key)}</span>`).join(" · ")}
      <div style="margin-top:2px">${esc((opts.find(o=>o.key===chosen)||{}).label || "")}
        — ${detail(values || {})}</div>
    </div></div>`;
}

async function setPace(field, key){
  const d = await (await fetch(`/projects/${proj.id}`,{method:"PATCH",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({[field]: key})})).json();
  if(!d.error){ await loadProjects(proj.id); render(); }
}

function editField(field, placeholder){
  document.getElementById("pedit").innerHTML = `
    <div class="card" style="padding:12px;margin-top:6px">
      <div class="addrow">
        <input id="pf" placeholder="${esc(placeholder)}" value="${esc(proj[field]||"")}"
               style="flex:1" onkeydown="if(event.key==='Enter')saveField('${field}')">
        <button onclick="saveField('${field}')">Save</button>
      </div>
    </div>`;
  document.getElementById("pf").focus();
}

async function saveField(field){
  const v = document.getElementById("pf").value;
  const d = await (await fetch(`/projects/${proj.id}`,{method:"PATCH",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({[field]: v})})).json();
  if(!d.error){ await loadProjects(proj.id); render(); }
}

async function createProject(){
  const msg = document.getElementById("np-msg");
  const client = document.getElementById("np-client").value.trim();
  if(!client){ msg.textContent = "a client name is required"; return; }
  msg.textContent = "creating…";
  const d = await (await fetch("/projects",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({client, scope:document.getElementById("np-scope").value,
                         kind:document.getElementById("np-kind").value})})).json();
  if(d.error){ msg.textContent = d.error; return; }
  document.getElementById("np-client").value = "";
  document.getElementById("np-scope").value = "";
  msg.textContent = "";
  await switchProject(d.id);
}

// Start the engagement over without setting it up again. The browser's copy of
// the run state goes too — it is a cache of what was just deleted on disk.
async function clearProjectData(){
  if(!confirm(`Clear all data for ${proj.label}?\n\nThis empties the map and `
              + `deletes every recorded run, including the files they retained. `
              + `The engagement, its scope and your installed tools stay.\n\n`
              + `This cannot be undone.`)) return;
  const msg = document.getElementById("clearmsg");
  if(msg) msg.textContent = " · clearing…";
  try{
    const d = await (await fetch(`/projects/${proj.id}/clear`,{method:"POST"})).json();
    if(d.error){ if(msg) msg.textContent = " · " + d.error; return; }
    // Every run is gone from disk, so nothing the browser remembers about them
    // is true any more — including when they finished, which is what the phase
    // checklist reads.
    forgetRuns();
    restored = true;                 // nothing left on disk to restore
    await loadMap();                 // re-renders with the re-seeded scope
    // Re-query: the render above rebuilt this view, message and all.
    const after = document.getElementById("clearmsg");
    if(after) after.textContent = ` · cleared ${d.nodes} node(s), ${d.runs} run(s)`;
  }catch(e){ if(msg) msg.textContent = " · clear failed"; }
}

async function deleteProject(){
  if(!confirm(`Delete ${proj.label}?\n\nThis removes the engagement and its run `
              + `history. Installed tools are shared and are not touched.`)) return;
  await fetch(`/projects/${proj.id}`,{method:"DELETE"});
  await loadProjects(null);
  setView(SECTIONS.length ? SECTIONS[0][0] : "project");
}

/* ---- settings ---- */
let cfg = {has_token:false};
let showSettings = false;

async function loadSettings(){
  try{ cfg = await (await fetch("/settings")).json(); }catch(e){}
  if(!cfg.has_token) showSettings = true;   // can't add tools without it
  renderSettings();
}
function toggleSettings(){ showSettings = !showSettings; renderSettings(); }

function renderSettings(){
  const el = document.getElementById("v-settings");
  const envLocked = cfg.source === "environment";
  const status = cfg.has_token
    ? `<span class="exit0">token set</span> <span class="sub">${esc(cfg.masked)} · from ${esc(cfg.source)}</span>`
    : `<span class="exitN">no token — adding tools is disabled</span>`;

  const panel = !showSettings ? "" : `
    <div class="card" style="padding:14px">
      ${!cfg.has_token ? `<div class="sub" style="margin-bottom:10px">
        A GitHub token is required. Unauthenticated GitHub allows only ~60 API
        requests/hour and heavy use can get your IP temporarily blocked. A
        <b>fine-grained token with no scopes</b> is enough for public repos:
        GitHub → Settings → Developer settings → Personal access tokens.
      </div>` : ""}
      ${envLocked ? `<div class="sub">Set by an environment variable — edit that to change it.</div>` : `
        <div class="addrow">
          <input id="tok" type="password" placeholder="github_pat_… or ghp_…"
                 onkeydown="if(event.key==='Enter')saveToken()">
          <button onclick="saveToken()">Save</button>
          ${cfg.has_token ? `<button class="ghost" onclick="clearToken()">Remove</button>` : ""}
        </div>`}
      <div class="sub" id="tokmsg" style="margin-top:8px">${esc(cfg.quota||"")}</div>
    </div>`;

  // Edit sits on the setting it edits, not on the page heading — there will be
  // more than one setting here, and a single toggle at the top could not say
  // which one it opens.
  el.innerHTML = `<h2>Settings</h2>
    <div class="setrow">
      <div class="sub"><b>GitHub</b> · ${status}</div>
      ${envLocked ? "" : `<span class="setedit" onclick="toggleSettings()">
        ${showSettings ? "hide" : "edit"}</span>`}
    </div>
    ${panel}
    <h2 style="margin-top:28px;color:var(--red)">Danger zone</h2>
    <div class="card" style="padding:14px;border-color:var(--red)">
      <div class="sub" style="margin-bottom:10px">
        <b>Remove every installed tool.</b> Deletes all ${tools.size} tool
        record${tools.size===1?"":"s"}, the binaries and checkouts they
        installed, and the cached repo data. Baseline tools reinstall on the
        next start; anything you added yourself has to be re-added. Cannot be
        undone.
      </div>
      <div class="addrow">
        <input id="clearword" placeholder='type "delete" to confirm'
               onkeydown="if(event.key==='Enter')clearAll()" style="max-width:220px">
        <button onclick="clearAll()" style="background:var(--red)">Remove all tools</button>
        <span class="sub" id="clearmsg"></span>
      </div>
    </div>`;

  // gate the Add button on having a token
  const btn = document.getElementById("addbtn");
  if(btn){ btn.disabled = !cfg.has_token;
           btn.title = cfg.has_token ? "" : "add a GitHub token first"; }
}

async function saveToken(){
  const input = document.getElementById("tok");
  const msg = document.getElementById("tokmsg");
  if(!input || !input.value.trim()) return;
  msg.textContent = "checking with GitHub…";
  try{
    const d = await (await fetch("/settings",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({github_token:input.value.trim()})})).json();
    cfg = d;
    // `has_token` only means SOME token is stored — it is NOT proof this save
    // worked. Gate on `saved`, or a rejected token silently looks successful
    // while the old one stays in place.
    const worked = d.saved === true;
    if(worked) showSettings = false;            // collapse only on real success
    renderSettings();
    const m = document.getElementById("tokmsg");
    if(m) m.innerHTML = worked
      ? `<span class="exit0">✓ ${esc(d.detail||"saved")}</span>`
      : `<span class="exitN"><b>Not saved.</b> ${esc(d.detail||"")}</span>`;
  }catch(e){ msg.textContent = "request failed"; }
}
async function clearToken(){
  if(!confirm("Remove the saved GitHub token? Adding tools will be disabled.")) return;
  cfg = await (await fetch("/settings",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({github_token:""})})).json();
  showSettings = true; renderSettings();
}

fetch("/tools").then(r=>r.json()).then(d=>{
  document.getElementById("dock").textContent = d.queue_depth ? `queue: ${d.queue_depth}` : "";
});
// Projects first: the sidebar, section lists and run scoping all depend on
// knowing which engagement is selected.
loadProjects().then(()=>{ render(); loadMap(); connect(); });
loadSettings();
</script>
