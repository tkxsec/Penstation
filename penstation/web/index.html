<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>penstation · add a tool</title>
<style>
  :root{ --bg:#ffffff; --panel:#f6f8fa; --border:#d0d7de; --fg:#1f2328; --dim:#656d76;
         --accent:#0969da; --green:#1a7f37; --amber:#9a6700; --red:#cf222e; }
  *{ box-sizing:border-box; }
  body{ margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
        background:var(--bg); color:var(--fg); }
  header{ padding:14px 20px; border-bottom:1px solid var(--border); background:var(--panel);
          display:flex; align-items:center; gap:12px; }
  h1{ margin:0; font-size:16px; letter-spacing:.5px; } h1 span{ color:var(--accent); }
  .dockstate{ font-size:12px; color:var(--dim); }
  .app{ display:grid; grid-template-columns:210px minmax(0,1fr); align-items:start; }
  main{ min-width:0; padding:22px 20px; max-width:940px; }
  nav{ position:sticky; top:0; padding:22px 0 22px 14px; }
  nav a{ display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:7px 12px; margin:1px 0; border-radius:6px; cursor:pointer;
    color:var(--muted); font-size:13px; user-select:none; }
  nav a:hover{ background:var(--panel); color:var(--fg); }
  nav a.on{ background:var(--panel); color:var(--fg); font-weight:600;
    box-shadow:inset 2px 0 0 var(--accent); }
  nav .navgap{ height:14px; }
  nav .count{ font-size:11px; color:var(--muted); font-weight:400; }
  nav .dot{ width:7px; height:7px; border-radius:50%; background:var(--red);
    flex:0 0 auto; }
  /* Collapsed: a thin strip with just the re-open arrow. */
  .app.narrow{ grid-template-columns:36px minmax(0,1fr); }
  .app.narrow nav a{ display:none; }
  .app.narrow nav .navgap{ display:none; }
  .app.narrow nav{ padding-left:6px; }
  /* Sits at the bottom of the sidebar, below Settings, pinned there even when
     the nav is short. */
  nav{ display:flex; flex-direction:column; min-height:calc(100vh - 52px); }
  .pswitch{ position:relative; margin:0 6px 10px 0; }
  .pswitch > a{ background:var(--panel); border:1px solid var(--line); }
  .pmenu{ position:absolute; z-index:20; left:0; right:0; top:100%; margin-top:3px;
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    box-shadow:0 6px 18px rgba(0,0,0,.10); padding:4px; }
  .app.narrow .pswitch{ display:none; }
  .navtoggle{ display:flex; justify-content:flex-end; margin:auto 6px 8px 0;
    padding-top:10px; }
  .navtoggle button{ all:unset; cursor:pointer; color:var(--muted); font-size:15px;
    line-height:1; padding:4px 6px; border-radius:5px; position:relative; }
  .navtoggle button:hover{ background:var(--panel); color:var(--fg); }
  .app.narrow .navtoggle{ justify-content:center; margin-right:0; }
  .app.narrow nav{ min-height:calc(100vh - 52px); }
  /* Collapsing hides the per-section spinners and dots, so any activity is
     mirrored onto the toggle itself — otherwise a build failing behind a
     collapsed sidebar is invisible. */
  .navtoggle button .dot, .navtoggle button .spin{ position:absolute;
    top:0; right:0; }

  /* The sidebar stays a left column at every width — stacking it on top pushed
     the tools down the page and lost the layout you navigate by. It just gets
     narrower instead, and long labels ellipsize rather than wrap. */
  nav a > span:first-child{ overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; }
  @media (max-width:780px){
    .app{ grid-template-columns:150px minmax(0,1fr); }
    nav{ padding:16px 0 16px 8px; }
    nav a{ padding:6px 8px; font-size:12px; }
    main{ padding:16px 14px; }
  }
  @media (max-width:520px){
    .app{ grid-template-columns:118px minmax(0,1fr); }
  }
  h2{ font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:0 0 10px; }
  section{ margin-bottom:26px; }
  input, select, button{ font:inherit; }
  input, select{ background:#fff; border:1px solid var(--border); color:var(--fg);
                 border-radius:6px; padding:9px 11px; }
  button{ background:var(--accent); color:#fff; border:0; border-radius:6px;
          padding:9px 18px; cursor:pointer; font-weight:600; }
  button.ghost{ background:#fff; color:var(--fg); border:1px solid var(--border); font-weight:400; }
  button:disabled{ opacity:.45; cursor:default; }
  .addrow{ display:flex; gap:8px; flex-wrap:wrap; }
  .addrow input{ flex:1; min-width:260px; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  .err{ color:var(--red); font-size:13px; margin-top:8px; }
  .card{ border:1px solid var(--border); border-radius:8px; background:#fff; margin-bottom:10px; }
  .card .top{ display:flex; justify-content:space-between; align-items:center; gap:10px;
              padding:12px 14px; cursor:pointer; }
  .nm{ font-weight:600; }
  .sub{ color:var(--dim); font-size:12px; margin-top:2px; }
  .right{ display:flex; align-items:center; gap:10px; }
  .badge{ font-size:11px; padding:2px 9px; border-radius:20px; border:1px solid var(--border);
          white-space:nowrap; }
  .badge.queued,.badge.inspecting{ color:var(--dim); }
  .badge.building,.badge.repairing,.badge.verifying{ color:var(--amber); border-color:var(--amber); }
  .badge.ready{ color:var(--green); border-color:var(--green); }
  .badge.failed{ color:var(--red); border-color:var(--red); }
  .secthead{ display:flex; justify-content:space-between; align-items:baseline;
    margin:18px 0 8px; font-size:11px; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); }
  .secthead:first-child{ margin-top:0; }
  .manual{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .manual textarea{ width:100%; box-sizing:border-box; font-family:ui-monospace,
    SFMono-Regular,Menlo,monospace; font-size:12px; padding:8px;
    border:1px solid var(--line); border-radius:6px; background:var(--bg);
    color:var(--fg); resize:vertical; }
  .spin{ display:inline-block; width:9px; height:9px; border:2px solid var(--amber);
         border-right-color:transparent; border-radius:50%; animation:s .7s linear infinite; }
  @keyframes s{ to{ transform:rotate(360deg) } }
  .body{ border-top:1px solid var(--border); padding:12px 14px; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:13px; margin-bottom:10px; }
  .kv div:nth-child(odd){ color:var(--dim); }
  code{ font-family:ui-monospace,Menlo,monospace; font-size:12px; word-break:break-all; }
  pre{ background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:10px;
       overflow:auto; max-height:340px; font-size:12px; white-space:pre-wrap; margin:0; }
  /* terminal pane — matches what the backend prints, colours preserved */
  pre.term{ background:#000; color:#e5e5e5; border-color:#30363d;
            font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
            font-size:12px; line-height:1.45; padding:11px 12px;
            white-space:pre-wrap; word-break:break-word; }
  pre.term::selection, pre.term ::selection{ background:#3b8eea; color:#fff; }
  .empty{ color:var(--dim); font-style:italic; }
  .runbox{ border-top:1px solid var(--border); padding:12px 14px; background:var(--panel); }
  table.hist{ width:100%; border-collapse:collapse; font-size:13px; }
  table.hist tr{ cursor:pointer; border-bottom:1px solid var(--line); }
  table.hist tr:hover{ background:var(--panel); }
  table.hist td{ padding:6px 8px; vertical-align:top; }
  table.hist td:first-child{ white-space:nowrap; font-variant-numeric:tabular-nums; }
  .setrow{ display:flex; justify-content:space-between; align-items:baseline;
    gap:12px; margin:-4px 0 6px; }
  .setedit{ cursor:pointer; color:var(--accent); font-size:11px; font-weight:600;
    letter-spacing:.5px; text-transform:uppercase; flex:0 0 auto; }
  .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim);
                margin-bottom:4px; display:flex; justify-content:space-between; }
  .runbox .fields{ display:flex; gap:8px; align-items:center; }
  .runbox input{ flex:1; font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .exit0{ color:var(--green); } .exitN{ color:var(--red); }
  /* command + live output on the left, --help reference on the right */
  .split{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px; }
  @media (max-width:900px){ .split{ grid-template-columns:1fr; } }
  .split pre{ max-height:300px; }
  .running{ color:var(--amber); font-size:12px; }
  .tabs{ display:flex; gap:14px; border-bottom:1px solid var(--border); margin-bottom:10px; }
  .tabs a{ font-size:12px; color:var(--dim); cursor:pointer; padding-bottom:6px;
           border-bottom:2px solid transparent; }
  .tabs a.on{ color:var(--fg); border-bottom-color:var(--accent); }
  button.stop{ background:var(--red); }
</style>
</head>
<body>
<header>
  <h1>pen<span>station</span></h1>
  <span class="dockstate" id="dock"></span>
</header>
<div class="app" id="app">
<nav id="nav"></nav>
<main>
  <section id="v-settings" hidden></section>
  <section id="v-add" hidden>
    <h2>Add Tool</h2>
    <div class="addrow">
      <input id="url" placeholder="https://github.com/owner/repo" onkeydown="if(event.key==='Enter')add()">
      <select id="section">
        <option value="reconnaissance">Reconnaissance</option>
        <option value="active-scanning">Active Scanning</option>
        <option value="web-analysis">Web Analysis</option>
        <option value="password-spraying">Password Spraying</option>
        <option value="exploitation">Exploitation</option>
      </select>
      <button id="addbtn" onclick="add()">Add</button>
    </div>
    <div class="err" id="err"></div>
    <h2 style="display:flex;justify-content:space-between;align-items:baseline;margin-top:26px">
      <span>All tools</span>
      <span id="clearall" style="cursor:pointer;color:var(--red);font-size:12px;
            font-weight:400" onclick="clearAll()"></span></h2>
    <div id="alllist"><div class="empty">Nothing added yet.</div></div>
  </section>
  <section id="v-project" hidden></section>
  <section id="v-newproject" hidden>
    <h2>New Project</h2>
    <div class="card" style="padding:14px">
      <div class="lbl"><span>client</span></div>
      <input id="np-client" placeholder="ACME Corp" style="width:100%;box-sizing:border-box">
      <div class="lbl" style="margin-top:10px"><span>scope</span></div>
      <input id="np-scope" placeholder="*.acme.com, 203.0.113.0/24"
             style="width:100%;box-sizing:border-box">
      <div class="lbl" style="margin-top:10px"><span>engagement type</span></div>
      <select id="np-kind"><option value="external">external</option></select>
      <div class="fields" style="margin-top:12px">
        <button onclick="createProject()">Create</button>
        <span class="sub" id="np-msg"></span>
      </div>
    </div>
  </section>
  <section id="v-tools" hidden>
    <h2 id="secttitle">Tools</h2>
    <div id="list"><div class="empty">Nothing added yet.</div></div>
  </section>
</main>
</div>

<script>
// Sections come from the engagement type, so they arrive with the project
// rather than being hardcoded — an internal test runs through different phases.
let PROJECTS = [];            // every engagement
let proj = null;              // the one selected
let SECTIONS = [];            // [key,label] for proj.kind
let SECTION_LABEL = new Map();
let switcherOpen = false;

function applyProject(p){
  proj = p || null;
  SECTIONS = proj ? proj.section_list.map(s=>[s.key, s.label]) : [];
  SECTION_LABEL = new Map(SECTIONS);
}

async function loadProjects(keep){
  const d = await (await fetch("/projects")).json();
  PROJECTS = d.projects || [];
  const want = keep || (proj && proj.id) || (location.hash||"").slice(1).split("/")[0];
  applyProject(PROJECTS.find(p=>p.id===want) || PROJECTS[0]);
}

// Tools this project has filed into a section, in the order they were added.
function toolsIn(section){
  if(!proj) return [];
  return (proj.sections[section]||[]).map(id=>tools.get(id)).filter(Boolean);
}

// Which panel is showing: "add", "settings", or a section key. Kept in the URL
// hash so a reload lands you back where you were — with builds this slow, and
// the amount of refreshing that goes on, losing your place is a real cost.
let view = ((location.hash || "").slice(1).split("/")[1]) || "";
let navOpen = localStorage.getItem("navOpen") !== "0";

function toggleNav(){
  navOpen = !navOpen;
  localStorage.setItem("navOpen", navOpen ? "1" : "0");
  renderNav();
}

function setView(v){
  view = v;
  if(!navOpen) toggleNav();
  switcherOpen = false;
  history.replaceState(null, "", "#" + (proj?proj.id:"") + "/" + v);
  render();
}

async function switchProject(id){
  await loadProjects(id);
  switcherOpen = false;
  setView(SECTIONS.length ? SECTIONS[0][0] : "project");
}

const tools = new Map();      // id -> record
const logs  = new Map();      // id -> accumulated log text
const open  = new Set();      // expanded cards
const runs   = new Map();     // id -> {busy} | {code, files} | {error}
const runout = new Map();     // id -> accumulated live run output
const tabs   = new Map();     // id -> "run" | "log"
const ACTIVE = ["queued","inspecting","building","repairing","verifying"];
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---- ANSI → HTML, so output looks like the real terminal ----
   Tools colour their output with ANSI escapes (bbot emits ~110 per scan).
   Rather than strip them, translate to spans and render on a black pane.
   Every text chunk is HTML-escaped, so tool output can never inject markup. */
const BASIC16 = ["#000000","#cd3131","#0dbc79","#e5e510","#2472c8","#bc3fbc",
                 "#11a8cd","#e5e5e5","#666666","#f14c4c","#23d18b","#f5f543",
                 "#3b8eea","#d670d6","#29b8db","#ffffff"];
const CUBE = [0,95,135,175,215,255];

function xterm256(n){
  n = Number(n)||0;
  if(n < 16) return BASIC16[n];
  if(n < 232){ const c=n-16;
    return `rgb(${CUBE[Math.floor(c/36)]},${CUBE[Math.floor((c%36)/6)]},${CUBE[c%6]})`; }
  const g = 8 + (n-232)*10; return `rgb(${g},${g},${g})`;
}

// SGR colour codes are translated; other escapes (cursor moves, OSC titles) dropped.
const ANSI_RE = /\x1b\[([0-9;]*)m|\x1b\[[0-9;?]*[a-zA-Z]|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g;

function ansiToHtml(text){
  let fg=null, bg=null, bold=false, dim=false, ul=false, it=false;
  let out="", last=0, m;
  const style = () => {
    const s=[];
    if(fg) s.push("color:"+fg);
    if(bg) s.push("background:"+bg);
    if(bold) s.push("font-weight:700");
    if(dim) s.push("opacity:.6");
    if(ul) s.push("text-decoration:underline");
    if(it) s.push("font-style:italic");
    return s.join(";");
  };
  const emit = chunk => {
    if(!chunk) return;
    const st = style();
    out += st ? `<span style="${st}">${esc(chunk)}</span>` : esc(chunk);
  };
  ANSI_RE.lastIndex = 0;
  while((m = ANSI_RE.exec(text)) !== null){
    emit(text.slice(last, m.index));
    last = ANSI_RE.lastIndex;
    if(m[1] === undefined) continue;                 // not an SGR — drop it
    const p = m[1] === "" ? [0] : m[1].split(";").map(Number);
    for(let i=0;i<p.length;i++){
      const c = p[i];
      if(c===0){ fg=bg=null; bold=dim=ul=it=false; }
      else if(c===1) bold=true;
      else if(c===2) dim=true;
      else if(c===3) it=true;
      else if(c===4) ul=true;
      else if(c===22){ bold=false; dim=false; }
      else if(c===23) it=false;
      else if(c===24) ul=false;
      else if(c===39) fg=null;
      else if(c===49) bg=null;
      else if(c>=30 && c<=37)   fg=BASIC16[c-30];
      else if(c>=90 && c<=97)   fg=BASIC16[c-90+8];
      else if(c>=40 && c<=47)   bg=BASIC16[c-40];
      else if(c>=100 && c<=107) bg=BASIC16[c-100+8];
      else if(c===38 || c===48){
        const isFg = c===38, mode = p[i+1];
        let col = null;
        if(mode===5){ col = xterm256(p[i+2]); i+=2; }
        else if(mode===2){ col = `rgb(${p[i+2]||0},${p[i+3]||0},${p[i+4]||0})`; i+=4; }
        if(col){ if(isFg) fg=col; else bg=col; }
      }
    }
  }
  emit(text.slice(last));
  return out;
}

// Keep panes bounded — a long scan can emit megabytes.
const MAX_PANE = 250000;
const clip = s => (s && s.length > MAX_PANE) ? s.slice(-MAX_PANE) : (s||"");

/* ---- events ---- */
function connect(){
  const es = new EventSource("/events");
  es.addEventListener("snapshot", e => {
    JSON.parse(e.data).forEach(t => tools.set(t.id, t));
    render();
    // fetch logs for anything already in flight or finished
    tools.forEach((t,id) => { if(!logs.has(id)) fetchLog(id); });
  });
  es.addEventListener("status", e => {
    const t = JSON.parse(e.data); tools.set(t.id, t);
    if(ACTIVE.includes(t.status)) open.add(t.id);   // auto-expand while working
    render();
  });
  es.addEventListener("log", e => {
    const d = JSON.parse(e.data);
    logs.set(d.id, (logs.get(d.id)||"") + d.line);
    paintLog(d.id);
  });
  es.addEventListener("run_start", e => {
    const d = JSON.parse(e.data);
    runout.set(d.id, ""); runs.set(d.id, {busy:true}); render();
  });
  es.addEventListener("run_log", e => {
    const d = JSON.parse(e.data);
    runout.set(d.id, (runout.get(d.id)||"") + d.line);
    paintRun(d.id);
  });
  es.addEventListener("run_done", e => {
    const d = JSON.parse(e.data);
    runs.set(d.id, {code:d.code, files:d.files, error:d.error});
    render();
  });
  es.addEventListener("removed", e => {
    const d = JSON.parse(e.data);
    tools.delete(d.id); logs.delete(d.id); runout.delete(d.id); runs.delete(d.id); render();
  });
}
async function fetchLog(id){
  try{ const d = await (await fetch(`/tools/${id}/log`)).json();
       if(d.log){ logs.set(id, d.log); paintLog(id); } }catch(e){}
}

/* ---- actions ---- */
async function add(){
  const url = document.getElementById("url").value.trim();
  const section = document.getElementById("section").value;
  const btn = document.getElementById("addbtn"), err = document.getElementById("err");
  err.textContent = ""; if(!url) return;
  btn.disabled = true;
  try{
    const d = await (await fetch("/tools",{method:"POST",headers:{"Content-Type":"application/json"},
                                           body:JSON.stringify({url, section, project: proj?proj.id:""})})).json();
    if(d.error){ err.textContent = d.error;
                 if(d.need_token){ showSettings = true; loadSettings(); setView("settings"); } }
    else { tools.set(d.id,d); open.add(d.id); logs.set(d.id,"");
           document.getElementById("url").value="";
           setView(d.section);   // follow the tool into its section to watch it build
    }
  }catch(e){ err.textContent = "request failed"; }
  btn.disabled = false;
}
const retry = id => fetch(`/tools/${id}/retry`,{method:"POST"});

async function assignTool(){
  const sel = document.getElementById("pick");
  if(!sel.value) return;
  await fetch(`/projects/${proj.id}/sections/${view}/tools`,{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({tool_id: sel.value})});
  await loadProjects(proj.id); render();
}

// Unassign only. The image stays installed and available to every other
// engagement — uninstalling lives under Add Tool and asks first.
async function unassign(id){
  await fetch(`/projects/${proj.id}/sections/${view}/tools/${id}`,{method:"DELETE"});
  await loadProjects(proj.id); render();
}

// Removes every record, image, per-tool volume and cached repo signal.
async function clearAll(){
  const n = tools.size;
  if(!n) return;
  if(!confirm(`Delete all ${n} tool(s)?\n\nThis also removes their Docker images, `
              + `per-tool volumes, and cached repo data. Cannot be undone.`)) return;
  const el = document.getElementById("clearall");
  el.textContent = "clearing…";
  try{
    const d = await (await fetch("/tools",{method:"DELETE"})).json();
    tools.clear(); logs.clear(); runout.clear(); runs.clear(); open.clear();
    render();
    el.textContent = `removed ${d.removed.length} tool(s), ${d.cache} cached`;
    setTimeout(renderClear, 3000);
  }catch(e){ el.textContent = "clear failed"; }
}
function renderClear(){
  const el = document.getElementById("clearall");
  if(el) el.textContent = tools.size ? "clear all" : "";
}

// Compose the whole failure into a prompt you can paste into a capable model,
// then paste its Dockerfile straight back into the box above. Keeps a strong
// model in the loop without an API key or any inference on this machine.
async function copyPrompt(id){
  const msg = document.getElementById(`manmsg-${id}`);
  try{
    const d = await (await fetch(`/tools/${id}/prompt`)).json();
    if(d.error){ msg.textContent = d.error; return; }
    await navigator.clipboard.writeText(d.prompt);
    msg.textContent = "prompt copied — paste it to an AI, then paste the Dockerfile above";
  }catch(e){ msg.textContent = "couldn't copy (clipboard needs https or localhost)"; }
}

async function sendManual(id){
  const box = document.getElementById(`man-${id}`);
  const msg = document.getElementById(`manmsg-${id}`);
  const text = (box.value||"").trim();
  if(!text){ msg.textContent = "paste something first"; return; }
  // A full Dockerfile has to start with FROM; anything else is an install line.
  const isDockerfile = /^\s*FROM\s/i.test(text);
  msg.textContent = "validating…";
  try{
    const d = await (await fetch(`/tools/${id}/install`,{method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(isDockerfile ? {dockerfile:text} : {install_cmd:text})})).json();
    msg.textContent = d.error ? d.error : "building…";
  }catch(e){ msg.textContent = "request failed"; }
}
const drop  = id => confirm(`Remove ${id}?`) && fetch(`/tools/${id}`,{method:"DELETE"});
function toggle(id){ open.has(id) ? open.delete(id) : open.add(id); render(); }
function setPane(id, pane){ tabs.set(id, pane); render(); }

// Every recorded run of this tool in this engagement. Output is stored, so a
// scan from last week is still readable — that is the point of filing runs
// under a client rather than leaving them in the browser.
async function showHistory(id){
  tabs.set(id, "hist"); render();
  const box = document.getElementById(`hist-${id}`);
  if(!box) return;
  try{
    const d = await (await fetch(`/projects/${proj.id}/runs/${id}`)).json();
    const rs = d.runs || [];
    box.innerHTML = rs.length ? `<table class="hist">${rs.map(r=>`
      <tr onclick="showRun('${id}','${r.id}')">
        <td class="${r.exit_code===0?'exit0':'exitN'}">${r.exit_code===0?"✓":"✕"} ${r.exit_code}</td>
        <td><code>${esc(r.command)}</code></td>
        <td class="sub">${ago(r.started_at)}</td>
        <td class="sub">${r.duration}s</td>
      </tr>`).join("")}</table>`
      : `<div class="sub">No runs recorded for ${esc(id)} in this engagement yet.</div>`;
  }catch(e){ box.innerHTML = `<div class="err">couldn't load history</div>`; }
}

async function showRun(id, runId){
  const box = document.getElementById(`hist-${id}`);
  const d = await (await fetch(`/projects/${proj.id}/runs/${id}/${runId}`)).json();
  if(d.error){ box.innerHTML = `<div class="err">${esc(d.error)}</div>`; return; }
  box.innerHTML = `
    <div class="lbl"><span>${esc(d.command)}</span>
      <span class="sub">${ago(d.started_at)} · ${d.duration}s ·
        <span class="${d.exit_code===0?'exit0':'exitN'}">exit ${d.exit_code}</span></span></div>
    <pre class="term">${ansiToHtml(d.output||"")}</pre>
    <div class="sub" style="margin-top:8px;cursor:pointer;color:var(--accent)"
         onclick="showHistory('${id}')">← back to history</div>`;
}

function ago(ts){
  const s = Math.max(0, Date.now()/1000 - ts);
  if(s < 60)    return `${Math.round(s)}s ago`;
  if(s < 3600)  return `${Math.round(s/60)}m ago`;
  if(s < 86400) return `${Math.round(s/3600)}h ago`;
  return new Date(ts*1000).toLocaleDateString();
}

async function doRun(id){
  const command = document.getElementById("cmd-"+id).value.trim();
  if(!command) return;
  const t = tools.get(id); if(t) t.last_command = command;   // keep it on re-render
  runs.set(id, {busy:true}); runout.set(id, ""); render();
  try{
    const d = await (await fetch(`/tools/${id}/run`,{method:"POST",
      headers:{"Content-Type":"application/json"},
      // The engagement and section are what make the recorded run attributable.
      body:JSON.stringify({command, project: proj?proj.id:"", section: view})})).json();
    if(d.error){ runs.set(id, {error:d.error}); render(); }
    // success: output arrives via run_log/run_done on the event stream
  }catch(e){ runs.set(id, {error:"request failed"}); render(); }
}
const doStop = id => fetch(`/tools/${id}/stop`,{method:"POST"});
async function refreshHelp(id){
  const d = await (await fetch(`/tools/${id}/help`,{method:"POST"})).json();
  const t = tools.get(id);
  if(t && d.help_text !== undefined){ t.help_text = d.help_text; render(); }
}
function paintRun(id){
  const p = document.getElementById("run-"+id);
  if(!p) return;   // not on screen; the buffer paints when the view opens
  p.innerHTML = ansiToHtml(clip(runout.get(id)));
  p.scrollTop = p.scrollHeight;
}

/* ---- render ---- */
function renderNav(){
  const all = [...tools.values()];
  const item = (key, label, extra) => {
    const mine = toolsIn(key);
    // A section counts what you can actually run there. Building and failing
    // are install concerns, so their spinner and dot live on "Add Tool" —
    // that is the view you would go to in order to do anything about them.
    const ready = mine.filter(t=>t.status==="ready").length;
    const mark = ready ? `<span class="count">${ready}</span>` : "";
    return `<a class="${view===key?'on':''}" onclick="setView('${key}')">
      <span>${label}</span>${extra||mark}</a>`;
  };
  const anyBusy = all.some(t=>ACTIVE.includes(t.status));
  const anyBad  = all.some(t=>t.status==="failed");
  const installMark = anyBusy ? '<span class="spin"></span>'
                    : anyBad  ? '<span class="dot"></span>' : "";
  const badge = navOpen ? "" : installMark;
  document.getElementById("app").classList.toggle("narrow", !navOpen);

  // The switcher names the engagement everything below is scoped to; without it
  // the sections are ambiguous the moment there is more than one client.
  const menu = !switcherOpen ? "" : `<div class="pmenu">
    ${PROJECTS.map(p=>`<a class="${proj&&p.id===proj.id?'on':''}"
        onclick="switchProject('${p.id}')"><span>${esc(p.label)}</span>
        <span class="sub">${esc(p.kind)}</span></a>`).join("")}
    <a onclick="setView('newproject')"><span>＋ New project</span></a>
  </div>`;
  const switcher = `<div class="pswitch">
      <a onclick="switcherOpen=!switcherOpen;renderNav()">
        <span><b>${esc(proj?proj.label:"No project")}</b><br>
          <span class="sub">${esc(proj?proj.kind:"")}</span></span>
        <span class="sub">▾</span></a>${menu}
    </div>`;

  document.getElementById("nav").innerHTML = switcher
    + `<a class="${view==='project'?'on':''}" onclick="setView('project')"><span>Project</span></a>`
    + `<div class="navgap"></div>`
    + SECTIONS.map(([k,l])=>item(k,l)).join("")
    + `<div class="navgap"></div>`
    + `<a class="${view==='add'?'on':''}" onclick="setView('add')">
         <span>+ Add Tool</span>${installMark}</a>`
    + `<a class="${view==='settings'?'on':''}" onclick="setView('settings')"><span>Settings</span></a>`
    + `<div class="navtoggle"><button onclick="toggleNav()"
         title="${navOpen?'Collapse':'Expand'} sidebar">${navOpen?'‹':'›'}${badge}</button></div>`;
}

function render(){
  // Start at the first phase of an engagement, whether or not it has tools yet.
  if(!view){
    view = SECTIONS[0][0];
    history.replaceState(null, "", "#" + view);
  }
  renderNav();
  const isSection = SECTION_LABEL.has(view);
  document.getElementById("v-add").hidden        = view !== "add";
  document.getElementById("v-settings").hidden   = view !== "settings";
  document.getElementById("v-project").hidden    = view !== "project";
  document.getElementById("v-newproject").hidden = view !== "newproject";
  document.getElementById("v-tools").hidden      = !isSection;
  if(view === "settings") renderSettings();
  if(view === "project") renderProject();
  renderClear();
  if(!isSection && view !== "add") return;
  if(isSection) document.getElementById("secttitle").textContent = SECTION_LABEL.get(view);

  // `card` is a const, so every use has to come after this point — calling it
  // above threw a ReferenceError that silently aborted the rest of render(),
  // leaving "All tools" stuck on its placeholder.
  const card = (t, mode)=>{
    const working = ACTIVE.includes(t.status);
    const wait = (t.status==="queued" && t.queue_position>0) ? ` (position ${t.queue_position})` : "";
    const badge = `<span class="badge ${t.status}">${working?'<span class="spin"></span> ':''}${t.status}${wait}</span>`;
    const actions = t.status==="failed" ? `<button class="ghost" onclick="event.stopPropagation();retry('${t.id}')">Retry</button>` : "";
    const detail = t.detail ? `<div class="sub">${esc(t.detail)}</div>` : "";
    const tab = tabs.get(t.id) || (t.status==="ready" ? "run" : "log");
    const r = runs.get(t.id);
    const busy = !!(r && r.busy);
    // Only suggest a command when a real target flag was documented. A bare
    // "<tool> example.com" guess is worse than no guess — it teaches the wrong
    // invocation (bbot actually needs -t).
    const tmpl = t.run_template || "";
    const hint = /^\S+\s+-/.test(tmpl)
      ? tmpl.replace("{{target}}", "example.com")
      : `type a command — check --help →`;
    let footer = "";
    if (busy)             footer = `<span class="running">running…</span>`;
    else if (r && r.error) footer = `<span class="err">${esc(r.error)}</span>`;
    else if (r && r.code !== undefined)
      footer = `<span class="${r.code===0?'exit0':'exitN'}">exit ${r.code}</span>` +
               ((r.files&&r.files.length) ? ` <span class="sub">· files: ${r.files.map(f=>esc(f.name)+" ("+f.bytes+"b)").join(", ")}</span>` : "");

    const runPane = `
      <div class="runbox">
        <div class="lbl"><span>command</span><span class="sub">runs inside ${esc(t.image)}</span></div>
        <div class="fields">
          <input id="cmd-${t.id}" value="${esc(t.last_command||"")}" placeholder="${esc(hint)}"
                 onkeydown="if(event.key==='Enter')doRun('${t.id}')">
          ${busy
            ? `<button class="stop" onclick="doStop('${t.id}')">Stop</button>`
            : `<button onclick="doRun('${t.id}')">Run</button>`}
        </div>
        <div class="split">
          <div>
            <div class="lbl" style="margin-top:10px"><span>output</span>${footer}</div>
            <pre class="term" id="run-${t.id}">${ansiToHtml(clip(runout.get(t.id)))}</pre>
          </div>
          <div>
            <div class="lbl" style="margin-top:10px"><span>--help</span>
              <span class="sub" style="cursor:pointer;color:var(--accent)"
                    onclick="refreshHelp('${t.id}')">refresh</span></div>
            <pre class="term">${t.help_text ? ansiToHtml(t.help_text) : esc("(no help captured — try running `"+t.id+" --help` above)")}</pre>
          </div>
        </div>
      </div>`;
    const infoPane = `
      <div class="body">
        <div class="kv">
          <div>source</div><div><code>${esc(t.source_url)}</code></div>
          <div>section</div><div>${esc(t.section)}</div>
          <div>strategy</div><div>${esc(t.strategy||"—")}</div>
          <div>image</div><div><code>${esc(t.image||"—")}</code></div>
          <div>install</div><div><code>${esc(t.install_cmd||"—")}</code></div>
          <div>commit</div><div><code>${esc(t.resolved_ref||"—")}</code> ${t.argv_mode?("· argv "+esc(t.argv_mode)):""}</div>
        </div>
        <div class="lbl" style="margin-top:10px"><span>Setup Log</span></div>
        <pre class="term" id="log-${t.id}">${ansiToHtml(clip(logs.get(t.id)))}</pre>
        ${t.status!=="failed" ? "" : `
        <div class="manual">
          <div class="lbl"><span>provide the install yourself</span></div>
          <div class="sub" style="margin-bottom:8px">
            Copy the install line from the project&rsquo;s README &mdash; we clone the
            repo and wrap it the same way as every other recipe. Paste a whole
            Dockerfile only if one line can&rsquo;t express it.
          </div>
          <textarea id="man-${t.id}" rows="3" spellcheck="false"
            placeholder="pip install -r requirements.txt&#10;&#10;&mdash; or a full Dockerfile starting with FROM">${esc(t.manual_dockerfile||t.manual_install||"")}</textarea>
          <div class="fields" style="margin-top:8px">
            <button onclick="event.stopPropagation();sendManual('${t.id}')">Build this</button>
            <button class="ghost" onclick="event.stopPropagation();copyPrompt('${t.id}')">Copy prompt for an AI</button>
            <span class="sub" id="manmsg-${t.id}"></span>
          </div>
        </div>`}
      </div>`;
    // Two surfaces, two jobs. "Add Tool" is where installs live: every tool,
    // its setup log, retry and the paste box. A section is where you *use* the
    // tool, so it shows only the run box — mixing them meant scrolling past
    // build output to reach a command line.
    const notReady = `<div class="body"><div class="sub">
        ${esc(t.status)} — installs are managed under
        <a style="color:var(--accent);cursor:pointer"
           onclick="event.stopPropagation();setView('add')">Add Tool</a>.
      </div></div>`;
    // In a section the run box leads, but the setup log stays one click away —
    // it is what you check when a tool misbehaves at runtime.
    const tabBar = `<div class="body" style="padding-bottom:0">
        <div class="tabs">
          <a class="${tab==='run'?'on':''}" onclick="setPane('${t.id}','run')">Run</a>
          <a class="${tab==='log'?'on':''}" onclick="setPane('${t.id}','log')">Setup Log</a>
          <a class="${tab==='hist'?'on':''}" onclick="showHistory('${t.id}')">History</a>
        </div></div>`;
    // A section is where you work, so its cards stay open — collapsing the run
    // box behind a click is friction on the thing you came here to do. Add Tool
    // keeps the fold: it lists everything, and setup logs are long.
    const expanded = mode === "run" || open.has(t.id);
    const bodyHtml = !expanded ? ""
      : mode === "manage" ? infoPane
      : t.status !== "ready" ? notReady
      : tabBar + (tab === "run" ? runPane
                : tab === "hist" ? `<div class="body"><div id="hist-${t.id}">
                    <div class="sub">loading…</div></div></div>`
                : infoPane);
    return `<div class="card">
      <div class="top" ${mode === "manage" ? `onclick="toggle('${t.id}')"`
                                           : 'style="cursor:default"'}>
        <div><span class="nm">${esc(t.id)}</span>${detail}</div>
        <div class="right">${badge}${actions}
          ${mode === "manage"
            ? `<button class="ghost" title="Uninstall the image everywhere"
                 onclick="event.stopPropagation();drop('${t.id}')">✕</button>`
            : `<button class="ghost" title="Remove from this section (keeps the image)"
                 onclick="event.stopPropagation();unassign('${t.id}')">⊖</button>`}</div>
      </div>${bodyHtml}</div>`;
  };

  // Group under section headings, in engagement order. Empty sections are
  // hidden — an external test rarely uses every phase, and blank headers are
  // just noise. Anything with an unrecognised section (an older record, or one
  // whose section was retired) falls through to a final group rather than
  // vanishing from the list.
  if(view === "add"){
    // Everything installed, newest first, with its setup log and controls.
    const all = [...tools.values()].sort((a,b)=>b.created_at-a.created_at);
    document.getElementById("alllist").innerHTML = all.length
      ? all.map(t=>card(t,"manage")).join("")
      : '<div class="empty">Nothing added yet.</div>';
    return;
  }
  const el = document.getElementById("list");
  const list = toolsIn(view);
  // Everything installed that this section does not already have. Assigning is
  // instant — the image is shared, so there is nothing to build.
  const here = new Set(list.map(t=>t.id));
  const spare = [...tools.values()].filter(t=>!here.has(t.id) && t.status==="ready");
  const picker = `<div class="card" style="padding:10px 12px;margin-bottom:10px">
      <div class="addrow">
        <select id="pick" style="flex:1">
          <option value="">＋ add an installed tool…</option>
          ${spare.map(t=>`<option value="${t.id}">${esc(t.id)}</option>`).join("")}
        </select>
        <button onclick="assignTool()" ${spare.length?"":"disabled"}>Add</button>
      </div>
      ${spare.length ? "" : `<div class="sub" style="margin-top:6px">
        Everything installed is already here — install more under
        <a style="color:var(--accent);cursor:pointer" onclick="setView('add')">Add Tool</a>.
      </div>`}
    </div>`;
  el.innerHTML = picker + (list.length
    ? list.map(t=>card(t,"run")).join("")
    : `<div class="empty">Nothing in ${SECTION_LABEL.get(view)} yet.</div>`);
  // keep logs scrolled to the newest line
  tools.forEach((t,id)=>{ const p=document.getElementById("log-"+id); if(p) p.scrollTop=p.scrollHeight; });
}
function paintLog(id){
  const p = document.getElementById("log-"+id);
  if(!p) return;   // not on screen; the buffer paints when the view opens
  p.innerHTML = ansiToHtml(clip(logs.get(id)));
  p.scrollTop = p.scrollHeight;
}

/* ---- projects ---- */
function renderProject(){
  const el = document.getElementById("v-project");
  if(!proj){ el.innerHTML = "<h2>Project</h2><div class='empty'>No project.</div>"; return; }
  const row = (label, value, field, placeholder) => `
    <div class="setrow">
      <div class="sub"><b>${label}</b> · ${value ? esc(value)
        : `<span class="sub">not set</span>`}</div>
      <span class="setedit" onclick="editField('${field}','${esc(placeholder)}')">edit</span>
    </div>`;
  el.innerHTML = `<h2>Project</h2>
    ${row("Client", proj.client, "client", "ACME Corp")}
    ${row("Scope", proj.scope, "scope", "*.acme.com, 203.0.113.0/24")}
    <div class="setrow"><div class="sub"><b>Type</b> · ${esc(proj.kind)}</div></div>
    ${row("Notes", proj.notes, "notes", "anything worth remembering")}
    <div id="pedit"></div>
    <div class="setrow" style="margin-top:20px">
      <div class="sub">Deleting removes this engagement and its run history.
        Installed tools are shared and stay in the library.</div>
      <span class="setedit" style="color:var(--red)" onclick="deleteProject()">delete</span>
    </div>`;
}

function editField(field, placeholder){
  document.getElementById("pedit").innerHTML = `
    <div class="card" style="padding:12px;margin-top:6px">
      <div class="addrow">
        <input id="pf" placeholder="${esc(placeholder)}" value="${esc(proj[field]||"")}"
               style="flex:1" onkeydown="if(event.key==='Enter')saveField('${field}')">
        <button onclick="saveField('${field}')">Save</button>
      </div>
    </div>`;
  document.getElementById("pf").focus();
}

async function saveField(field){
  const v = document.getElementById("pf").value;
  const d = await (await fetch(`/projects/${proj.id}`,{method:"PATCH",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({[field]: v})})).json();
  if(!d.error){ await loadProjects(proj.id); render(); }
}

async function createProject(){
  const msg = document.getElementById("np-msg");
  const client = document.getElementById("np-client").value.trim();
  if(!client){ msg.textContent = "a client name is required"; return; }
  msg.textContent = "creating…";
  const d = await (await fetch("/projects",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({client, scope:document.getElementById("np-scope").value,
                         kind:document.getElementById("np-kind").value})})).json();
  if(d.error){ msg.textContent = d.error; return; }
  document.getElementById("np-client").value = "";
  document.getElementById("np-scope").value = "";
  msg.textContent = "";
  await switchProject(d.id);
}

async function deleteProject(){
  if(!confirm(`Delete ${proj.label}?\n\nThis removes the engagement and its run `
              + `history. Installed tools are shared and are not touched.`)) return;
  await fetch(`/projects/${proj.id}`,{method:"DELETE"});
  await loadProjects(null);
  setView(SECTIONS.length ? SECTIONS[0][0] : "project");
}

/* ---- settings ---- */
let cfg = {has_token:false};
let showSettings = false;

async function loadSettings(){
  try{ cfg = await (await fetch("/settings")).json(); }catch(e){}
  if(!cfg.has_token) showSettings = true;   // can't add tools without it
  renderSettings();
}
function toggleSettings(){ showSettings = !showSettings; renderSettings(); }

function renderSettings(){
  const el = document.getElementById("v-settings");
  const envLocked = cfg.source === "environment";
  const status = cfg.has_token
    ? `<span class="exit0">token set</span> <span class="sub">${esc(cfg.masked)} · from ${esc(cfg.source)}</span>`
    : `<span class="exitN">no token — adding tools is disabled</span>`;

  const panel = !showSettings ? "" : `
    <div class="card" style="padding:14px">
      ${!cfg.has_token ? `<div class="sub" style="margin-bottom:10px">
        A GitHub token is required. Unauthenticated GitHub allows only ~60 API
        requests/hour and heavy use can get your IP temporarily blocked. A
        <b>fine-grained token with no scopes</b> is enough for public repos:
        GitHub → Settings → Developer settings → Personal access tokens.
      </div>` : ""}
      ${envLocked ? `<div class="sub">Set by an environment variable — edit that to change it.</div>` : `
        <div class="addrow">
          <input id="tok" type="password" placeholder="github_pat_… or ghp_…"
                 onkeydown="if(event.key==='Enter')saveToken()">
          <button onclick="saveToken()">Save</button>
          ${cfg.has_token ? `<button class="ghost" onclick="clearToken()">Remove</button>` : ""}
        </div>`}
      <div class="sub" id="tokmsg" style="margin-top:8px">${esc(cfg.quota||"")}</div>
    </div>`;

  // Edit sits on the setting it edits, not on the page heading — there will be
  // more than one setting here, and a single toggle at the top could not say
  // which one it opens.
  el.innerHTML = `<h2>Settings</h2>
    <div class="setrow">
      <div class="sub"><b>GitHub</b> · ${status}</div>
      ${envLocked ? "" : `<span class="setedit" onclick="toggleSettings()">
        ${showSettings ? "hide" : "edit"}</span>`}
    </div>
    ${panel}`;

  // gate the Add button on having a token
  const btn = document.getElementById("addbtn");
  if(btn){ btn.disabled = !cfg.has_token;
           btn.title = cfg.has_token ? "" : "add a GitHub token first"; }
}

async function saveToken(){
  const input = document.getElementById("tok");
  const msg = document.getElementById("tokmsg");
  if(!input || !input.value.trim()) return;
  msg.textContent = "checking with GitHub…";
  try{
    const d = await (await fetch("/settings",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({github_token:input.value.trim()})})).json();
    cfg = d;
    // `has_token` only means SOME token is stored — it is NOT proof this save
    // worked. Gate on `saved`, or a rejected token silently looks successful
    // while the old one stays in place.
    const worked = d.saved === true;
    if(worked) showSettings = false;            // collapse only on real success
    renderSettings();
    const m = document.getElementById("tokmsg");
    if(m) m.innerHTML = worked
      ? `<span class="exit0">✓ ${esc(d.detail||"saved")}</span>`
      : `<span class="exitN"><b>Not saved.</b> ${esc(d.detail||"")}</span>`;
  }catch(e){ msg.textContent = "request failed"; }
}
async function clearToken(){
  if(!confirm("Remove the saved GitHub token? Adding tools will be disabled.")) return;
  cfg = await (await fetch("/settings",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({github_token:""})})).json();
  showSettings = true; renderSettings();
}

fetch("/tools").then(r=>r.json()).then(d=>{
  document.getElementById("dock").textContent = d.queue_depth ? `queue: ${d.queue_depth}` : "";
});
// Projects first: the sidebar, section lists and run scoping all depend on
// knowing which engagement is selected.
loadProjects().then(()=>{ render(); connect(); });
loadSettings();
</script>
