<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>penstation · add a tool</title>
<style>
  :root{ --bg:#ffffff; --panel:#f6f8fa; --border:#d0d7de; --fg:#1f2328; --dim:#656d76;
         --accent:#0969da; --green:#1a7f37; --amber:#9a6700; --red:#cf222e;
         /* --line and --muted were used by twenty-one rules and defined by
            none. An undefined var makes the whole declaration invalid, so every
            one of those borders and greys silently did nothing — which is why
            the kind boxes had no border however many times it was set. --line
            is a lighter rule for nesting inside an already-bordered panel. */
         --line:#e4e8ed; --muted:#656d76; }
  *{ box-sizing:border-box; }
  body{ margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
        background:var(--bg); color:var(--fg); }
  header{ padding:14px 20px; border-bottom:1px solid var(--border); background:var(--panel);
          display:flex; align-items:center; gap:12px; }
  h1{ margin:0; font-size:16px; letter-spacing:.5px; } h1 span{ color:var(--accent); }
  .dockstate{ font-size:12px; color:var(--dim); }
  .app{ display:grid; grid-template-columns:210px minmax(0,1fr); align-items:start; }
  /* No cap. A fixed one — 940px, then 1500px — always leaves a wide screen with
     a band of nothing down the right, and the map is a two-column layout that
     uses every pixel you give it. The views that are prose or a form keep their
     own limit below, because a text field 2,000px wide is not an improvement. */
  main{ min-width:0; padding:22px 20px; max-width:none; }
  #v-settings, #v-project, #v-newproject{ max-width:900px; }
  nav{ position:sticky; top:0; padding:22px 0 22px 14px; }
  nav a{ display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:7px 12px; margin:1px 0; border-radius:6px; cursor:pointer;
    color:var(--muted); font-size:13px; user-select:none; }
  nav a:hover{ background:var(--panel); color:var(--fg); }
  nav a.on{ background:var(--panel); color:var(--fg); font-weight:600;
    box-shadow:inset 2px 0 0 var(--accent); }
  nav .navgap{ height:14px; }
  nav .navsub a{ padding-left:24px; font-size:12px; }
  nav .count{ font-size:11px; color:var(--muted); font-weight:400; }
  nav .dot{ width:7px; height:7px; border-radius:50%; background:var(--red);
    flex:0 0 auto; }
  /* Collapsed: a thin strip with just the re-open arrow. */
  .app.narrow{ grid-template-columns:36px minmax(0,1fr); }
  .app.narrow nav a{ display:none; }
  .app.narrow nav .navgap{ display:none; }
  .app.narrow nav{ padding-left:6px; }
  /* Sits at the bottom of the sidebar, below Settings, pinned there even when
     the nav is short. */
  nav{ display:flex; flex-direction:column; min-height:calc(100vh - 52px); }
  .pswitch{ position:relative; margin:0 6px 10px 0; }
  .pswitch > a{ background:var(--panel); border:1px solid var(--line); }
  .pmenu{ position:absolute; z-index:20; left:0; right:0; top:100%; margin-top:3px;
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    box-shadow:0 6px 18px rgba(0,0,0,.10); padding:4px; }
  .app.narrow .pswitch{ display:none; }
  .navtoggle{ display:flex; justify-content:flex-end; margin:auto 6px 8px 0;
    padding-top:10px; }
  .navtoggle button{ all:unset; cursor:pointer; color:var(--muted); font-size:15px;
    line-height:1; padding:4px 6px; border-radius:5px; position:relative; }
  .navtoggle button:hover{ background:var(--panel); color:var(--fg); }
  .app.narrow .navtoggle{ justify-content:center; margin-right:0; }
  .app.narrow nav{ min-height:calc(100vh - 52px); }
  /* Collapsing hides the per-section spinners and dots, so any activity is
     mirrored onto the toggle itself — otherwise a build failing behind a
     collapsed sidebar is invisible. */
  .navtoggle button .dot, .navtoggle button .spin{ position:absolute;
    top:0; right:0; }

  /* The sidebar stays a left column at every width — stacking it on top pushed
     the tools down the page and lost the layout you navigate by. It just gets
     narrower instead, and long labels ellipsize rather than wrap. */
  nav a > span:first-child{ overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; }
  @media (max-width:780px){
    .app{ grid-template-columns:150px minmax(0,1fr); }
    nav{ padding:16px 0 16px 8px; }
    nav a{ padding:6px 8px; font-size:12px; }
    main{ padding:16px 14px; }
  }
  @media (max-width:520px){
    .app{ grid-template-columns:118px minmax(0,1fr); }
  }
  h2{ font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:0 0 10px; }
  section{ margin-bottom:26px; }
  input, select, button{ font:inherit; }
  /* Text fields only. A checkbox given 9px of padding and a 6px radius keeps its
     native glyph and pads *around* it, so in a flex row it shrank by however
     much the label beside it needed — and no two ticks lined up. */
  input:not([type=checkbox]), select{ background:#fff; border:1px solid var(--border);
                 color:var(--fg); border-radius:6px; padding:9px 11px; }
  button{ background:var(--accent); color:#fff; border:0; border-radius:6px;
          padding:9px 18px; cursor:pointer; font-weight:600; }
  button.ghost{ background:#fff; color:var(--fg); border:1px solid var(--border); font-weight:400; }
  button:disabled{ opacity:.45; cursor:default; }
  .addrow{ display:flex; gap:8px; flex-wrap:wrap; }
  .addrow input{ flex:1; min-width:260px; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  .err{ color:var(--red); font-size:13px; margin-top:8px; }
  .card{ border:1px solid var(--border); border-radius:8px; background:#fff; margin-bottom:10px; }
  .card .top{ display:flex; justify-content:space-between; align-items:center; gap:10px;
              padding:12px 14px; cursor:pointer; }
  .nm{ font-weight:600; }
  .sub{ color:var(--dim); font-size:12px; margin-top:2px; }
  .right{ display:flex; align-items:center; gap:10px; }
  .badge{ font-size:11px; padding:2px 9px; border-radius:20px; border:1px solid var(--border);
          white-space:nowrap; }
  .badge.queued,.badge.inspecting{ color:var(--dim); }
  .badge.building,.badge.repairing,.badge.verifying{ color:var(--amber); border-color:var(--amber); }
  .badge.ready{ color:var(--green); border-color:var(--green); }
  .badge.failed{ color:var(--red); border-color:var(--red); }
  .secthead{ display:flex; justify-content:space-between; align-items:baseline;
    margin:18px 0 8px; font-size:11px; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); }
  .secthead:first-child{ margin-top:0; }
  /* A phase inside the Baseline block. Subordinate to .secthead on purpose:
     lighter, not uppercased, and indented to the cards it heads. */
  /* Ruled off from the tools it heads, the same way a kind box is ruled off
     from its list — the line closes the row, buttons included. */
  .subhead{ display:flex; justify-content:flex-start; align-items:center;
    gap:8px; margin:14px 0 6px; padding:0 0 6px; font-size:12px;
    font-weight:600; color:var(--fg);
    border-bottom:1px solid var(--line); }
  .mapdetail .secthead{ padding-bottom:6px; border-bottom:1px solid var(--border); }
  .subhead .sub{ margin-top:0; }
  /* Buttons that belong to a heading rather than to a form. */
  .mini{ padding:3px 9px; font-size:12px; font-weight:600; }
  .mini .sub{ margin-left:3px; }
  /* Start belongs beside the phase it runs; Tools is the other end of the row. */
  .toolsbtn{ margin-left:auto; }
  /* The checklist: the whole engagement in one line per phase, always on
     screen, with the working area below it showing whichever you picked. */
  .steplist{ margin:2px 0 12px; }
  .steprow{ display:flex; align-items:baseline; gap:8px; padding:5px 6px;
    border-radius:6px; cursor:pointer; font-size:13px; }
  .steprow:hover{ background:var(--panel); }
  .steprow.on{ background:var(--panel); box-shadow:inset 2px 0 0 var(--accent); }
  .steprow .stepmark{ width:14px; text-align:center; color:var(--muted); }
  .steprow .stepname{ font-weight:600; }
  .steprow .sub{ margin-top:0; margin-left:auto; text-align:right; }
  .steprow.done .stepmark{ color:var(--green); }
  .steprow.running .stepmark{ color:var(--accent); }
  .steprow.stale .stepmark{ color:var(--amber); }
  .steprow.blocked .stepmark{ color:var(--red); }
  .steprow.blocked .stepname, .steprow.empty .stepname{ color:var(--muted); }
  .fold{ color:var(--muted); font-size:10px; margin-right:3px; }
  .top:hover .fold{ color:var(--accent); }
  /* In scope / out of scope inside a map group. Quieter than .mapkind — it
     divides one list rather than starting a new one. */
  .mapband{ display:flex; justify-content:space-between; align-items:baseline;
    gap:8px; margin:8px 0 4px; font-size:11px; color:var(--muted); }
  .mapband.oos{ color:var(--red); }
  /* Kind, inside a scope panel — quieter than the panel heading above it. */
  /* Ruled off from its list, so the heading reads as the label for what is
     under it rather than as the first entry. */
  .mapkindsub{ display:flex; justify-content:space-between; align-items:baseline;
    margin:0 0 6px; padding-bottom:5px; border-bottom:1px solid var(--line);
    font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); }
  .mapkindsub .sub{ margin-top:0; text-transform:none; letter-spacing:0; }
  /* The names under a wildcard, and the note about the ones that are not here. */
  .mapkids{ margin-left:10px; padding-left:10px; border-left:1px solid var(--line); }
  .kidstub{ margin:2px 0 4px 20px; font-size:11px; color:var(--muted); }
  .mapband .sub{ margin-top:0; }
  /* Each side is enclosed, with its kind boxes inside it. Three nested frames
     is a lot, so they step down in weight: the panel is the solid one, the kind
     boxes are lighter, and a row only shows its edge on hover or when picked. */
  /* Two panels on one set of rows. Each spans every row and hands its children
     to the parent's row lines (subgrid), so the kind boxes line up across the
     gap instead of each column flowing at its own pace. Without subgrid the
     panels simply stack their own children — unaligned, but not broken. */
  .scopegrid{ display:grid; grid-template-columns:1fr 1fr; gap:14px;
    align-items:start; margin-top:10px; }
  .mappanel{ display:grid; grid-row:1 / -1; grid-template-rows:subgrid;
    align-content:start; border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; }
  /* Left in the flow even when empty: display:none would take its row away from
     one panel only, and the boxes below it would stop lining up. */
  .movebar{ min-height:0; }
  .mappanel.picking{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .mappanel .mapband{ margin-top:0; }
  .kindbox{ border:1px solid var(--line); border-radius:6px; padding:6px 10px 8px;
    margin:8px 0; }
  .kindbox:last-child{ margin-bottom:0; }
  .mappanel .mapnode input[type=checkbox],
  .mapnode input[type=checkbox]{ flex:0 0 auto; width:13px; height:13px; margin:0; }
  .mappanel.picking button{ padding:5px 10px; font-size:12px; }
  .act{ cursor:pointer; color:var(--accent); }
  /* The map has the width to itself until you open a node; then it gives up the
     right-hand third rather than pushing the whole list down the page. */
  /* The map card and the detail card are siblings, not one inside the other —
     a bordered panel nested in a bordered panel reads as a mistake.
     The right column is always there, empty until you click something: a panel
     that appears on click shoves the whole list sideways as it arrives. */
  .mapwrap{ display:grid; grid-template-columns:1fr; gap:14px; margin-bottom:6px;
    align-items:stretch; }
  /* Two widths: one for scanning down a list, one for reading a node.
     380px is right for clicking through rows and comparing them, and wrong for
     anything with output in it. 620px is past the 560px container query below,
     which is what finally lets the run panes sit side by side rather than
     stacking — at the old width that query matched permanently, so the detail
     view had never once laid out the way it was written to. */
  .mapwrap.withdetail{ grid-template-columns:minmax(0,1fr) 380px; }
  .mapwrap.withdetail.wide{ grid-template-columns:minmax(0,1fr) 620px; }
  .widthtoggle{ cursor:pointer; color:var(--accent); font-size:13px;
    margin-left:auto; margin-right:10px; user-select:none; }
  /* Pinned to the viewport, and only as tall as what is in it.
     It used to stretch to the height of the list with its content at the top,
     so on a long list you clicked a row and got the blank lower half of a very
     tall card. That was a deliberate choice — a panel beside the row you
     clicked does not chase you as you scroll — and it holds right up until the
     list is longer than the screen, which is when you need the panel most.
     The column still stretches: sticky only has room to move inside its parent,
     so the wrapper keeps the full row height and the card slides within it.
     Sticky rather than fixed so it stays in its column, and scrolling inside
     itself so a node with many attributes cannot outgrow the screen. */
  .mapdetail{ align-self:stretch; container-type:inline-size; }
  .mapdetail > .card{ position:sticky; top:14px; height:auto;
    max-height:calc(100vh - 28px); overflow-y:auto; }
  /* The run panes split output from findings side by side. In this column that
     is two narrow gutters, so below a point they stack instead. */
  @container (max-width:560px){ .mapdetail .split{ grid-template-columns:1fr; } }
  @media (max-width:900px){
    .mapwrap.withdetail{ grid-template-columns:1fr; }
    /* Stacked under the list at this width, where pinning it would park it on
       top of the rows you are trying to read. */
    .mapdetail > .card{ position:static; max-height:none; overflow-y:visible; }
  }
  .manual{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .manual textarea{ width:100%; box-sizing:border-box; font-family:ui-monospace,
    SFMono-Regular,Menlo,monospace; font-size:12px; padding:8px;
    border:1px solid var(--line); border-radius:6px; background:var(--bg);
    color:var(--fg); resize:vertical; }
  .spin{ display:inline-block; width:9px; height:9px; border:2px solid var(--amber);
         border-right-color:transparent; border-radius:50%; animation:s .7s linear infinite; }
  @keyframes s{ to{ transform:rotate(360deg) } }
  .body{ border-top:1px solid var(--border); padding:12px 14px; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:13px; margin-bottom:10px; }
  .kv div:nth-child(odd){ color:var(--dim); }
  code{ font-family:ui-monospace,Menlo,monospace; font-size:12px; word-break:break-all; }
  pre{ background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:10px;
       overflow:auto; max-height:340px; font-size:12px; white-space:pre-wrap; margin:0; }
  /* terminal pane — matches what the backend prints, colours preserved */
  pre.term{ background:#000; color:#e5e5e5; border-color:#30363d;
            font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
            font-size:12px; line-height:1.45; padding:11px 12px;
            white-space:pre-wrap; word-break:break-word; }
  pre.term::selection, pre.term ::selection{ background:#3b8eea; color:#fff; }
  .empty{ color:var(--dim); font-style:italic; }
  .runbox{ border-top:1px solid var(--border); padding:12px 14px; background:var(--panel); }
  table.hist{ width:100%; border-collapse:collapse; font-size:13px; }
  table.hist tr{ cursor:pointer; border-bottom:1px solid var(--line); }
  table.hist tr:hover{ background:var(--panel); }
  table.hist tr.dim td{ opacity:.45; }
  .mapgroup{ margin-top:10px; }
  .mapkind{ font-size:11px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--dim); margin-bottom:4px; }
  /* One bordered box per node. The name row and whatever was learned about it
     are one target: the resolution line belongs to the thing above it, and
     having only the name clickable meant half the box did nothing. */
  .mapitem{ border:1px solid transparent; border-radius:6px; padding:6px 8px;
    margin:4px 0; cursor:pointer; }
  .mapitem:hover{ background:var(--panel); border-color:var(--accent); }
  .mapitem:hover code{ color:var(--accent); }
  .mapitem.picked{ background:var(--panel); border-color:var(--accent); }
  .mapitem.open{ background:var(--panel); border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent); }
  .mapitem.open code{ color:var(--accent); }
  .mapnode{ display:flex; align-items:center; gap:8px; font-size:13px; }
  /* `code` breaks anywhere globally, which is right for a long binary path and
     wrong for a hostname: it split www.example.com after the "de". The name
     takes the room it needs; the marks beside it stay on one line. */
  .mapnode code{ flex:1 1 auto; min-width:0; word-break:normal;
    overflow-wrap:anywhere; }
  .mapnode > span{ flex:0 0 auto; white-space:nowrap; }
  .mapnode.dim{ opacity:.45; }
  .pill{ font-size:10px; padding:1px 6px; border-radius:8px;
    border:1px solid var(--line); color:var(--muted); }
  .graphbar{ border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    margin-bottom:16px; background:var(--panel); }
  .graphbar.empty-graph{ color:var(--muted); font-size:13px; }
  .gtop{ display:flex; justify-content:space-between; align-items:baseline;
    gap:12px; flex-wrap:wrap; }
  .gcount{ font-size:12px; color:var(--muted); margin-right:14px; }
  .gcount b{ color:var(--fg); font-size:14px; }
  .grecent{ margin-top:8px; display:flex; flex-wrap:wrap; gap:4px 8px; }
  .grecent code{ font-size:11px; color:var(--muted); }
  .promote{ margin-top:10px; }
  /* Not inside .lbl: that row is uppercased and space-between, which turned a
     file list into a shouted, collided mess. */
  .runfiles{ margin-top:6px; display:flex; flex-wrap:wrap; gap:2px 14px; }
  .runfiles a{ color:var(--accent); text-decoration:none;
               font-family:ui-monospace,Menlo,monospace; font-size:11px; }
  .runfiles a:hover{ text-decoration:underline; }
  .runfiles .sub{ margin-left:5px; font-size:10px; }
  .inwrap textarea{ width:100%; box-sizing:border-box; font-family:ui-monospace,
    SFMono-Regular,Menlo,monospace; font-size:12px; padding:8px;
    border:1px solid var(--line); border-radius:6px; background:var(--bg);
    color:var(--fg); resize:vertical; }
  .promoterows{ max-height:220px; overflow:auto; border:1px solid var(--line);
    border-radius:6px; padding:6px; }
  .promoterows label{ display:flex; align-items:center; gap:8px; padding:3px 4px;
    border-radius:4px; cursor:pointer; }
  /* Never shrink the tick, and let a long name wrap instead of pushing on it:
     that is what keeps the column straight down the list. */
  .promoterows input[type=checkbox]{ flex:0 0 auto; width:14px; height:14px; margin:0; }
  .promoterows label code{ min-width:0; overflow-wrap:anywhere; }
  .promoterows label .sub{ flex:0 0 auto; margin-top:0; }
  .promoterows label:hover{ background:var(--panel); }
  .promoterows label.oos code{ opacity:.6; }
  table.hist td{ padding:6px 8px; vertical-align:top; }
  table.hist td:first-child{ white-space:nowrap; font-variant-numeric:tabular-nums; }
  .setrow{ display:flex; justify-content:space-between; align-items:baseline;
    gap:12px; margin:-4px 0 6px; }
  .setedit{ cursor:pointer; color:var(--accent); font-size:11px; font-weight:600;
    letter-spacing:.5px; text-transform:uppercase; flex:0 0 auto; }
  /* gap + nowrap on the label: without them a long right-hand side squeezed the
     label until it wrapped mid-word, which is how "output" and "exit 0" became
     "OUTPUTEXIT. 0". */
  .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim);
                margin-bottom:4px; display:flex; justify-content:space-between;
                align-items:baseline; gap:12px; }
  .lbl > span:first-child{ white-space:nowrap; }
  .runbox .fields{ display:flex; gap:8px; align-items:center; }
  .runbox input{ flex:1; font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .exit0{ color:var(--green); } .exitN{ color:var(--red); }
  /* Settings on the left, results on the right — see runPane. */
  .split{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px; }
  .runbox > .split{ margin-top:0; }
  .runside{ min-width:0; }
  @media (max-width:900px){ .split{ grid-template-columns:1fr; } }
  .split pre{ max-height:300px; }
  .running{ color:var(--amber); font-size:12px; }
  .tabs{ display:flex; gap:14px; border-bottom:1px solid var(--border); margin-bottom:10px; }
  .tabs a{ font-size:12px; color:var(--dim); cursor:pointer; padding-bottom:6px;
           border-bottom:2px solid transparent; }
  .tabs a.on{ color:var(--fg); border-bottom-color:var(--accent); }
  button.stop{ background:var(--red); }
</style>
</head>
<body>
<header>
  <h1>pen<span>station</span></h1>
  <span class="dockstate" id="dock"></span>
</header>
<div class="app" id="app">
<nav id="nav"></nav>
<main>
  <section id="v-settings" hidden></section>
  <section id="v-add" hidden>
    <h2>Add Tool</h2>
    <div class="addrow">
      <input id="url" placeholder="https://github.com/owner/repo" onkeydown="if(event.key==='Enter')add()">
      <select id="section" onchange="renderAddSection()"></select>
      <select id="subsection"></select>
      <button id="addbtn" onclick="add()">Add</button>
    </div>
    <div class="err" id="err"></div>
    <h2 style="margin-top:26px">All tools</h2>
    <div id="alllist"><div class="empty">Nothing added yet.</div></div>
  </section>
  <section id="v-project" hidden></section>
  <section id="v-map" hidden></section>
  <section id="v-newproject" hidden>
    <h2>New Project</h2>
    <div class="card" style="padding:14px">
      <div class="lbl"><span>client</span></div>
      <input id="np-client" placeholder="ACME Corp" style="width:100%;box-sizing:border-box">
      <div class="lbl" style="margin-top:10px"><span>scope</span></div>
      <input id="np-scope" placeholder="*.acme.com, 203.0.113.0/24"
             style="width:100%;box-sizing:border-box">
      <div class="lbl" style="margin-top:10px"><span>engagement type</span></div>
      <select id="np-kind"><option value="external">external</option></select>
      <div class="fields" style="margin-top:12px">
        <button onclick="createProject()">Create</button>
        <span class="sub" id="np-msg"></span>
      </div>
    </div>
  </section>
  <section id="v-tools" hidden>
    <h2 id="secttitle">Tools</h2>
    <div id="list"><div class="empty">Nothing added yet.</div></div>
  </section>
</main>
</div>

<script>
// Sections come from the engagement type, so they arrive with the project
// rather than being hardcoded — an internal test runs through different phases.
let PROJECTS = [];            // every engagement
let proj = null;              // the one selected
let SECTIONS = [];            // [key,label] for proj.kind
let SECTION_LABEL = new Map();
let switcherOpen = false;
let mapData = {nodes:{}, edges:{}};
let mapCount = 0;

function applyProject(p){
  proj = p || null;
  SECTIONS = proj ? proj.section_list.map(s=>[s.key, s.label]) : [];
  SECTION_LABEL = new Map(SECTIONS);
  renderAddSection();
}

async function loadProjects(keep){
  const d = await (await fetch("/projects")).json();
  PROJECTS = d.projects || [];
  const want = keep || (proj && proj.id) || (location.hash||"").slice(1).split("/")[0];
  applyProject(PROJECTS.find(p=>p.id===want) || PROJECTS[0]);
}

// Tools this project has filed into a section, in the order they were added.
function toolsIn(section){
  if(!proj) return [];
  return (proj.sections[section]||[]).map(id=>tools.get(id)).filter(Boolean);
}

// Which panel is showing: "add", "settings", or a section key. Kept in the URL
// hash so a reload lands you back where you were — with builds this slow, and
// the amount of refreshing that goes on, losing your place is a real cost.
let view = ((location.hash || "").slice(1).split("/")[1]) || "";
let navOpen = localStorage.getItem("navOpen") !== "0";

function toggleNav(){
  navOpen = !navOpen;
  localStorage.setItem("navOpen", navOpen ? "1" : "0");
  renderNav();
}

function setView(v){
  const wasMap = view === "map" || SECTION_LABEL.has(view);
  view = v;
  const isMap = v === "map" || SECTION_LABEL.has(v);
  if(isMap && !wasMap) setTimeout(loadMap, 0);   // fetch once on entry
  if(!navOpen) toggleNav();
  switcherOpen = false;
  history.replaceState(null, "", "#" + (proj?proj.id:"") + "/" + v);
  render();
}

// Everything the browser holds about runs in the engagement it is showing.
//
// One place, because the list kept growing and the places that reset it did
// not. `runHistory` was the one that mattered and the one that got missed: the
// phase checklist works out whether a phase has been done by comparing when its
// tools last finished against what the map holds — so a stale timestamp meant a
// freshly cleared engagement still claiming it had been run, and every node the
// re-seeded scope put back reading as "new since it ran".
function forgetRuns(){
  runs.clear(); runout.clear(); promote.clear();
  runHistory.clear(); reconSeen.clear(); nodeRunOf.clear();
  inbox.clear(); inEdit.clear();
  recon = null;                       // the phase panel belongs to that run
}

async function switchProject(id){
  await loadProjects(id);
  switcherOpen = false;
  mapData = {nodes:{}, edges:{}};      // never show one client's map under another
  // Runs are filed per engagement too, so the panes have to be re-read rather
  // than carried across — otherwise one client's scan output sits under another,
  // and one client's run times decide whether another's phases look done.
  forgetRuns();
  restored = false;
  setView("map");
  loadMap();
  restoreRuns();
}

const tools = new Map();      // id -> record
const logs  = new Map();      // id -> accumulated log text
const open  = new Set();      // expanded cards
const runs   = new Map();     // id -> {busy} | {code, files} | {error}
const runout = new Map();     // id -> accumulated live run output
const tabs   = new Map();     // id -> "run" | "log"
const ACTIVE = ["queued","inspecting","building","repairing","verifying"];
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// Raw byte counts made a file list unreadable: "(8400B)" next to "(24249B)" says
// nothing at a glance about which one holds the results.
function bytes(n){
  n = +n || 0;
  if(n < 1024) return n + " B";
  if(n < 1024*1024) return (n/1024).toFixed(n < 10240 ? 1 : 0) + " KB";
  return (n/1048576).toFixed(1) + " MB";
}

// Does this retained file belong in the tool's file list? A tool declares its
// output as basename globs (bbot: output.*, subdomains.txt); one that declares
// nothing lists everything it wrote, which is right for nmap's three formats.
// Nothing is deleted either way — this is the listing, not the run directory.
// The files a run retained, as links. Shared by the tool card and the
// reconnaissance panel, so both list the same files by the same rule rather
// than drifting apart — the retained output is the evidence either way.
function runFiles(t, r){
  const files = (r && !r.busy && r.run && r.files)
    ? r.files.filter(f=>isOutputFile(t, f.name)) : [];
  if(!files.length) return "";
  return `<div class="runfiles">${files.map(f=>
    `<a href="/projects/${proj.id}/runs/${encodeURIComponent(r.run)}/files/${
       f.name.split("/").map(encodeURIComponent).join("/")}" target="_blank"
       rel="noopener">${esc(f.name)}</a><span class="sub">${bytes(f.bytes)}</span>`
  ).join("")}</div>`;
}

function isOutputFile(t, name){
  const pats = (t && t.output_files) || [];
  if(!pats.length) return true;
  const base = name.replace(/\\/g, "/").split("/").pop();
  return pats.some(p => new RegExp("^" + p.split("*")
      .map(s=>s.replace(/[.+?^${}()|[\]\\]/g, "\\$&")).join(".*") + "$", "i")
    .test(base));
}

/* ---- ANSI → HTML, so output looks like the real terminal ----
   Tools colour their output with ANSI escapes (bbot emits ~110 per scan).
   Rather than strip them, translate to spans and render on a black pane.
   Every text chunk is HTML-escaped, so tool output can never inject markup. */
const BASIC16 = ["#000000","#cd3131","#0dbc79","#e5e510","#2472c8","#bc3fbc",
                 "#11a8cd","#e5e5e5","#666666","#f14c4c","#23d18b","#f5f543",
                 "#3b8eea","#d670d6","#29b8db","#ffffff"];
const CUBE = [0,95,135,175,215,255];

function xterm256(n){
  n = Number(n)||0;
  if(n < 16) return BASIC16[n];
  if(n < 232){ const c=n-16;
    return `rgb(${CUBE[Math.floor(c/36)]},${CUBE[Math.floor((c%36)/6)]},${CUBE[c%6]})`; }
  const g = 8 + (n-232)*10; return `rgb(${g},${g},${g})`;
}

// SGR colour codes are translated; other escapes (cursor moves, OSC titles) dropped.
const ANSI_RE = /\x1b\[([0-9;]*)m|\x1b\[[0-9;?]*[a-zA-Z]|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g;

function ansiToHtml(text){
  let fg=null, bg=null, bold=false, dim=false, ul=false, it=false;
  let out="", last=0, m;
  const style = () => {
    const s=[];
    if(fg) s.push("color:"+fg);
    if(bg) s.push("background:"+bg);
    if(bold) s.push("font-weight:700");
    if(dim) s.push("opacity:.6");
    if(ul) s.push("text-decoration:underline");
    if(it) s.push("font-style:italic");
    return s.join(";");
  };
  const emit = chunk => {
    if(!chunk) return;
    const st = style();
    out += st ? `<span style="${st}">${esc(chunk)}</span>` : esc(chunk);
  };
  ANSI_RE.lastIndex = 0;
  while((m = ANSI_RE.exec(text)) !== null){
    emit(text.slice(last, m.index));
    last = ANSI_RE.lastIndex;
    if(m[1] === undefined) continue;                 // not an SGR — drop it
    const p = m[1] === "" ? [0] : m[1].split(";").map(Number);
    for(let i=0;i<p.length;i++){
      const c = p[i];
      if(c===0){ fg=bg=null; bold=dim=ul=it=false; }
      else if(c===1) bold=true;
      else if(c===2) dim=true;
      else if(c===3) it=true;
      else if(c===4) ul=true;
      else if(c===22){ bold=false; dim=false; }
      else if(c===23) it=false;
      else if(c===24) ul=false;
      else if(c===39) fg=null;
      else if(c===49) bg=null;
      else if(c>=30 && c<=37)   fg=BASIC16[c-30];
      else if(c>=90 && c<=97)   fg=BASIC16[c-90+8];
      else if(c>=40 && c<=47)   bg=BASIC16[c-40];
      else if(c>=100 && c<=107) bg=BASIC16[c-100+8];
      else if(c===38 || c===48){
        const isFg = c===38, mode = p[i+1];
        let col = null;
        if(mode===5){ col = xterm256(p[i+2]); i+=2; }
        else if(mode===2){ col = `rgb(${p[i+2]||0},${p[i+3]||0},${p[i+4]||0})`; i+=4; }
        if(col){ if(isFg) fg=col; else bg=col; }
      }
    }
  }
  emit(text.slice(last));
  return out;
}

// Keep panes bounded — a long scan can emit megabytes.
const MAX_PANE = 250000;
const clip = s => (s && s.length > MAX_PANE) ? s.slice(-MAX_PANE) : (s||"");

/* ---- events ---- */
function connect(){
  const es = new EventSource("/events");
  es.addEventListener("snapshot", e => {
    JSON.parse(e.data).forEach(t => tools.set(t.id, t));
    render();
    // fetch logs for anything already in flight or finished
    tools.forEach((t,id) => { if(!logs.has(id)) fetchLog(id); });
    restoreRuns();
  });
  es.addEventListener("status", e => {
    const t = JSON.parse(e.data); tools.set(t.id, t);
    if(ACTIVE.includes(t.status)) open.add(t.id);   // auto-expand while working
    render();
  });
  es.addEventListener("log", e => {
    const d = JSON.parse(e.data);
    logs.set(d.id, (logs.get(d.id)||"") + d.line);
    paintLog(d.id);
  });
  es.addEventListener("run_start", e => {
    const d = JSON.parse(e.data);
    // The previous run's offer belongs to the previous run's output. A run you
    // started yourself opens the Tools list and its own card, since a run you
    // cannot see is worse than no run at all — but not one the sequence owns,
    // which has its own panel.
    runout.set(d.id, ""); runs.set(d.id, {busy:true}); promote.delete(d.id);
    if(!(recon && recon.pending.has(d.id))){
      open.add(d.id);
      const t = tools.get(d.id);
      if(t && t.section) openTools.add(t.section);   // so the output is visible
    }
    render();
  });
  es.addEventListener("run_log", e => {
    const d = JSON.parse(e.data);
    runout.set(d.id, (runout.get(d.id)||"") + d.line);
    if(recon && recon.pending.has(d.id)){ reconScan(d.id, d.line); paintRecon(d.id); }
    paintRun(d.id);
  });
  es.addEventListener("run_done", e => {
    const d = JSON.parse(e.data);
    runs.set(d.id, {code:d.code, files:d.files, error:d.error, run:d.run});
    runHistory.set(d.id, Date.now()/1000);
    // A run the sequence started is reviewed by the sequence, in one merged
    // box. Leaving the per-tool offer to fire as well would ask you the same
    // question twice, in two places, about the same names.
    if(recon && recon.pending.has(d.id)){
      if(d.run && !d.error) recon.runs[d.id] = d.run;
      if(d.error) recon.msg = `${d.id}: ${d.error}`;
      recon.pending.delete(d.id);
      render();
      if(!recon.pending.size) reconAdvance();
      return;
    }
    render();
    if(d.run && !d.error) offerPromote(d.id, d.run);
  });
  es.addEventListener("removed", e => {
    const d = JSON.parse(e.data);
    tools.delete(d.id); logs.delete(d.id); runout.delete(d.id); runs.delete(d.id);
    promote.delete(d.id); render();
  });
}
async function fetchLog(id){
  try{ const d = await (await fetch(`/tools/${id}/log`)).json();
       if(d.log){ logs.set(id, d.log); paintLog(id); } }catch(e){}
}

// Run output lived only in the browser, while the run itself was filed on disk.
// A refresh therefore emptied the output pane, the file list and the promote box
// of a scan that had already happened — the only way back to the decision was to
// run the whole thing again. Read the newest recorded run of each tool back in
// instead. Guarded so it happens once per selected engagement.
let restored = false;
async function restoreRuns(){
  if(restored || !proj) return;
  restored = true;
  const pid = proj.id;
  await Promise.all([...tools.keys()].map(async id => {
    if(runs.has(id)) return;            // a live run outranks a recorded one
    try{
      const d = await (await fetch(`/projects/${pid}/runs/${id}`)).json();
      const last = (d.runs || [])[0];   // for_tool() sorts newest first
      if(!last || proj.id !== pid) return;
      // When this tool last finished, which is what the checklist reads to work
      // out whether a phase has been done in this engagement.
      if(last.finished_at) runHistory.set(id, last.finished_at);
      runs.set(id, {code:last.exit_code, files:last.files,
                    error:last.error, run:last.id});
      const full = await (await fetch(`/projects/${pid}/runs/${id}/${last.id}`)).json();
      if(proj.id === pid) runout.set(id, full.output || "");
    }catch(e){}
  }));
  if(proj.id !== pid) return;           // switched engagements while loading
  render();
  // Re-offer what each restored run found. Rows already on the map come back
  // marked known, so this shows what was scanned without re-promoting anything.
  runs.forEach((r, id) => {
    if(r && r.run && !r.busy && !r.error && !promote.has(id)) offerPromote(id, r.run);
  });
}

/* ---- actions ---- */
// Where a tool goes is decided here, at install, and nowhere else. The phase
// pages used to carry their own picker as well; two places to answer one
// question meant the answer could differ depending on which you used.
function renderAddSection(){
  const sel = document.getElementById("section");
  const sub = document.getElementById("subsection");
  if(!sel || !sub) return;
  const heads = SECTIONS.filter(([k])=>navHead(k) === k);
  if(sel.options.length !== heads.length)
    sel.innerHTML = heads.map(([k])=>
      `<option value="${k}">${esc(navLabel(k))}</option>`).join("");
  // A section that covers several only needs the second question asked.
  const subs = phasesUnder(sel.value);
  sub.hidden = subs.length < 2;
  sub.innerHTML = subs.length < 2 ? "" : subs.map(k=>
    `<option value="${k}">${esc(SECTION_LABEL.get(k) || k)}</option>`).join("");
}

async function add(){
  const url = document.getElementById("url").value.trim();
  const sub = document.getElementById("subsection");
  const section = (!sub.hidden && sub.value)
    ? sub.value : document.getElementById("section").value;
  const btn = document.getElementById("addbtn"), err = document.getElementById("err");
  err.textContent = ""; if(!url) return;
  btn.disabled = true;
  try{
    const d = await (await fetch("/tools",{method:"POST",headers:{"Content-Type":"application/json"},
                                           body:JSON.stringify({url, section, project: proj?proj.id:""})})).json();
    if(d.error){ err.textContent = d.error;
                 if(d.need_token){ showSettings = true; loadSettings(); setView("settings"); } }
    else { tools.set(d.id,d); open.add(d.id); logs.set(d.id,"");
           document.getElementById("url").value="";
           setView(navHead(d.section));  // follow it into the entry that lists it
    }
  }catch(e){ err.textContent = "request failed"; }
  btn.disabled = false;
}
const retry = id => fetch(`/tools/${id}/retry`,{method:"POST"});

// Build the engagement type's baseline. Images are shared, so a second project
// reuses whatever is already built rather than rebuilding it.
async function installBaseline(){
  const msg = document.getElementById("basemsg");
  if(msg) msg.textContent = "installing…";
  const d = await (await fetch(`/projects/${proj.id}/baseline`,
                               {method:"POST"})).json();
  if(d.error){ if(msg) msg.textContent = d.error; return; }
  if(msg) msg.textContent =
    `building ${d.queued.length}, reusing ${d.reused.length}`;
  await loadProjects(proj.id);
  loadMap();
}

// Unassign only. The image stays installed and available to every other
// engagement — uninstalling lives under Add Tool and asks first.
async function unassign(id, sect){
  await fetch(`/projects/${proj.id}/sections/${sect}/tools/${id}`,{method:"DELETE"});
  await loadProjects(proj.id); loadMap();
}

// Removes every record, image, per-tool volume and cached repo signal.
// Lives under Settings and needs the word typed. A confirm() dialog was not
// enough protection: one stray accept destroyed three installed tools, their
// images and volumes. Irreversible actions should be hard to trigger by
// accident, not merely acknowledged.
async function clearAll(){
  const box = document.getElementById("clearword");
  const msg = document.getElementById("clearmsg");
  if(!box || (box.value||"").trim().toLowerCase() !== "delete"){
    if(msg) msg.textContent = 'type "delete" to confirm';
    return;
  }
  msg.textContent = "clearing…";
  try{
    const d = await (await fetch("/tools",{method:"DELETE"})).json();
    tools.clear(); logs.clear(); runout.clear(); runs.clear(); open.clear();
    promote.clear();
    box.value = "";
    msg.textContent = `removed ${d.removed.length} tool(s), ${d.cache} cached entries`;
    await loadProjects(proj && proj.id); render();
  }catch(e){ msg.textContent = "clear failed"; }
}
function renderClear(){}   // nothing to keep in sync now

// Compose the whole failure into a prompt you can paste into a capable model,
// then paste its install command straight back into the box above. Keeps a
// strong model in the loop without an API key or any inference on this machine.
async function copyPrompt(id){
  const msg = document.getElementById(`manmsg-${id}`);
  try{
    const d = await (await fetch(`/tools/${id}/prompt`)).json();
    if(d.error){ msg.textContent = d.error; return; }
    await navigator.clipboard.writeText(d.prompt);
    msg.textContent = "prompt copied — paste it to an AI, then paste the command above";
  }catch(e){ msg.textContent = "couldn't copy (clipboard needs https or localhost)"; }
}

async function sendManual(id){
  const box = document.getElementById(`man-${id}`);
  const msg = document.getElementById(`manmsg-${id}`);
  const text = (box.value||"").trim();
  if(!text){ msg.textContent = "paste something first"; return; }
  msg.textContent = "validating…";
  try{
    const d = await (await fetch(`/tools/${id}/install`,{method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({install_cmd:text})})).json();
    msg.textContent = d.error ? d.error : "installing…";
  }catch(e){ msg.textContent = "request failed"; }
}
const drop  = id => confirm(`Remove ${id}?`) && fetch(`/tools/${id}`,{method:"DELETE"});
function toggle(id){ open.has(id) ? open.delete(id) : open.add(id); render(); }
function setPane(id, pane){ tabs.set(id, pane); render(); }

// Every recorded run of this tool in this engagement. Output is stored, so a
// scan from last week is still readable — that is the point of filing runs
// under a client rather than leaving them in the browser.
async function showHistory(id){
  tabs.set(id, "hist"); render();
  const box = document.getElementById(`hist-${id}`);
  if(!box) return;
  try{
    const d = await (await fetch(`/projects/${proj.id}/runs/${id}`)).json();
    const rs = d.runs || [];
    box.innerHTML = rs.length ? `<table class="hist">${rs.map(r=>`
      <tr onclick="showRun('${id}','${r.id}')">
        <td class="${r.exit_code===0?'exit0':'exitN'}">${r.exit_code===0?"✓":"✕"} ${r.exit_code}</td>
        <td><code>${esc(r.command)}</code></td>
        <td class="sub">${ago(r.started_at)}</td>
        <td class="sub">${r.duration}s</td>
      </tr>`).join("")}</table>`
      : `<div class="sub">No runs recorded for ${esc(id)} in this engagement yet.</div>`;
  }catch(e){ box.innerHTML = `<div class="err">couldn't load history</div>`; }
}

async function showRun(id, runId){
  const box = document.getElementById(`hist-${id}`);
  const d = await (await fetch(`/projects/${proj.id}/runs/${id}/${runId}`)).json();
  if(d.error){ box.innerHTML = `<div class="err">${esc(d.error)}</div>`; return; }
  box.innerHTML = `
    <div class="lbl"><span>${esc(d.command)}</span>
      <span class="sub">${ago(d.started_at)} · ${d.duration}s ·
        <span class="${d.exit_code===0?'exit0':'exitN'}">exit ${d.exit_code}</span></span></div>
    <pre class="term">${ansiToHtml(d.output||"")}</pre>
    <div class="sub" style="margin-top:8px;cursor:pointer;color:var(--accent)"
         onclick="showHistory('${id}')">← back to history</div>`;
}

function ago(ts){
  const s = Math.max(0, Date.now()/1000 - ts);
  if(s < 60)    return `${Math.round(s)}s ago`;
  if(s < 3600)  return `${Math.round(s/60)}m ago`;
  if(s < 86400) return `${Math.round(s/3600)}h ago`;
  return new Date(ts*1000).toLocaleDateString();
}

// The command this tool would run right now, substitutions filled in. Lives
// here rather than inside the card because the reconnaissance sequence starts
// tools that you never clicked: reading the command out of the DOM only works
// for a card you are looking at.
//
// Baseline commands are written against the scope — {{scope}} is everything you
// were given, domains and CIDRs, space separated; {{targets}} is domains only,
// comma separated for tools that take a list; {{target}} is the primary one. So
// editing the scope changes what every baseline tool runs against.
//
// `generatedOnly` asks for the template's own answer, ignoring your override —
// the card needs that to show what it would otherwise have run.
function plannedCommand(t, generatedOnly){
  if(!generatedOnly && (t.command_override||"").trim()) return t.command_override;
  const tmpl = t.run_template || "";
  const target = (proj && proj.target) || "";
  if(!tmpl || !target) return "";
  const targets = ((proj && proj.targets) || []).join(",");
  const scopeAll = ((proj && proj.scope_all) || []).join(" ");
  // The engagement's paces, shown so the box says what will actually run. The
  // server substitutes these again at the moment of running — a limit you can
  // edit out of the command box is not a limit — so this is display, not policy.
  // Scanning and web probing read separate dials; the placeholder says which.
  const s = (proj && proj.pace_scan_values) || {};
  const w = (proj && proj.pace_web_values) || {};
  return tmpl.replaceAll("{{scope}}", scopeAll || target)
             .replaceAll("{{targets}}", targets || target)
             .replaceAll("{{target}}", target)
             .replaceAll("{{scan_timing}}", s.timing ?? "")
             .replaceAll("{{scan_probes}}", s.probes ?? "")
             .replaceAll("{{web_threads}}", w.threads ?? "")
             .replaceAll("{{web_rate}}", w.rate ?? "")
             .replace(/\s+/g, " ").trim();
}

// Which phase a tool is filed under, so a run is attributed correctly no matter
// where on the page you started it from.
function sectionOf(id){
  if(!proj) return "";
  for(const [k,v] of Object.entries(proj.sections||{})) if((v||[]).includes(id)) return k;
  const t = tools.get(id);
  return t && t.baseline ? "baseline" : "";
}

async function doRun(id, force){
  const command = document.getElementById("cmd-"+id).value.trim();
  if(!command) return;
  runs.set(id, {busy:true}); runout.set(id, ""); render();
  try{
    const d = await (await fetch(`/tools/${id}/run`,{method:"POST",
      headers:{"Content-Type":"application/json"},
      // The engagement and section are what make the recorded run attributable.
      body:JSON.stringify({command, project: proj?proj.id:"", section: sectionOf(id),
                           force: !!force,
                           input: (document.getElementById("in-"+id)||{}).value
                                  || inbox.get(id) || ""})})).json();
    // Refused for scope: keep the reason and offer the deliberate override,
    // rather than a dead error you have to work around by editing the command.
    if(d.out_of_scope){ runs.set(id, {error:d.error, refused:d.out_of_scope}); render(); }
    else if(d.error){ runs.set(id, {error:d.error}); render(); }
    // success: output arrives via run_log/run_done on the event stream
  }catch(e){ runs.set(id, {error:"request failed"}); render(); }
}
const doStop = id => fetch(`/tools/${id}/stop`,{method:"POST"});
async function refreshHelp(id){
  const d = await (await fetch(`/tools/${id}/help`,{method:"POST"})).json();
  const t = tools.get(id);
  if(t && d.help_text !== undefined){ t.help_text = d.help_text; render(); }
}
// Follow the tail, unless you have scrolled up to read something — in which
// case the next line of a noisy scan would drag you back down mid-sentence.
function stickToBottom(p, html){
  const following = p.scrollHeight - p.scrollTop - p.clientHeight < 40;
  p.innerHTML = html;
  if(following) p.scrollTop = p.scrollHeight;
}

function paintRun(id){
  const p = document.getElementById("run-"+id);
  if(!p) return;   // not on screen; the buffer paints when the view opens
  stickToBottom(p, ansiToHtml(clip(runout.get(id))));
}

/* ---- render ---- */
// One sidebar entry can cover more than one phase.
//
// Passive and active recon are two halves of one job — you enumerate names, then
// you scan what they resolve to, and you read the result as one picture. They
// stay separate phases underneath, because they take different inputs and one
// can be current while the other is stale; this only merges how they are
// listed and read.
const NAV_MERGE = new Map([
  ["reconnaissance", {label: "Reconnaissance",
                      phases: ["reconnaissance", "active-scanning",
                               "cloud-resources", "github-resources"]}],
]);
// The entry a phase is listed under, and the phases an entry covers.
function navHead(key){
  for(const [head, g] of NAV_MERGE) if(g.phases.includes(key)) return head;
  return key;
}
const phasesUnder = v => (NAV_MERGE.get(v) || {}).phases || [v];
const navLabel = v => (NAV_MERGE.get(v) || {}).label || SECTION_LABEL.get(v) || v;

function renderNav(){
  const all = [...tools.values()];
  const item = (key, label, extra) => {
    const mine = phasesUnder(key).flatMap(k=>toolsIn(k));
    // A section counts what you can actually run there. Building and failing
    // are install concerns, so their spinner and dot live on "Add Tool" —
    // that is the view you would go to in order to do anything about them.
    const ready = mine.filter(t=>t.status==="ready").length;
    const mark = ready ? `<span class="count">${ready}</span>` : "";
    return `<a class="${view===key?'on':''}" onclick="setView('${key}')">
      <span>${label}</span>${extra||mark}</a>`;
  };
  const anyBusy = all.some(t=>ACTIVE.includes(t.status));
  const anyBad  = all.some(t=>t.status==="failed");
  const installMark = anyBusy ? '<span class="spin"></span>'
                    : anyBad  ? '<span class="dot"></span>' : "";
  const badge = navOpen ? "" : installMark;
  document.getElementById("app").classList.toggle("narrow", !navOpen);

  // The switcher names the engagement everything below is scoped to; without it
  // the sections are ambiguous the moment there is more than one client.
  const menu = !switcherOpen ? "" : `<div class="pmenu">
    ${PROJECTS.map(p=>`<a class="${proj&&p.id===proj.id?'on':''}"
        onclick="switchProject('${p.id}')"><span>${esc(p.label)}</span>
        <span class="sub">${esc(p.kind)}</span></a>`).join("")}
    <a onclick="setView('newproject')"><span>＋ New project</span></a>
  </div>`;
  const switcher = `<div class="pswitch">
      <a onclick="switcherOpen=!switcherOpen;renderNav()">
        <span><b>${esc(proj?proj.label:"No project")}</b><br>
          <span class="sub">${esc(proj?proj.kind:"")}</span></span>
        <span class="sub">▾</span></a>${menu}
    </div>`;

  document.getElementById("nav").innerHTML = switcher
    + `<a class="${view==='project'?'on':''}" onclick="setView('project')"><span>Project</span></a>`
    + `<a class="${view==='map'?'on':''}" onclick="setView('map')"><span>Map</span>
         ${mapCount ? `<span class="count">${mapCount}</span>` : ""}</a>`
    + `<div class="navsub">` + SECTIONS.filter(([k])=>navHead(k) === k)
        .map(([k])=>item(k, navLabel(k))).join("") + `</div>`
    + `<div class="navgap"></div>`
    + `<a class="${view==='add'?'on':''}" onclick="setView('add')">
         <span>+ Add Tool</span>${installMark}</a>`
    + `<a class="${view==='settings'?'on':''}" onclick="setView('settings')"><span>Settings</span></a>`
    + `<div class="navtoggle"><button onclick="toggleNav()"
         title="${navOpen?'Collapse':'Expand'} sidebar">${navOpen?'‹':'›'}${badge}</button></div>`;
}

// A card's HTML is rebuilt wholesale on every render, so anything painted into
// one afterwards — the promote box — has to be painted again or it vanishes on
// the next unrelated status event.
function render(){
  // Assigning innerHTML empties the container before refilling it, so for one
  // frame the document has no height and the browser clamps the scroll position
  // to zero. Restoring it in the same tick means it never visibly moves —
  // without this, a scan finishing while you are reading three screens down
  // throws you back to the top, every time an event arrives.
  const y = window.scrollY;
  renderView();
  promote.forEach((st, id)=>paintPromote(id));
  if(window.scrollY !== y) window.scrollTo(0, y);
  // The output panes are rebuilt too, and a rebuilt pane starts at the top of
  // the log. These follow the tail, so put them back on it.
  document.querySelectorAll("pre.term[id^='rrun-'], pre.term[id^='run-']")
    .forEach(p=>{ p.scrollTop = p.scrollHeight; });
}

function renderView(){
  // Start at the first phase of an engagement, whether or not it has tools yet.
  if(!view){
    view = SECTIONS[0][0];
    history.replaceState(null, "", "#" + view);
  }
  renderNav();
  // Map and the phases are separate views. Map holds the baseline workflow that
  // builds it; a phase holds the tools you added yourself. No tool appears twice.
  const isSection = SECTION_LABEL.has(view);
  document.getElementById("v-add").hidden        = view !== "add";
  document.getElementById("v-settings").hidden   = view !== "settings";
  document.getElementById("v-project").hidden    = view !== "project";
  document.getElementById("v-map").hidden        = view !== "map";
  document.getElementById("v-newproject").hidden = view !== "newproject";
  document.getElementById("v-tools").hidden      = !isSection;
  if(isSection) document.getElementById("secttitle").textContent =
    navLabel(view);
  if(view === "settings") renderSettings();
  if(view === "project") renderProject();
  renderClear();
  if(!isSection && view !== "map" && view !== "add") return;

  // `card` is a const, so every use has to come after this point — calling it
  // above threw a ReferenceError that silently aborted the rest of render(),
  // leaving "All tools" stuck on its placeholder.
  const card = (t, mode, sect, fold)=>{
    const working = ACTIVE.includes(t.status);
    const wait = (t.status==="queued" && t.queue_position>0) ? ` (position ${t.queue_position})` : "";
    const badge = `<span class="badge ${t.status}">${working?'<span class="spin"></span> ':''}${t.status}${wait}</span>`;
    const actions = t.status==="failed" ? `<button class="ghost" onclick="event.stopPropagation();retry('${t.id}')">Retry</button>` : "";
    const detail = t.detail ? `<div class="sub">${esc(t.detail)}</div>` : "";
    const tab = tabs.get(t.id) || (t.status==="ready" ? "run" : "log");
    const r = runs.get(t.id);
    const busy = !!(r && r.busy);
    // Only suggest a command when a real target flag was documented. A bare
    // "<tool> example.com" guess is worse than no guess — it teaches the wrong
    // invocation (bbot actually needs -t).
    const tmpl = t.run_template || "";
    const ready = plannedCommand(t, true);
    // The generated command is authoritative; an override is yours and shadows
    // it until you clear it. Running no longer captures the command, so fixing
    // a baseline command reaches every project instead of being permanently
    // masked by whatever was typed once.
    const overridden = !!(t.command_override||"").trim();
    const prefill = plannedCommand(t);
    const editing = cmdEdit.has(t.id);
    const hint = ready || (/^\S+\s+-/.test(tmpl)
      ? tmpl.replace("{{target}}", "example.com")
      : `type a command — check --help →`);
    // The header keeps the one-word verdict. The file list used to live here too,
    // inside an uppercased space-between row — a dozen paths came out as
    // "OUTPUTEXIT. 0 FILES: GOATED_ISAAC/DEBUG.LOG (8400B), …" jammed against the
    // label and shouting. It gets its own row below instead.
    let footer = "";
    if (busy)              footer = `<span class="running">running…</span>`;
    else if (r && r.refused) footer = `<span class="err">${esc(r.error)}</span>
        <button class="mini ghost" style="margin-left:6px"
          title="Records the run as forced"
          onclick="doRun('${t.id}', true)">Run it anyway</button>`;
    else if (r && r.error) footer = `<span class="err">${esc(r.error)}</span>`;
    else if (r && r.code !== undefined)
      footer = `<span class="${r.code===0?'exit0':'exitN'}">exit ${r.code}</span>`;

    // Retained output is evidence, so it is worth opening, not just counting.
    // A tool that declares which of its files are output is listed down to
    // those: everything a scan wrote is still on disk, but bbot's nine working
    // files buried the four you came for.
    const filerow = runFiles(t, r);

    // Two panels, the shape the map uses: what you set on the left, what came
    // back on the right. The command, the target list and the reference for
    // writing them are one job; the log, the files it wrote and what went on
    // the map are another. They used to run down the page in one column with
    // --help beside the output, which put the reference next to the results and
    // the settings nowhere near each other.
    const runPane = `
      <div class="runbox">
       <div class="split">
        <div class="runside">
        <div class="lbl" style="margin-top:0"><span>command</span>
          <span class="sub">
            ${overridden ? `<span class="pill">edited</span>
              <span style="cursor:pointer;color:var(--accent)"
                    onclick="resetCommand('${t.id}')">use default</span> · ` : ""}
            ${editing ? `<span style="cursor:pointer;color:var(--accent)"
                    onclick="saveCommand('${t.id}')">save</span> ·
              <span style="cursor:pointer" onclick="cancelCommand('${t.id}')">cancel</span>`
              : `<span style="cursor:pointer;color:var(--accent)"
                    onclick="editCommand('${t.id}')">edit</span>`} ·
            runs ${esc(t.binary_path||t.entrypoint||t.id)}</span></div>
        <div class="fields">
          <input id="cmd-${t.id}" value="${esc(prefill)}" placeholder="${esc(hint)}"
                 ${editing ? "" : "readonly"}
                 oninput="syncInputBox('${t.id}')"
                 onkeydown="if(event.key==='Enter')${editing?`saveCommand('${t.id}')`:`doRun('${t.id}')`}">
          ${busy
            ? `<button class="stop" onclick="doStop('${t.id}')">Stop</button>`
            : `<button onclick="doRun('${t.id}')">Run</button>`}
        </div>
        ${(()=>{
          const wantsInput = /\{\{input\}\}/.test(prefill || tmpl);
          if(!wantsInput) return "";
          // Auto-filled from the map the first time, so the normal path is
          // "check this looks right, hit Run" — not a paste.
          const mi = mapInput(t.id);
          if(!inbox.has(t.id) && mi.vals.length) inbox.set(t.id, mi.vals.join("\n"));
          const val = inbox.get(t.id) || "";
          const n = val.split("\n").filter(l=>l.trim()).length;
          const editing = inEdit.has(t.id);
          // Naming what was withheld matters more than the count that is here:
          // a list quietly two short is how you end up thinking a host was
          // scanned when it never was.
          const label = n
            ? `<b>${n}</b> ${mi.fromPorts ? "probe" : (mi.kind||"target")}${
                n===1?"":"s"} from the map${
                mi.fromPorts ? ` · ${mi.fromPorts} open port${
                  mi.fromPorts===1?"":"s"} × the names that reach them` : ""}${
                mi.held ? ` · <span class="exitN">${mi.held} out of scope held
                  back</span>` : ""}`
            : mi.held
              ? `<span class="exitN">nothing in scope to scan — ${mi.held} out of
                 scope held back</span>`
              : `<span class="exitN">nothing on the map to scan yet</span>`;
          return `<div class="inwrap">
            <div class="lbl" style="margin-top:10px"><span>will scan</span>
              <span class="sub">
                ${mi.vals.length && mi.vals.length !== n
                  ? `<span style="cursor:pointer;color:var(--accent)"
                       onclick="fillFromMap('${t.id}')">refresh to ${mi.vals.length}</span> · `
                  : ""}
                <span style="cursor:pointer;color:var(--accent)"
                      onclick="toggleInEdit('${t.id}')">${editing?"done":"review / edit"}</span>
              </span>
            </div>
            <div class="sub">${label}${n && !editing
              ? ` — <code>${esc(val.split("\n").slice(0,3).join(", "))}${
                  n>3?`, +${n-3} more`:""}</code>` : ""}</div>
            <textarea id="in-${t.id}" rows="6" spellcheck="false" ${editing?"":"hidden"}
              oninput="countInput('${t.id}')"
              placeholder="one per line">${esc(val)}</textarea>
          </div>`;})()}
        <div class="lbl" style="margin-top:10px"><span>--help</span>
          <span class="sub" style="cursor:pointer;color:var(--accent)"
                onclick="refreshHelp('${t.id}')">refresh</span></div>
        <pre class="term">${t.help_text ? ansiToHtml(t.help_text) : esc("(no help captured — try running `"+t.id+" --help` above)")}</pre>
        </div>
        <div class="runside">
          <div class="lbl" style="margin-top:0"><span>output</span>${footer}</div>
          <pre class="term" id="run-${t.id}">${ansiToHtml(clip(runout.get(t.id)))}</pre>
          ${filerow}
          <div id="promote-${t.id}" class="promote"></div>
        </div>
       </div>
      </div>`;
    const infoPane = `
      <div class="body">
        <div class="kv">
          <div>source</div><div><code>${esc(t.source_url)}</code></div>
          <div>section</div><div>${esc(t.section)}</div>
          <div>strategy</div><div>${esc(t.strategy||"—")}</div>
          <div>binary</div><div><code>${esc(t.binary_path||"—")}</code></div>
          <div>install</div><div><code>${esc(t.install_cmd||"—")}</code></div>
          <div>version</div><div><code>${esc(t.version||"—")}</code></div>
          <div>commit</div><div><code>${esc(t.resolved_ref||"—")}</code></div>
        </div>
        <div class="lbl" style="margin-top:10px"><span>Setup Log</span></div>
        <pre class="term" id="log-${t.id}">${ansiToHtml(clip(logs.get(t.id)))}</pre>
        ${t.status!=="failed" ? "" : `
        <div class="manual">
          <div class="lbl"><span>provide the install yourself</span></div>
          <div class="sub" style="margin-bottom:8px">
            Copy the install line from the project&rsquo;s README &mdash; it runs
            through the same gate as every other recipe. One command, no shell:
            pipes, <code>&amp;&amp;</code> and redirection are rejected.
          </div>
          <textarea id="man-${t.id}" rows="3" spellcheck="false"
            placeholder="pip install -r requirements.txt">${esc(t.manual_install||"")}</textarea>
          <div class="fields" style="margin-top:8px">
            <button onclick="event.stopPropagation();sendManual('${t.id}')">Install this</button>
            <button class="ghost" onclick="event.stopPropagation();copyPrompt('${t.id}')">Copy prompt for an AI</button>
            <span class="sub" id="manmsg-${t.id}"></span>
          </div>
        </div>`}
      </div>`;
    // Two surfaces, two jobs. "Add Tool" is where installs live: every tool,
    // its setup log, retry and the paste box. A section is where you *use* the
    // tool, so it shows only the run box — mixing them meant scrolling past
    // build output to reach a command line.
    const notReady = `<div class="body"><div class="sub">
        ${esc(t.status)} — installs are managed under
        <a style="color:var(--accent);cursor:pointer"
           onclick="event.stopPropagation();setView('add')">Add Tool</a>.
      </div></div>`;
    // In a section the run box leads, but the setup log stays one click away —
    // it is what you check when a tool misbehaves at runtime.
    const tabBar = `<div class="body" style="padding-bottom:0">
        <div class="tabs">
          <a class="${tab==='run'?'on':''}" onclick="setPane('${t.id}','run')">Run</a>
          <a class="${tab==='log'?'on':''}" onclick="setPane('${t.id}','log')">Setup Log</a>
          <a class="${tab==='hist'?'on':''}" onclick="showHistory('${t.id}')">History</a>
        </div></div>`;
    // A phase is where you work on one or two tools, so its cards stay open —
    // collapsing the run box behind a click is friction on the thing you came
    // there to do. The Map and Add Tool fold instead: six baseline cards, each
    // with a command line, an output pane and a --help pane, is a wall you have
    // to scroll past to reach the map they exist to fill in.
    //
    // A running tool opens itself, and stays open afterwards, because the
    // output arriving is the reason you started it.
    const folds = fold || mode === "manage";
    const expanded = folds ? (open.has(t.id) || busy) : true;
    const bodyHtml = !expanded ? ""
      : mode === "manage" ? infoPane
      : t.status !== "ready" ? notReady
      : tabBar + (tab === "run" ? runPane
                : tab === "hist" ? `<div class="body"><div id="hist-${t.id}">
                    <div class="sub">loading…</div></div></div>`
                : infoPane);
    return `<div class="card">
      <div class="top" ${folds ? `onclick="toggle('${t.id}')"`
                               : 'style="cursor:default"'}>
        <div><span class="nm">${folds
            ? `<span class="fold">${expanded ? "▾" : "▸"}</span> ` : ""}${esc(t.id)}</span>
          ${mode === "run" && t.baseline ? "" : detail}</div>
        <div class="right">
          ${folds && !expanded ? footer : ""}${badge}${actions}
          ${mode === "manage"
            ? `<button class="ghost" title="Uninstall the image everywhere"
                 onclick="event.stopPropagation();drop('${t.id}')">✕</button>`
            : `<button class="ghost" title="Remove from this section (keeps the image)"
                 onclick="event.stopPropagation();unassign('${t.id}','${sect||""}')">⊖</button>`}</div>
      </div>${bodyHtml}</div>`;
  };

  // Group under section headings, in engagement order. Empty sections are
  // hidden — an external test rarely uses every phase, and blank headers are
  // just noise. Anything with an unrecognised section (an older record, or one
  // whose section was retired) falls through to a final group rather than
  // vanishing from the list.
  if(view === "add"){
    // Two lists, because they answer to different people. What you installed is
    // yours to retry, re-point and remove; the baseline arrives with every
    // engagement and is the methodology, so a build failure in one of those is a
    // different kind of problem. One list sorted by date interleaved them and
    // buried the tool you just added among seven you never chose.
    const all = [...tools.values()].sort((a,b)=>b.created_at-a.created_at);
    const panel = (label, list, note, empty) => `
      <div class="mappanel" style="display:block;margin-bottom:14px">
        <div class="mapband"><span>${label}</span>
          <span>${list.length ? `${list.length} tool${
            list.length === 1 ? "" : "s"}` : "none"}</span></div>
        ${note ? `<div class="sub" style="margin-bottom:6px">${note}</div>` : ""}
        ${list.length ? list.map(t=>card(t,"manage")).join("")
          : `<div class="sub">${empty}</div>`}
      </div>`;
    document.getElementById("alllist").innerHTML =
      panel("installed tools", all.filter(t=>!t.baseline), "",
            "Nothing yet — paste a repository above.")
    + panel("baseline", all.filter(t=>t.baseline),
            "Installed into every engagement. Run them from the Map.",
            "The baseline has not been installed for this engagement.");
    return;
  }
  if(view === "map"){ renderMap(card); return; }

  // A phase shows only what you added — the baseline is under Map.
  const el = document.getElementById("list");
  const list = phasesUnder(view).flatMap(k=>toolsIn(k)).filter(t=>!t.baseline);
  // No picker here. A tool's section is chosen once, when you install it under
  // Add Tool, so there is one answer to "where does this live" instead of two
  // that can disagree.
  const subs = phasesUnder(view);
  // What the baseline did in this phase, as a record — no run box.
  //
  // Baseline tools were taken out of the phases when the Map grew its own phase
  // panel, because one tool with two cards meant two input boxes and two Run
  // buttons, and no way to tell which one you had just used. That reasoning is
  // about *running* them. It says nothing about reading what they produced, and
  // a phase page that says "Nothing in Reconnaissance yet" after reconnaissance
  // has run is simply wrong.
  //
  // So: the streams and the files, and one line saying where it is started from.
  // Started in one place, readable in both.
  // Only what the phase itself runs. curl and openssl are microscopes you aim at
  // one node — they take a single target and are started from that node's pane —
  // so their output belongs there, not in a record of what the phase did. Same
  // filter the phase sweep uses, so the two cannot disagree about what is part
  // of the phase.
  // Grouped by the phase that ran them, so a merged entry keeps the two apart:
  // "11 names" and "9 open ports" answer different questions, and a single run
  // of streams would not say which tool was doing which.
  const groups = phasesUnder(view)
    .map(k=>({key: k, label: SECTION_LABEL.get(k) || k,
              mine: phaseTools(k).filter(sweeps)}))
    .filter(g=>g.mine.length);
  const mine = groups.flatMap(g=>g.mine);
  const hasRun = t => runs.has(t.id) || runout.has(t.id);
  const ran = mine.filter(hasRun);
  // Folded unless you opened it: the baseline sits under your own sections as a
  // record to go and read, and four open streams would push them off the page.
  const folded = !runOpen(view, false);
  // One phase under this entry does not need a header saying so.
  const sub = g => groups.length < 2 ? "" :
    `<div class="lbl" style="margin-top:10px"><span>${esc(g.label)}</span>
       <span class="sub">${g.mine.filter(hasRun).length
         ? `${g.mine.filter(hasRun).length} of ${g.mine.length} run`
         : "not run yet"}</span></div>`;
  const baselineBlock = !mine.length ? "" : `
    <div class="lbl" style="margin-top:18px"><span>${
      ran.length ? runFold(view, false) : ""}baseline</span>
      <span class="sub">${ran.length
        ? `${ran.length} of ${mine.length} ${mine.length === 1 ? "tool has" : "tools have"} run`
        : `${mine.length} ${mine.length === 1 ? "tool" : "tools"}, none run yet`}
        · started from <a style="color:var(--accent);cursor:pointer"
            onclick="setView('map')">Map</a></span></div>
    <div class="card" style="padding:12px;margin-bottom:14px">
      ${!ran.length ? `<div class="sub">${esc(mine.map(t=>t.id).join(", "))} —
             nothing has run here yet</div>`
        : folded ? `<div class="sub" style="cursor:pointer"
             onclick="toggleRunFold('${esc(view)}',false)">${
             esc(ran.map(t=>t.id).join(", "))} — output folded away, click to read</div>`
        : groups.map(g=>sub(g) + (g.mine.filter(hasRun).length
            ? g.mine.filter(hasRun).map(t=>reconStream(t, "p")).join("")
            : `<div class="sub" style="margin-top:4px">${
                 esc(g.mine.map(t=>t.id).join(", "))} — not run yet</div>`)).join("")}
    </div>`;

  // Your own tools, one block per section under this entry. The picker is first
  // because adding is what you came here to do; the baseline is last because it
  // is a record of something that already happened.
  const yours = subs.length < 2
    ? (list.length ? list.map(t=>card(t,"run",view)).join("")
        : `<div class="empty">Nothing added to ${navLabel(view)} yet.</div>`)
    : subs.map(k=>{
        const own = toolsIn(k).filter(t=>!t.baseline);
        const ready = own.filter(t=>t.status === "ready").length;
        // The map's panel shape: a heading and its tally on one rule, and the
        // whole section enclosed so it reads as one thing rather than as cards
        // that happen to follow a label.
        return `<div class="mappanel" style="display:block;margin-bottom:14px">
            <div class="mapband"><span>${esc(SECTION_LABEL.get(k) || k)}</span>
              <span>${own.length
                ? `${own.length} tool${own.length === 1 ? "" : "s"}${
                    ready === own.length ? "" : ` · ${ready} ready`}`
                : "empty"}</span></div>
            ${own.length ? own.map(t=>card(t,"run",k)).join("")
              : `<div class="sub">Nothing added yet — pick one above.</div>`}
          </div>`;
      }).join("");

  el.innerHTML = yours + baselineBlock;
  // keep logs scrolled to the newest line
  tools.forEach((t,id)=>{ const p=document.getElementById("log-"+id); if(p) p.scrollTop=p.scrollHeight; });
}
function paintLog(id){
  const p = document.getElementById("log-"+id);
  if(!p) return;   // not on screen; the buffer paints when the view opens
  stickToBottom(p, ansiToHtml(clip(logs.get(id))));
}

/* ---- promoting run output onto the map ---- */

// Ask the server what it sees. Nothing is written — this is the decision view.
// The answer is kept per tool rather than left in the DOM, so a render, a status
// event or a page refresh cannot throw away a decision you have not made yet.
async function offerPromote(toolId, runId){
  promote.set(toolId, {run:runId, loading:true, rows:[], edges:[],
                       total:0, news:[], sel:new Set(), msg:"", done:false});
  paintPromote(toolId);
  let d;
  try{
    d = await (await fetch(`/projects/${proj.id}/map/classify`,{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({run:runId})})).json();
  }catch(e){ promote.delete(toolId); paintPromote(toolId); return; }

  promote.set(toolId, {run:runId, loading:false, rows:d.rows||[],
                       edges:d.edges||[], total:d.total||0, folded:d.folded||{},
                       missing:d.missing_result||"",
                       // Set when the run was aimed at a node: the server links
                       // what lands to it and marks the check against it.
                       parent:nodeRunOf.get(toolId) || "",
                       sel:new Set(), touched:new Set(),   // by row id, not index
                       msg:""});
  paintPromote(toolId);
}

// What the classify said, re-read against the map as it is now. Status is not
// taken from the response: the map changes under this box — you delete a node,
// promote from another tool — and a cached "already known" then hides a row you
// have just removed, with no way back short of re-running the scan.
function promoteView(st){
  const rows = (st.rows||[]).map(r=>{
    const n = (mapData.nodes||{})[r.id];
    return {...r, known: !!n, in_scope: n ? n.in_scope !== false : r.in_scope};
  });
  // An enrich-only row is evidence about a node, never a new one — a host that
  // did not respond, a port the map holds that came back filtered this time. The
  // server refuses to create a node from one, so offering it as a tick would be
  // a checkbox that does nothing.
  const fresh = rows.filter(r=>!r.known && !r.enrich_only);
  // Rows the map already has that carry new evidence. Applied without being
  // offered: they are not a decision you make, they are what the scan saw. Until
  // this existed a re-scan landed nothing at all — every row was `known`, so
  // every scan.* attribute was dropped on the floor.
  const enrich = rows.filter(r=>r.known && r.attrs
                                && Object.keys(r.attrs).length);
  return {rows, fresh, enrich, offered: fresh};
}

// In scope, and you have not said otherwise. Reviewing 500 lines was never going
// to happen; reviewing the handful that are new and unexpected will.
const promoteChecked = (st, r) =>
  st.touched.has(r.id) ? st.sel.has(r.id) : r.in_scope;

// Draws the box from that kept state. Pure paint — no fetch — so it is safe to
// call on every render.
function paintPromote(toolId){
  const box = document.getElementById(`promote-${toolId}`);
  if(!box) return;                 // tool not on screen; paints when it is
  const st = promote.get(toolId);
  if(!st){ box.innerHTML = ""; return; }
  if(st.loading){ box.innerHTML = `<div class="sub">reading output…</div>`; return; }
  if(!st.total){
    // Which is a very different thing from "the command never wrote the file
    // its results were supposed to be in".
    box.innerHTML = st.missing
      ? `<div class="sub"><span class="exitN">this run wrote no
           <code>${esc(st.missing)}</code></span> — promotion reads that file and
           nothing else, so check the command still writes it</div>`
      : `<div class="sub">nothing recognisable to promote</div>`;
    return;
  }
  const {fresh, offered, enrich} = promoteView(st);
  const oos = fresh.filter(r=>!r.in_scope).length;
  // Relations this output reports that both ends are on the map for, and that
  // the map does not have yet. Usually zero — new rows bring their edges with
  // them — but it is how a resolution promoted before edges landed correctly
  // gets connected without clearing the map and scanning again.
  const hasEdge = e => Object.values(mapData.edges||{})
    .some(x=>x.frm===e.frm && x.rel===e.rel && x.to===e.to);
  const onMap = id => !!(mapData.nodes||{})[id];
  const missing = (st.edges||[]).filter(e=>onMap(e.frm) && onMap(e.to) && !hasEdge(e));

  // Names under a wildcard are reported, not offered — you should know the scan
  // saw them, and that they are one host rather than a dozen findings.
  const folds = Object.entries(st.folded||{});
  const foldedN = folds.reduce((n,[,c])=>n+c, 0);
  const foldLine = foldedN
    ? ` · ${foldedN} folded into ${folds.map(([p])=>"*."+esc(p)).join(", ")}` : "";

  box.innerHTML = `
    <div class="lbl" style="margin-top:10px"><span>promote to map</span>
      <span class="sub">${st.total} found · ${fresh.length} new
        ${enrich.length?` · ${enrich.length} update${enrich.length===1?"":"s"} to
          nodes you already have`:""}
        ${missing.length?` · ${missing.length} link${missing.length===1?"":"s"}`:""}
        ${oos?` · <span class="exitN">${oos} out of scope</span>`:""}${foldLine}</span></div>
    ${offered.length ? `
      <div class="promoterows">${offered.map(r=>`
        <label class="${r.in_scope?"":"oos"}">
          <input type="checkbox" ${promoteChecked(st,r)?"checked":""}
                 onchange="togglePromote('${toolId}','${esc(r.id)}',this.checked)">
          <code>${esc(r.line)}</code>
          <span class="sub">${esc(r.kind)}${r.in_scope?"":" · outside scope"}</span>
        </label>`).join("")}</div>
      <div class="fields" style="margin-top:8px">
        <button onclick="commitPromote('${toolId}')">Add selected</button>
        <button class="ghost" onclick="commitPromote('${toolId}', true)"
          title="${oos ? `Includes ${oos} outside scope` : "Every row offered"}"
          >Add all ${offered.length}</button>
        <span class="sub" id="promsg-${toolId}">${esc(st.msg)}</span>
      </div>`
    : `<div class="sub">all ${st.total} already on the map</div>
       ${missing.length || enrich.length ? `<div class="fields" style="margin-top:8px">
         ${enrich.length ? `<button onclick="commitPromote('${toolId}')"
           title="A re-scan of things you already have — what each one looks like
                  now, recorded against it">Record ${enrich.length}
           update${enrich.length===1?"":"s"}</button>` : ""}
         ${missing.length ? `<button ${enrich.length?'class="ghost"':""}
           onclick="commitPromote('${toolId}', false, true)"
           title="Connect nodes this output says are related">Add ${missing.length}
           link${missing.length===1?"":"s"}</button>` : ""}
         <span class="sub" id="promsg-${toolId}">${esc(st.msg)}</span></div>` : ""}`}`;
}

// Ticks live in the state, not the checkboxes, for the same reason as above —
// and by row id, not row position, because the offered list changes as the map
// does. An index-keyed tick silently moved to a different row.
function togglePromote(toolId, id, on){
  const st = promote.get(toolId);
  if(!st) return;
  st.touched.add(id);
  on ? st.sel.add(id) : st.sel.delete(id);
}


/* ---- the reconnaissance sequence ----------------------------------------
   Discover with every subdomain tool at once, review the union once, then
   resolve what you accepted. Three steps because of where the decision sits:
   everything before the review is public sources, everything after it is the
